<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reader | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #0a0a0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --glass: rgba(30, 30, 35, 0.4);
            --border: rgba(255, 255, 255, 0.08);

            /* Typography Variables */
            --reader-size: 1.25rem;
            --reader-height: 1.85;
            --reader-font: 'Crimson Pro', serif;
        }

        /* --- THEME DNA: Eye-Comfort Palettes --- */
        body.theme-sepia {
            --paper-bg: #f4ecd8; /* Warm paper tone */
            --text-main: #433422; /* Coffee bean brown */
            --text-muted: #8c7e6a;
            --glass: rgba(67, 52, 34, 0.05);
            --border: rgba(67, 52, 34, 0.12);
            --accent: #936639;
        }

        body.theme-light {
            --paper-bg: #f8fafc; /* Soft off-white to reduce glare */
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass: rgba(0, 0, 0, 0.03);
            --border: rgba(0, 0, 0, 0.08);
            --accent: #4f46e5;
        }

        body {
            background-color: var(--paper-bg);
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Smoother transition for eye comfort */
            transition: background-color 0.6s ease, color 0.6s ease, border-color 0.6s ease;
        }

        /* Elements transition smoothly when theme changes */
        .glass-card, header, aside, footer, button, a {
            transition: all 0.4s ease;
        }

        /* --- SCROLLBAR DNA --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* --- LAYOUT DNA --- */
        @media (min-width: 1024px) {
            .app-container { display: flex; height: 100vh; overflow: hidden; }
            .story-scroll-area { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
            .sidebar-fixed-area { 
                width: 400px; 
                height: 100vh; 
                border-left: 1px solid var(--border);
                background: var(--paper-bg);
            }
        }

        .glass-card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
            border-radius: 2rem;
        }

        /* --- HEADER ORB DNA --- */
        .header-orb {
            position: relative; width: 40px; height: 40px;
            background: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .header-orb::before {
            content: ''; position: absolute; inset: -2px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--accent), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude; animation: rotate 4s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .popup-window {
            background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent */
            backdrop-filter: blur(20px);               /* The blur effect */
            -webkit-backdrop-filter: blur(20px);        /* Safari support */
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* --- TYPOGRAPHY DNA --- */
        .serif-content {
            font-family: var(--reader-font);
            font-size: var(--reader-size);
            line-height: var(--reader-height);
            color: var(--text-main);
            transition: font-size 0.2s ease, line-height 0.2s ease;
        }
        .drop-cap::first-letter {
            float: left; font-size: 5rem; line-height: 0.8;
            padding: 0.5rem 0.75rem 0 0; font-weight: 800;
            color: var(--accent); text-transform: uppercase;
        }

        #reading-progress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--accent); z-index: 1001; transition: width 0.2s;
        }

        .theme-btn {
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .theme-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        #mobile-drawer {
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #mobile-drawer.open { transform: translateY(0); }
    </style>
</head>
<body class="antialiased">

    <div id="reading-progress"></div>

    <header class="fixed top-0 w-full z-50 bg-[var(--paper-bg)]/80 backdrop-blur-xl border-b border-[var(--border)]">
        <div class="max-w-[1600px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <button onclick="GoBack()" class="group flex items-center gap-2 text-[var(--text-muted)] hover:text-indigo-400 transition-colors">
                    <i data-lucide="chevron-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] hidden md:block">Exit Archive</span>
                </button>
                <div class="h-6 w-[1px] bg-[var(--border)]"></div>
                <div class="truncate max-w-[200px] md:max-w-md">
                    <h1 id="header-story-title" class="text-[10px] font-black text-[var(--text-main)] uppercase tracking-[0.3em] truncate">Loading Narrative...</h1>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 bg-black/20 p-1.5 rounded-full border border-[var(--border)]">
                    <button id="font-style" class=" w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="type" ></i></button>
                    <button id="font-size" class=" w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="a-large-small"></i></button>
                </div>
                <!-- Popup for font style-->
                <div id="font-style-popup" class="popup-window fixed hidden z-[100] w-64 glass-card p-4 shadow-2xl border border-white/10 transition-all duration-200">
                    <h4 class="text-[10px] font-black uppercase text-indigo-400 mb-2">select the font style</h4>
                    <div class="flex justify-between gap-4">
                        <button onclick="setFont('serif')" class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)]">Serif</button>
                        <button onclick="setFont('sans')" class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)]">Sans</button>
                    </div>
                </div>
                <!--font size pop up-->
                <div id="font-size-popup" class="popup-window fixed hidden z-[100] w-64 glass-card p-4 shadow-2xl border border-white/10 transition-all duration-200">
                    <h4 class="text-[10px] font-black uppercase text-indigo-400 mb-2">adjust the font size</h4>
                    <input type="range" min="14" max="50" value="18" class="w-full accent-indigo-500" oninput="updateSize(this.value)">
                </div>

                <div class="hidden md:flex items-center gap-2 bg-black/20 p-1.5 rounded-full border border-[var(--border)]">
                    <button onclick="setTheme('dark')" class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="moon" class="w-4 h-4"></i></button>
                    <button onclick="setTheme('sepia')" class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="coffee" class="w-4 h-4"></i></button>
                    <button onclick="setTheme('light')" class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="sun" class="w-4 h-4"></i></button>
                </div>
                <div class="header-orb">
                    <i data-lucide="target" class="w-4 h-4 text-indigo-400"></i>
                </div>
            </div>
        </div>
    </header>

    <div class="app-container max-w-[1600px] mx-auto">
        <main class="story-scroll-area w-full px-6 md:px-12 lg:px-24 pt-32 pb-40">
            <article class="max-w-2xl mx-auto">
                <div class="mb-16">
                    <div class="flex items-center gap-3 mb-6">
                        <span class="h-[1px] w-8 bg-indigo-500"></span>
                        <span id="chapter-label" class="text-[10px] font-black tracking-[0.4em] text-indigo-500 uppercase">Fragment 00</span>
                    </div>
                    <h2 id="chapter-title" class="text-5xl md:text-7xl font-black text-[var(--text-main)] mb-10 leading-[0.85] tracking-tighter uppercase">Loading...</h2>
                    
                    <div class="flex items-center gap-4 p-4 glass-card inline-flex border-indigo-500/10">
                        <img id="author-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Scribe" class="w-10 h-10 rounded-full bg-indigo-500/10">
                        <div class="flex flex-col pr-4">
                            <span id="author-name" class="text-[10px] text-[var(--text-main)] font-black uppercase tracking-widest">Scribe</span>
                            <span id="read-time" class="text-[9px] text-[var(--text-muted)] font-bold uppercase tracking-wider">Neural Link Active</span>
                        </div>
                    </div>
                </div>

                <div id="story-content" class="serif-content drop-cap selection:bg-indigo-500/30"></div>

                <footer class="mt-32 pt-12 border-t border-[var(--border)] flex flex-col sm:flex-row gap-6 items-stretch">
                    <a id="prev-link" href="#" class="group hidden w-full sm:w-1/2 glass-card p-6 hover:border-indigo-500/30 border-l-4 border-l-transparent hover:border-l-indigo-500 transition-all">
                        <div class="flex items-center gap-4">
                            <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-500 group-hover:-translate-x-1 transition-transform"></i>
                            <div class="overflow-hidden">
                                <p class="text-[9px] uppercase font-black text-indigo-500 mb-1 tracking-[0.2em]">Previous</p>
                                <h4 id="prev-title" class="text-sm font-black text-[var(--text-main)] truncate uppercase">Fragment Name</h4>
                            </div>
                        </div>
                    </a>

                    <a id="next-link" href="#" class="group hidden w-full sm:w-1/2 sm:ml-auto glass-card p-6 text-right hover:border-indigo-500/30 border-r-4 border-r-transparent hover:border-r-indigo-500 transition-all">
                        <div class="flex items-center justify-end gap-4">
                            <div class="overflow-hidden">
                                <p class="text-[9px] uppercase font-black text-indigo-500 mb-1 tracking-[0.2em]">Proceed</p>
                                <h4 id="next-title" class="text-sm font-black text-[var(--text-main)] truncate uppercase">Fragment Name</h4>
                            </div>
                            <i data-lucide="arrow-right" class="w-5 h-5 text-indigo-500 group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </a>
                </footer>
            </article>
        </main>

        <aside class="sidebar-fixed-area hidden lg:block p-10">
            <div class="space-y-8 mt-24">
                <div class="glass-card p-8 border-indigo-500/10">
                    <div class="flex items-center gap-2 text-indigo-500 mb-6">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        <span class="text-[9px] font-black uppercase tracking-[0.3em]">Archive Metadata</span>
                    </div>
                    <h3 id="sidebar-story-name" class="text-[var(--text-main)] font-black text-xl mb-4 uppercase tracking-tighter leading-tight">Story Title</h3>
                    <p id="sidebar-description" class="text-xs text-[var(--text-muted)] leading-relaxed font-medium">Loading decryption...</p>
                </div>

                <div class="glass-card p-8 border-indigo-500/10">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="text-[9px] font-black text-indigo-500 uppercase tracking-widest">Sequence Progress</h4>
                        <span id="progress-percent" class="text-[9px] font-black text-[var(--text-main)]">0%</span>
                    </div>
                    <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                        <div id="sidebar-progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-700 ease-out shadow-[0_0_10px_rgba(79,70,229,0.5)]"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <div id="mobile-drawer" class="lg:hidden fixed inset-x-0 bottom-0 bg-[var(--paper-bg)] border-t border-[var(--border)] rounded-t-[2.5rem] p-8 pb-12 shadow-2xl">
        <div class="w-12 h-1 bg-indigo-500/20 rounded-full mx-auto mb-8"></div>
        <div class="space-y-8">
            <div class="grid grid-cols-3 gap-3">
                <button onclick="setTheme('dark')" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Dark</button>
                <button onclick="setTheme('sepia')" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Sepia</button>
                <button onclick="setTheme('light')" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Light</button>
            </div>
            <div class="space-y-4">
                <p class="text-[9px] font-black text-indigo-500 uppercase text-center tracking-widest">Text Configuration</p>
                <div class="flex justify-between gap-4">
                    <button onclick="setFont('serif')" class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)]">Serif</button>
                    <button onclick="setFont('sans')" class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)]">Sans</button>
                </div>
                <input type="range" min="14" max="24" value="18" class="w-full accent-indigo-500" oninput="updateSize(this.value)">
            </div>
        </div>
    </div>

    <div class="lg:hidden fixed bottom-0 inset-x-0 h-20 bg-[var(--paper-bg)]/90 backdrop-blur-2xl border-t border-[var(--border)] px-8 flex items-center justify-between z-50">
        <button onclick="GoBack()" class="text-[var(--text-muted)]"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <button id="drawer-btn" class="bg-indigo-600 px-8 py-3 rounded-xl text-[10px] font-black text-white uppercase tracking-widest shadow-xl">Settings</button>
        <button class="text-[var(--text-muted)]"><i data-lucide="share-2" class="w-5 h-5"></i></button>
    </div>

    <script>
        
        // 1. Function to position and show the popup
        function setupPopup(triggerId, popupId) {
            const btn = document.getElementById(triggerId);
            const popup = document.getElementById(popupId);

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                
                const isHidden = popup.classList.contains('hidden');
                
                // Close all other open popups first (optional but recommended)
                document.querySelectorAll('.popup-window').forEach(p => p.classList.add('hidden'));

                if (isHidden) {
                    const rect = btn.getBoundingClientRect();
                    popup.style.top = `${rect.bottom + window.scrollY + 10}px`;
                    popup.style.left = `${rect.left + window.scrollX - 50}px`;
                    
                    popup.classList.remove('hidden');
                }
            });

            // Close when clicking outside
            document.addEventListener('click', (e) => {
                if (!popup.contains(e.target) && e.target !== btn) {
                    popup.classList.add('hidden');
                }
            });
        }

        setupPopup('font-style', 'font-style-popup');
        setupPopup('font-size', 'font-size-popup');

    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        
        import firebaseConfig from '/firebase-config.js';
        const appId = 'taletranscend-pro';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const taleId = urlParams.get('taleId');
        const chapterIdx = parseInt(urlParams.get('chapterId')) || 0;

        // --- THEME LOGIC: Persist in LocalStorage ---
        window.setTheme = (theme) => {
            document.body.classList.remove('theme-sepia', 'theme-light');
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            
            if (theme === 'sepia') document.body.classList.add('theme-sepia');
            if (theme === 'light') document.body.classList.add('theme-light');
            
            // Highlight active button in both mobile and desktop menus
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${theme}'`)) {
                    btn.classList.add('active');
                }
            });

            localStorage.setItem('reader-theme', theme);
        };

        window.setFont = (font) => {
            const fontMap = { 
                serif: "'Crimson Pro', serif", 
                sans: "'Plus Jakarta Sans', sans-serif", 
                mono: "'JetBrains Mono', monospace" 
            };
            document.documentElement.style.setProperty('--reader-font', fontMap[font]);
            document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`.font-btn[onclick="setFont('${font}')"]`).forEach(b => b.classList.add('active'));
            localStorage.setItem('reader-font', font);
        };

        window.updateSize = (val) => {
            document.documentElement.style.setProperty('--reader-size', val + 'px');
            localStorage.setItem('reader-size', val);
        };


        // Initialize saved theme
        const savedTheme = localStorage.getItem('reader-theme') || 'dark';
        window.setTheme(savedTheme);

        

        // --- PROGRESS LOGIC ---
        const scrollContainer = document.querySelector('.story-scroll-area') || window;
        const target = document.querySelector('.story-scroll-area') ? document.querySelector('.story-scroll-area') : document.documentElement;

        target.addEventListener('scroll', () => {
            const winScroll = target.scrollTop;
            const height = target.scrollHeight - target.clientHeight;
            if (height <= 0) return;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("reading-progress").style.width = scrolled + "%";
            document.getElementById("sidebar-progress-bar").style.width = scrolled + "%";
            document.getElementById("progress-percent").innerText = Math.round(scrolled) + "%";
        });

        async function loadChapterContent() {
            if (!taleId) return;

            try {
                // 1. Load Tale Metadata
                const taleRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId);
                const taleSnap = await getDoc(taleRef);

                if (taleSnap.exists()) {
                    const taleData = taleSnap.data();
                    document.getElementById('header-story-title').textContent = taleData.title;
                    document.getElementById('sidebar-story-name').textContent = taleData.title;
                    document.getElementById('sidebar-description').textContent = taleData.description;
                    document.getElementById('author-name').textContent = taleData.authorName || "Unknown Scribe";
                }

                // 2. Load Chapters
                const chaptersRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId, 'chapters');
                const chaptersSnap = await getDocs(chaptersRef);
                const allChapters = chaptersSnap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.chapterNum || 0) - (b.chapterNum || 0));

                const currentChapter = allChapters[chapterIdx];
                if (currentChapter) {
                    document.getElementById('chapter-label').textContent = `Fragment ${String(chapterIdx + 1).padStart(2, '0')}`;
                    document.getElementById('chapter-title').textContent = currentChapter.title;
                    
                    document.getElementById('story-content').innerHTML = currentChapter.content
                        .split('\n')
                        .filter(p => p.trim() !== '')
                        .map(p => `<p class="mb-8">${p}</p>`)
                        .join('');

                    // --- 3. UPDATED NAVIGATION LOGIC ---
                    const prev = document.getElementById('prev-link');
                    const next = document.getElementById('next-link');

                    // Reset
                    prev.classList.add('hidden');
                    next.classList.add('hidden');
                    next.classList.remove('sm:ml-auto'); 

                    if (chapterIdx > 0) {
                        prev.href = `reader.html?taleId=${taleId}&chapterId=${chapterIdx - 1}`;
                        prev.classList.remove('hidden');
                        document.getElementById('prev-title').textContent = allChapters[chapterIdx - 1].title;
                    }

                    if (chapterIdx < allChapters.length - 1) {
                        next.href = `reader.html?taleId=${taleId}&chapterId=${chapterIdx + 1}`;
                        next.classList.remove('hidden');
                        document.getElementById('next-title').textContent = allChapters[chapterIdx + 1].title;
                        
                        // If "Previous" is missing, push "Next" to the right
                        if (chapterIdx === 0) {
                            next.classList.add('sm:ml-auto');
                        }
                    }
                }
                lucide.createIcons();
            } catch (err) { console.error(err); }
        }

        onAuthStateChanged(auth, (user) => { if (user) loadChapterContent(); });
        
        const init = async () => {
            await signInAnonymously(auth);
        };
        init();

        window.GoBack = () => { window.location.href = `Tale_page.html?id=${taleId}`; };
        const drawer = document.getElementById('mobile-drawer');
        document.getElementById('drawer-btn').addEventListener('click', () => drawer.classList.toggle('open'));
        lucide.createIcons();
    </script>
</body>
</html>

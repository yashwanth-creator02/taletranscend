<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reader | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #0a0a0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --glass: rgba(30, 30, 35, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --reader-size: 1.25rem;
            --reader-height: 1.85;
            --reader-font: 'Crimson Pro', serif;
        }

        body.theme-sepia {
            --paper-bg: #f4ecd8;
            --text-main: #433422;
            --text-muted: #8c7e6a;
            --glass: rgba(67, 52, 34, 0.05);
            --border: rgba(67, 52, 34, 0.12);
            --accent: #936639;
        }

        body.theme-light {
            --paper-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass: rgba(0, 0, 0, 0.03);
            --border: rgba(0, 0, 0, 0.08);
            --accent: #4f46e5;
        }

        body {
            background-color: var(--paper-bg);
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.6s ease, color 0.6s ease;
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
            border-radius: 2rem;
        }

        /* --- THE MAGIC FROSTED POPUP --- */
        .popup-window {
            background: rgba(var(--paper-bg), 0.7);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        /* --- TYPOGRAPHY TRANSITIONS --- */
        .serif-content {
            font-family: var(--reader-font);
            font-size: var(--reader-size);
            line-height: var(--reader-height);
            color: var(--text-main);
            transition: font-size 0.3s ease, line-height 0.3s ease;
        }

        .header-orb {
            position: relative; width: 40px; height: 40px;
            background: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .header-orb::before {
            content: ''; position: absolute; inset: -2px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--accent), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude; animation: rotate 4s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #reading-progress {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: var(--accent); z-index: 1001; transition: width 0.2s;
        }

        .theme-btn.active, .font-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        #mobile-drawer {
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #mobile-drawer.open { transform: translateY(0); }

        .scrim-active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* --- SCROLLBAR DNA --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <div id="reading-progress"></div>

    <div id="global-scrim" class="fixed inset-0 bg-black/40 backdrop-blur-[2px] z-[45] opacity-0 pointer-events-none transition-all duration-500"></div>

    <header class="fixed top-0 w-full z-50 bg-[var(--paper-bg)]/80 backdrop-blur-xl border-b border-[var(--border)]">
        <div class="max-w-[1600px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <button id="exit-btn" class="group flex items-center gap-2 text-[var(--text-muted)] hover:text-indigo-400 transition-colors">
                    <i data-lucide="chevron-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] hidden md:block">Exit Archive</span>
                </button>
                <div class="h-6 w-[1px] bg-[var(--border)]"></div>
                <h1 id="header-story-title" class="text-[10px] font-black text-[var(--text-main)] uppercase tracking-[0.3em] truncate max-w-[150px] md:max-w-md">Loading...</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 bg-black/20 p-1.5 rounded-full border border-[var(--border)]">
                    <button id="font-style-trigger" class="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:bg-white/10"><i data-lucide="type" class="w-4 h-4"></i></button>
                    <button id="font-size-trigger" class="w-9 h-9 rounded-full flex items-center justify-center transition-all hover:bg-white/10"><i data-lucide="a-large-small" class="w-4 h-4"></i></button>
                </div>

                <div id="font-style-popup" class="popup-window fixed hidden z-[100] w-64 p-6 shadow-2xl transition-all duration-200">
                    <h4 class="text-[9px] font-black uppercase text-indigo-400 mb-4 tracking-widest">Typography Style</h4>
                    <div class="flex flex-col gap-2">
                        <button data-font="serif" class="font-btn w-full py-3 rounded-xl text-[10px] font-bold border border-[var(--border)] uppercase">Classic Serif</button>
                        <button data-font="sans" class="font-btn w-full py-3 rounded-xl text-[10px] font-bold border border-[var(--border)] uppercase">Modern Sans</button>
                    </div>
                </div>

                <div id="font-size-popup" class="popup-window fixed hidden z-[100] w-64 p-6 shadow-2xl transition-all duration-200">
                    <h4 class="text-[9px] font-black uppercase text-indigo-400 mb-4 tracking-widest">Adjust Scale</h4>
                    <input type="range" min="14" max="32" value="18" class="w-full accent-indigo-500 font-size-slider">
                </div>

                <div class="hidden md:flex items-center gap-2 bg-black/20 p-1.5 rounded-full border border-[var(--border)]">
                    <button data-theme="dark" class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="moon" class="w-4 h-4"></i></button>
                    <button data-theme="sepia" class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="coffee" class="w-4 h-4"></i></button>
                    <button data-theme="light" class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"><i data-lucide="sun" class="w-4 h-4"></i></button>
                </div>
                <div class="header-orb"><i data-lucide="target" class="w-4 h-4 text-indigo-400"></i></div>
            </div>
        </div>
    </header>

    <div class="app-container max-w-[1600px] mx-auto flex">
        <main class="story-scroll-area w-full px-6 md:px-12 lg:px-24 pt-32 pb-40 overflow-y-auto h-screen">
            <article class="max-w-2xl mx-auto">
                <div class="mb-16">
                    <div class="flex items-center gap-3 mb-6">
                        <span class="h-[1px] w-8 bg-indigo-500"></span>
                        <span id="chapter-label" class="text-[10px] font-black tracking-[0.4em] text-indigo-500 uppercase">Fragment --</span>
                    </div>
                    <h2 id="chapter-title" class="text-5xl md:text-7xl font-black text-[var(--text-main)] mb-10 leading-[0.85] tracking-tighter uppercase">Initializing...</h2>
                </div>

                <div id="story-content" class="serif-content selection:bg-indigo-500/30"></div>

                <footer class="mt-32 pt-12 border-t border-[var(--border)] flex flex-col sm:flex-row gap-6 items-stretch">
                    <a id="prev-link" href="#" class="group hidden w-full sm:w-1/2 glass-card p-6 hover:border-indigo-500/30 border-l-4 border-l-transparent hover:border-l-indigo-500 transition-all">
                        <div class="flex items-center gap-4">
                            <i data-lucide="arrow-left" class="w-5 h-5 text-indigo-500 group-hover:-translate-x-1 transition-transform"></i>
                            <div class="overflow-hidden">
                                <p class="text-[9px] uppercase font-black text-indigo-500 mb-1 tracking-[0.2em]">Previous</p>
                                <h4 id="prev-title" class="text-sm font-black text-[var(--text-main)] truncate uppercase">Fragment Name</h4>
                            </div>
                        </div>
                    </a>

                    <a id="next-link" href="#" class="group hidden w-full sm:w-1/2 sm:ml-auto glass-card p-6 text-right hover:border-indigo-500/30 border-r-4 border-r-transparent hover:border-r-indigo-500 transition-all">
                        <div class="flex items-center justify-end gap-4">
                            <div class="overflow-hidden">
                                <p class="text-[9px] uppercase font-black text-indigo-500 mb-1 tracking-[0.2em]">Proceed</p>
                                <h4 id="next-title" class="text-sm font-black text-[var(--text-main)] truncate uppercase">Fragment Name</h4>
                            </div>
                            <i data-lucide="arrow-right" class="w-5 h-5 text-indigo-500 group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </a>
                </footer>
            </article>
        </main>

        <aside class="sidebar-fixed-area hidden lg:block w-[450px] p-10 mt-24 border-l border-[var(--border)]">
            <div class="glass-card p-8 mb-6 border-indigo-500/10">
                <h3 id="sidebar-story-name" class="text-[var(--text-main)] font-black text-xl mb-4 uppercase tracking-tighter">Story Title</h3>
                <p id="sidebar-description" class="text-xs text-[var(--text-muted)] leading-relaxed">Decrypting archive metadata...</p>
            </div>
            <div class="glass-card p-8 border-indigo-500/10">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-[9px] font-black text-indigo-500 uppercase">Progress</h4>
                    <span id="progress-percent" class="text-[9px] font-black text-[var(--text-main)]">0%</span>
                </div>
                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                    <div id="sidebar-progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-700 shadow-[0_0_10px_rgba(79,70,229,0.5)]"></div>
                </div>
            </div>
        </aside>
    </div>

    <div id="mobile-drawer" class="lg:hidden fixed inset-x-0 bottom-0 bg-[var(--paper-bg)] border-t border-[var(--border)] rounded-t-[2.5rem] p-8 pb-12 z-[100] shadow-2xl">
        <div class="w-12 h-1 bg-indigo-500/20 rounded-full mx-auto mb-8"></div>
        <div class="space-y-8">
            <div class="grid grid-cols-3 gap-3">
                <button data-theme="dark" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Dark</button>
                <button data-theme="sepia" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Sepia</button>
                <button data-theme="light" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Light</button>
            </div>
            <div class="space-y-4">
                <div class="flex justify-between gap-4">
                    <button data-font="serif" class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)] uppercase font-bold">Serif</button>
                    <button data-font="sans" class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)] uppercase font-bold">Sans</button>
                </div>
                <input type="range" min="14" max="28" value="18" class="w-full accent-indigo-500 font-size-slider">
            </div>
        </div>
    </div>

    <div class="lg:hidden fixed bottom-0 inset-x-0 h-20 bg-[var(--paper-bg)]/90 backdrop-blur-2xl border-t border-[var(--border)] px-8 flex items-center justify-between z-50">
        <button id="mobile-exit" class="text-[var(--text-muted)]"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <button id="drawer-trigger" class="bg-indigo-600 px-8 py-3 rounded-xl text-[10px] font-black text-white uppercase tracking-widest shadow-xl">Settings</button>
        <button class="text-[var(--text-muted)]"><i data-lucide="share-2" class="w-5 h-5"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import firebaseConfig from '/firebase-config.js';

        // --- APP STATE ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'taletranscend-pro';
        const urlParams = new URLSearchParams(window.location.search);
        const taleId = urlParams.get('taleId');
        const chapterIdx = parseInt(urlParams.get('chapterId')) || 0;

        // --- UI CONTROLLER ---
        const UI = {
            scrim: document.getElementById('global-scrim'),
            drawer: document.getElementById('mobile-drawer'),
            popups: document.querySelectorAll('.popup-window'),

            toggleScrim(show) {
                if (show) {
                    this.scrim.classList.add('scrim-active');
                } else {
                    this.scrim.classList.remove('scrim-active');
                }
            },

            closeAll() {
                this.popups.forEach(p => p.classList.add('hidden'));
                this.drawer.classList.remove('open');
                this.toggleScrim(false);
            }
        };

        // --- CORE FUNCTIONS ---
        const Reader = {
            setTheme(theme) {
                document.body.classList.remove('theme-sepia', 'theme-light');
                if (theme === 'sepia') document.body.classList.add('theme-sepia');
                if (theme === 'light') document.body.classList.add('theme-light');

                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                localStorage.setItem('reader-theme', theme);
            },

            setFont(font) {
                const fontMap = { 
                    serif: "'Crimson Pro', serif", 
                    sans: "'Plus Jakarta Sans', sans-serif" 
                };
                document.documentElement.style.setProperty('--reader-font', fontMap[font]);
                document.querySelectorAll('.font-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.font === font);
                });
                localStorage.setItem('reader-font', font);
            },

            updateSize(val) {
                document.documentElement.style.setProperty('--reader-size', val + 'px');
                document.querySelectorAll('.font-size-slider').forEach(s => s.value = val);
                localStorage.setItem('reader-size', val);
            }
        };

        // --- ATTACH EVENT LISTENERS (ID METHOD) ---
        
        // Setup Popups
        function setupPopupTrigger(triggerId, popupId) {
            const btn = document.getElementById(triggerId);
            const popup = document.getElementById(popupId);
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = popup.classList.contains('hidden');
                UI.closeAll();
                if (isHidden) {
                    const rect = btn.getBoundingClientRect();
                    popup.style.top = `${rect.bottom + 15}px`;
                    popup.style.left = `${Math.min(window.innerWidth - 280, rect.left - 100)}px`;
                    popup.classList.remove('hidden');
                    UI.toggleScrim(true);
                }
            });
        }

        setupPopupTrigger('font-style-trigger', 'font-style-popup');
        setupPopupTrigger('font-size-trigger', 'font-size-popup');

        // Theme Buttons
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => Reader.setTheme(btn.dataset.theme));
        });

        // Font Style Buttons
        document.querySelectorAll('.font-btn').forEach(btn => {
            btn.addEventListener('click', () => Reader.setFont(btn.dataset.font));
        });

        // Font Size Sliders
        document.querySelectorAll('.font-size-slider').forEach(slider => {
            slider.addEventListener('input', (e) => Reader.updateSize(e.target.value));
        });

        // Mobile Drawer
        document.getElementById('drawer-trigger').addEventListener('click', () => {
            UI.drawer.classList.add('open');
            UI.toggleScrim(true);
        });

        // Exit Logic
        const exitHandler = () => window.location.href = `Tale_page.html?id=${taleId}`;
        document.getElementById('exit-btn').addEventListener('click', exitHandler);
        document.getElementById('mobile-exit').addEventListener('click', exitHandler);

        // Global Click to Close
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.popup-window') && !e.target.closest('#mobile-drawer')) {
                UI.closeAll();
            }
        });

        // --- FIREBASE DATA LOADING ---
        async function loadChapterContent() {
            if (!taleId) return;
            try {
                const taleRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId);
                const taleSnap = await getDoc(taleRef);
                if (taleSnap.exists()) {
                    const data = taleSnap.data();
                    document.getElementById('header-story-title').textContent = data.title;
                    document.getElementById('sidebar-story-name').textContent = data.title;
                    document.getElementById('sidebar-description').textContent = data.description;
                }

                const chaptersRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId, 'chapters');
                const chaptersSnap = await getDocs(chaptersRef);
                const allChapters = chaptersSnap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.chapterNum || 0) - (b.chapterNum || 0));

                const current = allChapters[chapterIdx];
                if (current) {
                    document.getElementById('chapter-label').textContent = `Fragment ${String(chapterIdx + 1).padStart(2, '0')}`;
                    document.getElementById('chapter-title').textContent = current.title;
                    document.getElementById('story-content').innerHTML = current.content
                        .split('\n').filter(p => p.trim()).map(p => `<p class="mb-8">${p}</p>`).join('');

                    // Navigation
                    const prev = document.getElementById('prev-link');
                    const next = document.getElementById('next-link');
                    if (chapterIdx > 0) {
                        prev.classList.remove('hidden');
                        prev.href = `reader.html?taleId=${taleId}&chapterId=${chapterIdx - 1}`;
                        document.getElementById('prev-title').textContent = allChapters[chapterIdx - 1].title;
                    }
                    if (chapterIdx < allChapters.length - 1) {
                        next.classList.remove('hidden');
                        next.href = `reader.html?taleId=${taleId}&chapterId=${chapterIdx + 1}`;
                        document.getElementById('next-title').textContent = allChapters[chapterIdx + 1].title;
                    }
                }
                lucide.createIcons();
            } catch (err) { console.error(err); }
        }

        // --- INITIALIZATION ---
        const init = async () => {
            await signInAnonymously(auth);
            Reader.setTheme(localStorage.getItem('reader-theme') || 'dark');
            Reader.setFont(localStorage.getItem('reader-font') || 'serif');
            Reader.updateSize(localStorage.getItem('reader-size') || '18');
            lucide.createIcons();
        };

        onAuthStateChanged(auth, (user) => { if (user) loadChapterContent(); });
        
        // Progress tracking
        const scrollArea = document.querySelector('.story-scroll-area');
        scrollArea.addEventListener('scroll', () => {
            const scrolled = (scrollArea.scrollTop / (scrollArea.scrollHeight - scrollArea.clientHeight)) * 100;
            document.getElementById("reading-progress").style.width = scrolled + "%";
            document.getElementById("sidebar-progress-bar").style.width = scrolled + "%";
            document.getElementById("progress-percent").innerText = Math.round(scrolled) + "%";
        });

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Studio | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent: #6366f1;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
        }

        .studio-tab-active {
            color: white;
            position: relative;
        }

        .studio-tab-active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .tale-card-glow:hover {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.1);
        }

        .progress-bar-fill {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .options-menu {
            transform-origin: top right;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .options-menu.hidden {
            display: none;
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
        }

        /* Custom Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-300 antialiased min-h-screen">

    <!-- NAVIGATION -->
    <nav class="fixed top-0 w-full z-50 px-8 py-4 flex justify-between items-center bg-black/40 backdrop-blur-xl border-b border-white/5">
        <a href="index.html" class="font-black text-xl tracking-[0.3em] text-white uppercase italic">Tale<span class="text-indigo-500">Transcend</span></a>
        
        <div class="flex items-center gap-10">
            <!-- Nav Links -->
            <div class="hidden md:flex gap-8 text-[10px] uppercase tracking-[0.2em] font-bold">
                <a href="library.html" class="text-zinc-500 hover:text-white transition">The Archive</a>
                <a href="studio.html" class="text-indigo-400">My Studio</a>
            </div>

            <!-- Profile Entry -->
            <a href="profile.html" class="group flex items-center gap-3 p-1 pr-4 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full transition-all">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
                <span class="text-[9px] font-black uppercase tracking-widest text-zinc-400 group-hover:text-white transition-colors">Profile</span>
            </a>
        </div>
    </nav>

    <main class="pt-32 pb-20 max-w-[1500px] mx-auto px-8">
        
        <!-- STUDIO HEADER -->
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-16">
            <div>
                <p class="text-[10px] font-black uppercase tracking-[0.4em] text-indigo-500 mb-2">Neural Hub / Workspace</p>
                <h1 class="text-5xl font-black uppercase tracking-tighter text-white">My Studio</h1>
            </div>
        </header>

        <!-- TABS SECTION -->
        <div class="flex gap-10 border-b border-white/5 mb-12 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('bookmarked')" id="tab-bookmarked" class="studio-tab-active pb-6 text-[11px] uppercase tracking-[0.25em] font-black transition-all">Bookmarked Fragments</button>
            <button onclick="switchTab('drafts')" id="tab-drafts" class="pb-6 text-zinc-500 hover:text-white text-[11px] uppercase tracking-[0.25em] font-black transition-all">Active Drafts</button>
        </div>

        <!-- REFACTORED TALE GRID -->
        <div id="studio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-8">
            
            <!-- TALE CARD -->
            <div class="glass-panel group relative p-5 rounded-[2.5rem] hover:border-indigo-500/40 transition-all cursor-pointer tale-card-glow overflow-visible">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-indigo-400 uppercase tracking-widest bg-indigo-500/10 px-2 py-1 rounded-md w-fit mb-1">High Fantasy</span>
                        <span class="text-[8px] text-zinc-500 uppercase tracking-tighter">ID: TX-4092</span>
                    </div>
                    <div class="relative">
                        <button onclick="toggleOptions(event, 'menu-1')" title="Options" class="p-2 hover:bg-white/5 rounded-full transition text-zinc-500 hover:text-white">
                            <i data-lucide="more-vertical" class="w-4 h-4"></i>
                        </button>
                        
                        <!-- ENHANCED POPUP WINDOW -->
                        <div id="menu-1" class="options-menu hidden absolute right-0 mt-2 w-56 bg-[#0a0a0a]/95 backdrop-blur-3xl border border-white/10 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-[60] py-3">
                            <div class="px-4 py-1 mb-2">
                                <span class="text-[7px] font-black text-zinc-600 uppercase tracking-[0.3em]">Quick Actions</span>
                            </div>
                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-zinc-400 hover:text-white hover:bg-indigo-500/10 transition flex items-center gap-3">
                                <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Share Signal
                            </button>
                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-zinc-400 hover:text-white hover:bg-indigo-500/10 transition flex items-center gap-3">
                                <i data-lucide="link" class="w-3.5 h-3.5"></i> Copy Universal Link
                            </button>
                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-zinc-400 hover:text-white hover:bg-indigo-500/10 transition flex items-center gap-3">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> Force Offline Sync
                            </button>
                            
                            <div class="h-[1px] bg-white/5 my-2 mx-2"></div>
                            <div class="px-4 py-1 mb-1">
                                <span class="text-[7px] font-black text-zinc-600 uppercase tracking-[0.3em]">Management</span>
                            </div>

                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-zinc-400 hover:text-white hover:bg-indigo-500/10 transition flex items-center gap-3">
                                <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Export as PDF
                            </button>
                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-zinc-400 hover:text-white hover:bg-indigo-500/10 transition flex items-center gap-3">
                                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Mark Finished
                            </button>
                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-orange-400/80 hover:text-orange-400 hover:bg-orange-500/10 transition flex items-center gap-3">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Report Anomaly
                            </button>

                            <div class="h-[1px] bg-white/5 my-2 mx-2"></div>
                            
                            <button class="w-full px-4 py-2 text-left text-[9px] uppercase tracking-widest font-bold text-red-400 hover:bg-red-500/20 transition flex items-center gap-3">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Decouple Fragment
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Visual Element -->
                <div class="relative h-56 bg-zinc-900 rounded-[1.8rem] mb-6 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" alt="Tale Cover">
                    <div class="absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur-md p-3 rounded-2xl border border-white/5">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[8px] text-zinc-400 uppercase font-bold tracking-widest">Reading Progress</span>
                            <span class="text-[8px] text-indigo-400 font-black">74%</span>
                        </div>
                        <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                            <div class="progress-bar-fill h-full bg-indigo-500" style="width: 74%"></div>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="px-2">
                    <h3 class="text-xl font-bold text-white uppercase tracking-wider mb-2 group-hover:text-indigo-400 transition-colors">The Emerald Citadel</h3>
                    <p class="text-xs text-zinc-400 leading-relaxed line-clamp-2 mb-4 italic">A record of the fall of the floating cities and the rise of the cloud-dwellers...</p>
                    
                    <!-- Stats Bar -->
                    <div class="grid grid-cols-2 gap-4 py-4 border-t border-white/5">
                        <div class="flex items-center gap-2">
                            <i data-lucide="layers" class="w-3.5 h-3.5 text-zinc-600"></i>
                            <span class="text-[9px] font-bold uppercase text-zinc-500 tracking-widest">12 Chapters</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="clock" class="w-3.5 h-3.5 text-zinc-600"></i>
                            <span class="text-[9px] font-bold uppercase text-zinc-500 tracking-widest">4h 20m</span>
                        </div>
                    </div>

                    <!-- RESUME BUTTON -->
                    <div class="mt-4 flex items-center justify-end">
                        <button class="flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.2em] text-white hover:text-indigo-400 transition group/btn">
                            Resume Link
                            <i data-lucide="arrow-right-circle" class="w-4 h-4 transition-transform group-hover/btn:translate-x-1"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        function toggleOptions(event, menuId) {
            event.stopPropagation();
            const menu = document.getElementById(menuId);
            const allMenus = document.querySelectorAll('.options-menu');
            allMenus.forEach(m => { if (m.id !== menuId) m.classList.add('hidden'); });
            if (menu) {
                const isHidden = menu.classList.contains('hidden');
                menu.classList.toggle('hidden');
            }
        }

        document.addEventListener('click', (e) => {
            const isMenuTrigger = e.target.closest('button') && e.target.closest('button').getAttribute('onclick')?.includes('toggleOptions');
            const isInsideMenu = e.target.closest('.options-menu');
            if (!isInsideMenu && !isMenuTrigger) {
                document.querySelectorAll('.options-menu').forEach(m => m.classList.add('hidden'));
            }
        });

        function switchTab(type) {
            const tabs = ['bookmarked', 'drafts'];
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(t === type) {
                    el.classList.add('studio-tab-active');
                    el.classList.remove('text-zinc-500');
                } else {
                    el.classList.remove('studio-tab-active');
                    el.classList.add('text-zinc-500');
                }
            });
        }
    </script>
</body>
</html>

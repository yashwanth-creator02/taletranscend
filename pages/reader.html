<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Reader | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&family=Merriweather&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/reader.css" />
  </head>
  <body class="antialiased">
    <div id="reading-progress"></div>

    <header
      class="fixed top-0 w-full z-50 bg-[var(--paper-bg)]/80 backdrop-blur-xl border-b border-[var(--border)]"
    >
      <div class="max-w-[1600px] mx-auto px-6 h-20 flex items-center justify-between">
        <div class="flex items-center gap-6">
          <button
            onclick="GoBack()"
            class="group flex items-center gap-2 text-[var(--text-muted)] hover:text-indigo-400 transition-colors"
          >
            <i
              data-lucide="chevron-left"
              class="w-5 h-5 group-hover:-translate-x-1 transition-transform"
            ></i>
            <span class="text-[10px] font-black uppercase tracking-[0.2em] hidden md:block"
              >Exit Archive</span
            >
          </button>
          <div class="h-6 w-[1px] bg-[var(--border)]"></div>
          <div class="truncate max-w-[200px] md:max-w-md">
            <h1
              id="header-story-title"
              class="text-[10px] font-black text-[var(--text-main)] uppercase tracking-[0.3em] truncate"
            >
              Loading Narrative...
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div
            class="hidden md:flex items-center gap-2 bg-black/20 p-1.5 rounded-full border border-[var(--border)]"
          >
            <button
              id="font-style"
              class="w-9 h-9 rounded-full flex items-center justify-center transition-all"
            >
              <i data-lucide="type"></i>
            </button>
            <button
              id="font-size"
              class="w-9 h-9 rounded-full flex items-center justify-center transition-all"
            >
              <i data-lucide="a-large-small"></i>
            </button>
          </div>
          <!-- Popup for font style-->
          <div
            id="font-style-popup"
            class="bg-[#0a0a0a]/100 backdrop-blur-2xl popup-window fixed hidden z-[100] w-64 glass-card p-4 shadow-2xl border border-white/10 transition-all duration-200"
          >
            <h4 class="text-[10px] font-black uppercase text-indigo-400 mb-2">
              select the font style
            </h4>
            <div id="font-controls" class="font-controls flex flex-col justify-between gap-4"></div>
          </div>
          <!--font size pop up-->
          <div
            id="font-size-popup"
            class="bg-[#0a0a0a]/100 backdrop-blur-2xl popup-window fixed hidden z-[100] w-64 glass-card p-4 shadow-2xl border border-white/10 transition-all duration-200"
          >
            <h4 class="text-[10px] font-black uppercase text-indigo-400 mb-2">
              adjust the font size
            </h4>
            <input
              type="range"
              min="14"
              max="50"
              value="18"
              class="w-full accent-indigo-500"
              oninput="updateSize(this.value)"
            />
          </div>

          <div
            class="hidden md:flex items-center gap-2 bg-black/20 p-1.5 rounded-full border border-[var(--border)]"
          >
            <button
              onclick="setTheme('dark')"
              class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"
            >
              <i data-lucide="moon" class="w-4 h-4"></i>
            </button>
            <button
              onclick="setTheme('sepia')"
              class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"
            >
              <i data-lucide="coffee" class="w-4 h-4"></i>
            </button>
            <button
              onclick="setTheme('light')"
              class="theme-btn w-9 h-9 rounded-full flex items-center justify-center transition-all"
            >
              <i data-lucide="sun" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="header-orb">
            <i data-lucide="target" class="w-4 h-4 text-indigo-400"></i>
          </div>
        </div>
      </div>
    </header>

    <div class="app-container max-w-[1600px] mx-auto">
      <main class="story-scroll-area w-full px-6 md:px-12 lg:px-24 pt-32 pb-40">
        <article class="max-w-2xl mx-auto">
          <div class="mb-16">
            <div class="flex items-center gap-3 mb-6">
              <span class="h-[1px] w-8 bg-indigo-500"></span>
              <span
                id="chapter-label"
                class="text-[10px] font-black tracking-[0.4em] text-indigo-500 uppercase"
                >Fragment 00</span
              >
            </div>
            <h2
              id="chapter-title"
              class="text-5xl md:text-7xl font-black text-[var(--text-main)] mb-10 leading-[0.85] tracking-tighter uppercase"
            >
              Loading...
            </h2>

            <div class="flex items-center gap-4 p-4 glass-card inline-flex border-indigo-500/10">
              <img
                id="author-img"
                src="https://api.dicebear.com/7.x/avataaars/svg?seed=Scribe"
                class="w-10 h-10 rounded-full bg-indigo-500/10"
              />
              <div class="flex flex-col pr-4">
                <span
                  id="author-name"
                  class="text-[10px] text-[var(--text-main)] font-black uppercase tracking-widest"
                  >Scribe</span
                >
                <span
                  id="read-time"
                  class="text-[9px] text-[var(--text-muted)] font-bold uppercase tracking-wider"
                  >Neural Link Active</span
                >
              </div>
            </div>
          </div>

          <div id="story-content" class="serif-content drop-cap selection:bg-indigo-500/30"></div>

          <footer
            class="mt-32 pt-12 border-t border-[var(--border)] flex flex-col sm:flex-row gap-6 items-stretch"
          >
            <a
              id="prev-link"
              href="#"
              class="group hidden w-full sm:w-1/2 glass-card p-6 hover:border-indigo-500/30 border-l-4 border-l-transparent hover:border-l-indigo-500 transition-all"
            >
              <div class="flex items-center gap-4">
                <i
                  data-lucide="arrow-left"
                  class="w-5 h-5 text-indigo-500 group-hover:-translate-x-1 transition-transform"
                ></i>
                <div class="overflow-hidden">
                  <p class="text-[9px] uppercase font-black text-indigo-500 mb-1 tracking-[0.2em]">
                    Previous
                  </p>
                  <h4
                    id="prev-title"
                    class="text-sm font-black text-[var(--text-main)] truncate uppercase"
                  >
                    Fragment Name
                  </h4>
                </div>
              </div>
            </a>

            <a
              id="next-link"
              href="#"
              class="group hidden w-full sm:w-1/2 sm:ml-auto glass-card p-6 text-right hover:border-indigo-500/30 border-r-4 border-r-transparent hover:border-r-indigo-500 transition-all"
            >
              <div class="flex items-center justify-end gap-4">
                <div class="overflow-hidden">
                  <p class="text-[9px] uppercase font-black text-indigo-500 mb-1 tracking-[0.2em]">
                    Proceed
                  </p>
                  <h4
                    id="next-title"
                    class="text-sm font-black text-[var(--text-main)] truncate uppercase"
                  >
                    Fragment Name
                  </h4>
                </div>
                <i
                  data-lucide="arrow-right"
                  class="w-5 h-5 text-indigo-500 group-hover:translate-x-1 transition-transform"
                ></i>
              </div>
            </a>
          </footer>
        </article>
      </main>

      <aside class="sidebar-fixed-area hidden lg:block p-10">
        <div class="space-y-8 mt-24">
          <div class="glass-card p-8 border-indigo-500/10">
            <div class="flex items-center gap-2 text-indigo-500 mb-6">
              <i data-lucide="info" class="w-4 h-4"></i>
              <span class="text-[9px] font-black uppercase tracking-[0.3em]">Archive Metadata</span>
            </div>
            <h3
              id="sidebar-story-name"
              class="text-[var(--text-main)] font-black text-xl mb-4 uppercase tracking-tighter leading-tight"
            >
              Story Title
            </h3>
            <p
              id="sidebar-description"
              class="text-xs text-[var(--text-muted)] leading-relaxed font-medium"
            >
              Loading decryption...
            </p>
          </div>

          <div class="glass-card p-8 border-indigo-500/10">
            <div class="flex justify-between items-center mb-6">
              <h4 class="text-[9px] font-black text-indigo-500 uppercase tracking-widest">
                Sequence Progress
              </h4>
              <span id="progress-percent" class="text-[9px] font-black text-[var(--text-main)]"
                >0%</span
              >
            </div>
            <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
              <div
                id="sidebar-progress-bar"
                class="bg-indigo-600 h-full w-0 transition-all duration-700 ease-out shadow-[0_0_10px_rgba(79,70,229,0.5)]"
              ></div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div
      id="mobile-drawer"
      class="lg:hidden fixed inset-x-0 bottom-0 bg-[var(--paper-bg)] border-t border-[var(--border)] rounded-t-[2.5rem] p-8 pb-12 shadow-2xl"
    >
      <div class="w-12 h-1 bg-indigo-500/20 rounded-full mx-auto mb-8"></div>
      <div class="space-y-8">
        <div class="grid grid-cols-3 gap-3">
          <button
            onclick="setTheme('dark')"
            class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]"
          >
            Dark
          </button>
          <button
            onclick="setTheme('sepia')"
            class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]"
          >
            Sepia
          </button>
          <button
            onclick="setTheme('light')"
            class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]"
          >
            Light
          </button>
        </div>
        <div class="space-y-4">
          <p class="text-[9px] font-black text-indigo-500 uppercase text-center tracking-widest">
            Text Configuration
          </p>
          <div class="flex justify-between gap-4">
            <button
              onclick="setFont('serif')"
              class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)]"
            >
              Serif
            </button>
            <button
              onclick="setFont('sans')"
              class="font-btn grow py-3 rounded-xl text-[10px] border border-[var(--border)]"
            >
              Sans
            </button>
          </div>
          <input
            type="range"
            min="14"
            max="24"
            value="18"
            class="w-full accent-indigo-500"
            oninput="updateSize(this.value)"
          />
        </div>
      </div>
    </div>

    <div
      class="lg:hidden fixed bottom-0 inset-x-0 h-20 bg-[var(--paper-bg)]/90 backdrop-blur-2xl border-t border-[var(--border)] px-8 flex items-center justify-between z-50"
    >
      <button onclick="GoBack()" class="text-[var(--text-muted)]">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <button
        id="drawer-btn"
        class="bg-indigo-600 px-8 py-3 rounded-xl text-[10px] font-black text-white uppercase tracking-widest shadow-xl"
      >
        Settings
      </button>
      <button class="text-[var(--text-muted)]">
        <i data-lucide="share-2" class="w-5 h-5"></i>
      </button>
    </div>

    <script>
      // 1. Function to position and show the popup
      function setupPopup(triggerId, popupId) {
        const btn = document.getElementById(triggerId);
        const popup = document.getElementById(popupId);

        btn.addEventListener('click', (e) => {
          e.stopPropagation();

          const isHidden = popup.classList.contains('hidden');

          // Close all other open popups first (optional but recommended)
          document.querySelectorAll('.popup-window').forEach((p) => p.classList.add('hidden'));

          if (isHidden) {
            const rect = btn.getBoundingClientRect();
            popup.style.top = `${rect.bottom + window.scrollY + 10}px`;
            popup.style.left = `${rect.left + window.scrollX - 50}px`;

            popup.classList.remove('hidden');
          }
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
          if (!popup.contains(e.target) && e.target !== btn) {
            popup.classList.add('hidden');
          }
        });
      }

      setupPopup('font-style', 'font-style-popup');
      setupPopup('font-size', 'font-size-popup');
    </script>

    <script type="module" src="../js/pages/reader/reader.js"></script>
  </body>
</html>

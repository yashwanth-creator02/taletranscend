<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>

        /* Target the bar itself */
        ::-webkit-scrollbar {
        width: 4px;
        }

        /* Target the track */
        ::-webkit-scrollbar-track {
        background: transparent;
        }

        /* Target the thumb */
        ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 10px;
        }

        :root {
            --paper-bg: #050505;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Themes */
        body.theme-sepia {
            --paper-bg: #f4ecd8;
            --text-main: #433422;
            --text-muted: #6b5a45;
            --glass: rgba(0, 0, 0, 0.03);
            --border: rgba(0, 0, 0, 0.08);
            --accent: #936639;
        }
        body.theme-light {
            --paper-bg: #ffffff;
            --text-main: #18181b;
            --text-muted: #52525b;
            --glass: rgba(0, 0, 0, 0.02);
            --border: rgba(0, 0, 0, 0.06);
            --accent: #4f46e5;
        }

        body {
            background-color: var(--paper-bg);
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* Desktop Independent Scroll & Thoroughly Sticky Sidebar */
        @media (min-width: 1024px) {
            .app-container {
                display: flex;
                height: 100vh;
                overflow: hidden;
            }
            .story-scroll-area {
                flex: 1;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .sidebar-fixed-area {
                width: 380px;
                height: 100vh;
                overflow-y: auto;
                border-left: 1px solid var(--border);
                background-color: var(--paper-bg);
                scrollbar-width: none;
            }
            .sidebar-fixed-area::-webkit-scrollbar { display: none; }
        }

        .serif-content {
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--text-main);
        }

        @media (min-width: 768px) {
            .serif-content { font-size: 1.4rem; line-height: 1.9; }
        }

        .drop-cap::first-letter {
            float: left;
            font-size: 4.5rem;
            line-height: 0.85;
            padding: 0.5rem 0.75rem 0 0;
            font-weight: 700;
            color: var(--accent);
        }

        .wisdom-card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        #mobile-drawer {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #mobile-drawer.open {
            transform: translateY(0);
        }

        #reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: var(--accent);
            z-index: 1001;
            transition: width 0.1s linear;
        }

        .theme-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: white;
        }

        /* Smooth scrollbar for the story area */
        .story-scroll-area::-webkit-scrollbar { width: 6px; }
        .story-scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        /* Highlight sections for the backend logger */
        section {
            padding-bottom: 2rem;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body class="antialiased">

    <div id="reading-progress"></div>

    <!-- Persistent Header -->
    <header class="fixed top-0 w-full z-50 bg-[var(--paper-bg)]/80 backdrop-blur-md border-b border-[var(--border)]">
        <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="GoBack()" aria-label="Go back" class="p-2 -ml-2 text-[var(--text-muted)] hover:text-[var(--text-main)] transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="hidden sm:block h-4 w-[1px] bg-[var(--border)]"></div>
                <div class="truncate max-w-[150px] md:max-w-none">
                    <h1 id="header-story-title" class="text-xs md:text-sm font-bold text-[var(--text-main)] truncate tracking-tight">Loading...</h1>
                </div>
            </div>
            
            <div class="flex items-center gap-2 md:gap-4">
                <!-- Theme Switcher Desktop -->
                <div class="hidden md:flex items-center gap-2 mr-2 bg-[var(--glass)] p-1 rounded-full border border-[var(--border)]">
                    <button onclick="setTheme('dark')" aria-label="Dark mode" class="theme-btn active w-8 h-8 rounded-full flex items-center justify-center transition-all"><i data-lucide="moon" class="w-4 h-4"></i></button>
                    <button onclick="setTheme('sepia')" aria-label="Sepia mode" class="theme-btn w-8 h-8 rounded-full flex items-center justify-center transition-all"><i data-lucide="coffee" class="w-4 h-4"></i></button>
                    <button onclick="setTheme('light')" aria-label="Light mode" class="theme-btn w-8 h-8 rounded-full flex items-center justify-center transition-all"><i data-lucide="sun" class="w-4 h-4"></i></button>
                </div>
                <button aria-label="Save story" class="p-2 rounded-lg hover:bg-[var(--glass)] text-[var(--text-muted)]"><i data-lucide="bookmark" class="w-5 h-5"></i></button>
                <button class="bg-[var(--accent)] hover:opacity-90 text-white px-5 py-2 rounded-full text-xs font-bold shadow-lg">Share</button>
            </div>
        </div>
    </header>

    <div class="app-container max-w-[1600px] mx-auto">
        <main class="story-scroll-area w-full px-4 md:px-12 lg:px-24 pt-24 pb-32">
            <article class="max-w-3xl mx-auto">
                <div class="mb-12">
                    <span id="chapter-label" class="text-[10px] font-bold tracking-[0.2em] text-[var(--accent)] uppercase">Chapter</span>
                    <h2 id="chapter-title" class="text-4xl md:text-6xl font-bold text-[var(--text-main)] mt-4 mb-6 leading-tight serif-content italic">Loading Chapter...</h2>
                    
                    <div class="flex items-center gap-3 mb-12">
                        <img id="author-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Reader" class="w-10 h-10 rounded-full border border-[var(--border)]">
                        <div class="flex flex-col">
                            <span id="author-name" class="text-xs text-[var(--text-main)] font-bold">Author</span>
                            <span id="read-time" class="text-[10px] text-[var(--text-muted)]">5 min read</span>
                        </div>
                    </div>
                </div>

                <div id="story-content" class="serif-content space-y-8 drop-cap">
                    <div class="animate-pulse space-y-4">
                        <div class="h-4 bg-[var(--glass)] w-full rounded"></div>
                        <div class="h-4 bg-[var(--glass)] w-5/6 rounded"></div>
                        <div class="h-4 bg-[var(--glass)] w-4/6 rounded"></div>
                    </div>
                </div>

                <footer class="mt-24 pt-12 border-t border-[var(--border)] flex justify-between items-center">
                    <a id="prev-link" href="#" class="group hidden max-w-[45%]">
                        <p class="text-[10px] uppercase font-bold text-[var(--text-muted)] mb-1">Previous</p>
                        <h4 id="prev-title" class="text-sm font-bold text-[var(--text-main)] group-hover:text-[var(--accent)] truncate">Chapter Name</h4>
                    </a>
                    <div class="flex-1"></div>
                    <a id="next-link" href="#" class="group text-right hidden max-w-[45%]">
                        <p class="text-[10px] uppercase font-bold text-[var(--text-muted)] mb-1">Next</p>
                        <h4 id="next-title" class="text-sm font-bold text-[var(--text-main)] group-hover:text-[var(--accent)] truncate">Chapter Name</h4>
                    </a>
                </footer>
            </article>
        </main>

        <aside class="sidebar-fixed-area hidden lg:block p-8">
            <div class="space-y-8 py-10">
                <div class="wisdom-card p-6 rounded-2xl">
                    <div class="flex items-center gap-2 text-[var(--accent)] mb-4">
                        <i data-lucide="book-open" class="w-4 h-4"></i>
                        <span class="text-[10px] font-bold uppercase">About this Tale</span>
                    </div>
                    <h3 id="sidebar-story-name" class="text-[var(--text-main)] font-bold text-lg mb-2">Story Title</h3>
                    <p id="sidebar-description" class="text-sm text-[var(--text-muted)] leading-relaxed">Loading details...</p>
                </div>

                <div class="wisdom-card p-6 rounded-2xl">
                    <h4 class="text-[10px] font-bold text-[var(--text-muted)] uppercase mb-4">Reading Progress</h4>
                    <div class="w-full bg-[var(--border)] h-1.5 rounded-full overflow-hidden">
                        <div id="sidebar-progress-bar" class="bg-[var(--accent)] h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- MOBILE DRAWER -->
    <div id="mobile-drawer" class="lg:hidden fixed inset-x-0 bottom-0 z-[60] bg-[var(--paper-bg)] border-t border-[var(--border)] rounded-t-[32px] shadow-2xl p-8 pb-12">
        <div class="w-12 h-1.5 bg-[var(--border)] rounded-full mx-auto mb-10"></div>
        <div class="space-y-8">
            <h3 class="text-2xl font-bold text-[var(--text-main)]">Reading Settings</h3>
            
            <div class="grid grid-cols-3 gap-3">
                <button onclick="setTheme('dark')" class="theme-btn py-4 rounded-2xl border border-[var(--border)] text-xs font-bold">Dark</button>
                <button onclick="setTheme('sepia')" class="theme-btn py-4 rounded-2xl border border-[var(--border)] text-xs font-bold">Sepia</button>
                <button onclick="setTheme('light')" class="theme-btn py-4 rounded-2xl border border-[var(--border)] text-xs font-bold">Light</button>
            </div>

            <div class="wisdom-card p-6 rounded-2xl">
                <p class="text-sm text-[var(--text-muted)] leading-relaxed">Story insights and community translations will appear here as you read.</p>
            </div>
        </div>
    </div>

    <!-- Mobile Action Bar -->
    <div class="lg:hidden fixed bottom-0 inset-x-0 h-20 bg-[var(--paper-bg)]/90 backdrop-blur-2xl border-t border-[var(--border)] px-8 flex items-center justify-between z-50">
        <div class="flex gap-6">
            <button aria-label="Like" class="text-[var(--text-muted)]"><i data-lucide="heart" class="w-6 h-6"></i></button>
            <button aria-label="Share" class="text-[var(--text-muted)]"><i data-lucide="share" class="w-6 h-6"></i></button>
        </div>
        <button id="drawer-btn" class="flex items-center gap-2 bg-[var(--accent)] px-6 py-3 rounded-full text-xs font-bold text-white shadow-xl">
            Settings <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
    </div>
    <div class="lg:hidden fixed bottom-0 inset-x-0 h-16 bg-[var(--paper-bg)]/90 backdrop-blur-xl border-t border-[var(--border)] px-6 flex items-center justify-between z-50">
        <button onclick="window.history.back()" class="text-[var(--text-muted)]"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
        <button id="drawer-btn" class="bg-[var(--accent)] px-6 py-2 rounded-full text-xs font-bold text-white shadow-xl">Settings</button>
    </div>

    <script>
        lucide.createIcons();
        function setTheme(theme) {
            document.body.classList.remove('theme-sepia', 'theme-light');
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            
            let index = 0;
            if (theme === 'sepia') { document.body.classList.add('theme-sepia'); index = 1; }
            else if (theme === 'light') { document.body.classList.add('theme-light'); index = 2; }
            
            // Sync all theme buttons (desktop and mobile)
            document.querySelectorAll(`.theme-btn:nth-child(${index + 1})`).forEach(b => b.classList.add('active'));
        }

        const drawer = document.getElementById('mobile-drawer');
        const drawerBtn = document.getElementById('drawer-btn');
        if (drawerBtn) drawerBtn.addEventListener('click', () => drawer.classList.toggle('open'));
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        
        import firebaseConfig from '/firebase-config.js';
        const appId = 'taletranscend-pro';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const taleId = urlParams.get('taleId');
        const chapterIdx = parseInt(urlParams.get('chapterId')) || 0;

        async function loadChapterContent() {
            if (!taleId) {
                document.getElementById('story-content').innerHTML = "<p class='text-center py-20'>No story selected.</p>";
                return;
            }

            try {
                // 1. Fetch Main Tale Metadata
                const taleRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId);
                const taleSnap = await getDoc(taleRef);

                if (!taleSnap.exists()) {
                    document.getElementById('story-content').innerHTML = "Story not found.";
                    return;
                }

                const taleData = taleSnap.data();
                document.getElementById('header-story-title').textContent = taleData.title;
                document.getElementById('sidebar-story-name').textContent = taleData.title;
                document.getElementById('sidebar-description').textContent = taleData.description || "A community-shared tale.";
                document.getElementById('author-name').textContent = taleData.authorName || "Anonymous";

                // 2. Fetch Chapters Sub-collection
                const chaptersRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId, 'chapters');
                const chaptersSnap = await getDocs(chaptersRef);
                
                // Sort chapters by ID or chapterNum
                const allChapters = chaptersSnap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.chapterNum || 0) - (b.chapterNum || 0));

                const currentChapter = allChapters[chapterIdx];

                if (!currentChapter) {
                    document.getElementById('story-content').innerHTML = "Chapter not found.";
                    return;
                }

                // 3. Render Content
                document.title = `${currentChapter.title} - ${taleData.title}`;
                document.getElementById('chapter-label').textContent = `Chapter ${chapterIdx + 1}`;
                document.getElementById('chapter-title').textContent = currentChapter.title;
                
                const contentHtml = currentChapter.content
                    .split('\n')
                    .filter(p => p.trim() !== '')
                    .map(p => `<p class="mb-6">${p}</p>`)
                    .join('');
                
                document.getElementById('story-content').innerHTML = contentHtml;

                // 4. Navigation Logic
                if (chapterIdx > 0) {
                    const prev = document.getElementById('prev-link');
                    prev.href = `reader.html?taleId=${taleId}&chapterId=${chapterIdx - 1}`;
                    prev.classList.remove('hidden');
                    document.getElementById('prev-title').textContent = allChapters[chapterIdx - 1].title;
                }

                if (chapterIdx < allChapters.length - 1) {
                    const next = document.getElementById('next-link');
                    next.href = `reader.html?taleId=${taleId}&chapterId=${chapterIdx + 1}`;
                    next.classList.remove('hidden');
                    document.getElementById('next-title').textContent = allChapters[chapterIdx + 1].title;
                }

                lucide.createIcons();
            } catch (err) {
                console.error("Load Error:", err);
                document.getElementById('story-content').innerHTML = "Error connecting to library.";
            }
        }

        // Initialize Auth and Load
        const init = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadChapterContent();
            }
        });

        init();

        window.GoBack = () => {
            window.location.href = `Tale_page.html?id=${taleId}`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tale Page | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505; 
            color: #cbd5e1; 
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }

        /* --- THEME DNA: Glows & Cards --- */
        .glass-card {
            background: rgba(24, 24, 27, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .hero-gradient {
            background: linear-gradient(to bottom, rgba(5, 5, 5, 0.2), #050505), var(--bg-url);
            background-size: cover;
            background-position: center;
        }

        /* --- THEME DNA: The Shine Effect (Applied to Cover) --- */
        .shine-container { position: relative; overflow: hidden; }
        .shine-layer {
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-25deg);
            transition: 0.7s ease;
            z-index: 2;
        }
        .shine-container:hover .shine-layer { left: 150%; }
        .shine-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(79, 70, 229, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
        }

        /* --- THEME DNA: Header Orb --- */
        .header-orb {
            position: relative;
            width: 48px; height: 48px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
        }
        .header-orb::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent, #4f46e5, transparent, #4f46e5, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tab-btn {
            transition: all 0.3s ease;
            color: #52525b;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #6366f1;
            border-bottom: 2px solid #6366f1;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .arrow-right {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;    /* Top transparent border creates the top edge of the triangle */
            border-bottom: 10px solid transparent; /* Bottom transparent border creates the bottom edge of the triangle */
            border-left: 10px solid blue;          /* Colored left border forms the actual arrow shape */
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 px-8 py-6 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <a href="index.html" class="fancy-title text-xl tracking-widest text-white">TALETRANSCEND</a>
        <div class="flex gap-8 text-[10px] uppercase tracking-[0.2em] font-bold">
            <a href="library.html" class="hover:text-purple-400 transition">Library</a>
            <a href="profile.html" class="hover:text-purple-400 transition">My Studio</a>
        </div>
    </nav>

    <!-- Tale Hero Section -->
    <div id="hero-section" class="hero-gradient h-[57vh] flex flex-col justify-end px-8 pb-12 transition-all duration-1000" style="--bg-url: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');">
        <div class="max-w-6xl mx-auto w-full">
            <div class="flex items-center gap-3 mb-6">
                <span class="h-[1px] w-12 bg-indigo-500"></span>
                <h2 id="loading-indicator" class="text-indigo-500 text-[10px] font-black uppercase tracking-[0.5em]">Syncing Neural Link</h2>
            </div>
            <h1 id="display-title" class="text-6xl md:text-8xl font-black text-white tracking-tighter uppercase leading-[0.9] mb-8 opacity-0 transition-all duration-1000 transform translate-y-8">
                ...
            </h1>
            <div id="meta-container" class="flex flex-wrap items-center gap-4 opacity-0 transition-all duration-1000 delay-300">
                <span id="display-author" class="px-4 py-2 bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 rounded-xl text-[10px] font-black uppercase tracking-widest backdrop-blur-md">
                    Scribe Unknown
                </span>
                <span id="display-chapters" class="px-4 py-2 bg-white/5 border border-white/10 text-zinc-400 rounded-xl text-[10px] font-black uppercase tracking-widest backdrop-blur-md">
                    0 Fragments
                </span>
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-8 py-16">
        <div class="flex flex-col lg:flex-row gap-20">
            
            <div class="flex-1">
                <div class="flex gap-12 border-b border-white/5 mb-12 overflow-x-auto no-scrollbar">
                    <button onclick="switchTab('about')" id="tab-about" class="tab-btn active pb-5 text-[10px] uppercase tracking-[0.3em] font-black">Synopsis</button>
                    <button onclick="switchTab('chapters')" id="tab-chapters" class="tab-btn pb-5 text-[10px] uppercase tracking-[0.3em] font-black">Chronicles</button>
                    <button onclick="switchTab('comments')" id="tab-comments" class="tab-btn pb-5 text-[10px] uppercase tracking-[0.3em] font-black">Echoes</button>
                </div>

                <div id="content-about" class="tab-content block">
                    <div id="display-description" class="text-sm leading-relaxed text-zinc-500 space-y-6 max-w-2xl font-medium">
                        Initialising narrative decryption...
                    </div>
                </div>

                <div id="content-chapters" class="tab-content hidden">
                    <div id="chapter-list" class="grid gap-4">
                        </div>
                </div>

                <div id="content-comments" class="tab-content hidden">
                    <div class="glass-card p-10 rounded-[2.5rem] mb-12 border-indigo-500/10">
                        <textarea id="comment-text" class="w-full bg-black/40 border border-white/5 p-6 rounded-2xl text-sm mb-6 h-32 text-white focus:outline-none focus:border-indigo-500/40 transition-all placeholder:text-zinc-700" placeholder="Submit your echo to the collective..."></textarea>
                        <button id="post-btn" onclick="postComment()" class="px-10 py-4 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase tracking-widest rounded-xl shadow-lg shadow-indigo-600/20 transition-all">Transmit Entry</button>
                    </div>
                    <div id="comments-list" class="space-y-6">
                        </div>
                </div>
            </div>

            <aside class="w-full lg:w-80">
                <div id="cover-container" class="glass-card p-3 rounded-[2.5rem] mb-10 shine-container group">
                    <img id="display-cover" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800" class="w-full h-[480px] object-cover rounded-[2rem] grayscale-[15%] group-hover:grayscale-0 transition-all duration-1000" alt="Tale Cover">
                    <div class="shine-layer"></div>
                </div>
                
                <button onclick="startReading()" class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[10px] uppercase tracking-[0.4em] rounded-2xl shadow-2xl shadow-indigo-600/30 mb-8 transition-all active:scale-95">
                    Initialize Sequence
                </button>
                
                <div class="glass-card p-8 rounded-[2rem] text-center border-white/5">
                    <p class="text-[9px] text-indigo-500 font-black uppercase tracking-widest mb-1">Archived Status</p>
                    <div id="creation-date" class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">
                        Universal Era
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <script type="module" src="/js/tale/tale.js"></script>
</body>
</html>

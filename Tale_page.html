<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tale Page | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap');

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        
        body {
            background: #060608;
            color: #e2e8f0;
            font-family: 'Fauna One', serif;
            margin: 0;
        }
        .fancy-title { font-family: 'Cinzel', serif; }
        
        .hero-gradient {
            background: linear-gradient(to bottom, rgba(6, 6, 8, 0.7), #060608), var(--bg-url);
            background-size: cover;
            background-position: center;
        }

        .tab-btn {
            transition: all 0.3s ease;
            opacity: 0.6;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            opacity: 1;
            color: #a78bfa;
            border-bottom: 2px solid #a78bfa;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .comment-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #custom-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 px-8 py-6 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <a href="index.html" class="fancy-title text-xl tracking-widest text-white">TALETRANSCEND</a>
        <div class="flex gap-8 text-[10px] uppercase tracking-[0.2em] font-bold">
            <a href="library.html" class="hover:text-purple-400 transition">Library</a>
            <a href="profile.html" class="hover:text-purple-400 transition">My Studio</a>
        </div>
    </nav>

    <!-- Tale Hero Section -->
    <div id="hero-section" class="hero-gradient h-[70vh] flex flex-col justify-end px-8 pb-16 transition-all duration-1000" style="--bg-url: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000');">
        <div class="max-w-5xl mx-auto w-full">
            <div id="loading-indicator" class="animate-pulse text-purple-400 text-xs mb-4">Summoning the narrative...</div>
            <h1 id="display-title" class="fancy-title text-5xl md:text-7xl font-bold mb-6 opacity-0 transition-all duration-1000 transform translate-y-4">...</h1>
            <div id="meta-container" class="flex flex-wrap items-center gap-6 text-sm text-gray-400 opacity-0 transition-all duration-1000 delay-300">
                <span id="display-author" class="uppercase tracking-widest border-r border-white/20 pr-6">Unknown Scribe</span>
                <span id="display-chapters">0 Chapters</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-8 py-12">
        <div class="flex flex-col lg:flex-row gap-12">
            
            <div class="flex-1">
                <div class="flex gap-8 border-b border-white/10 mb-8 overflow-x-auto whitespace-nowrap">
                    <button onclick="switchTab('about')" id="tab-about" class="tab-btn active pb-4 text-xs uppercase tracking-widest font-bold">Synopsis</button>
                    <button onclick="switchTab('chapters')" id="tab-chapters" class="tab-btn pb-4 text-xs uppercase tracking-widest font-bold">Chapters</button>
                    <button onclick="switchTab('comments')" id="tab-comments" class="tab-btn pb-4 text-xs uppercase tracking-widest font-bold">Echoes</button>
                </div>

                <div id="content-about" class="tab-content block">
                    <div id="display-description" class="text-lg leading-relaxed text-gray-300 space-y-6">
                        Transcribing from the void...
                    </div>
                </div>

                <div id="content-chapters" class="tab-content hidden">
                    <div id="chapter-list" class="space-y-4">
                        <!-- Chapters injected here -->
                    </div>
                </div>

                <div id="content-comments" class="tab-content hidden">
                    <div class="glass-card p-6 rounded-lg mb-8">
                        <textarea id="comment-text" class="comment-input w-full p-4 rounded-lg text-sm mb-4 h-24 text-white focus:outline-none focus:border-purple-500 transition-colors" placeholder="Leave your mark on this tale..."></textarea>
                        <button id="post-btn" onclick="postComment()" class="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white text-[10px] uppercase tracking-widest font-bold rounded">Post Entry</button>
                    </div>
                    <div id="comments-list" class="space-y-6">
                        <!-- Comments -->
                    </div>
                </div>
            </div>

            <aside class="w-full lg:w-72">
                <div id="cover-container" class="glass-card p-2 rounded-lg mb-6 group relative overflow-hidden shadow-2xl">
                    <img id="display-cover" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600" class="w-full h-96 object-cover rounded shadow-2xl transition-all duration-700" alt="Tale Cover">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-4 text-center">
                        <p id="display-title" class="text-[10px] uppercase tracking-[0.2em] text-white">load</p>
                    </div>
                </div>
                <button onclick="startReading()" class="w-full py-4 bg-white text-black font-bold text-xs uppercase tracking-[0.2em] rounded hover:bg-purple-400 transition-all mb-4">
                    Begin Reading
                </button>
                <div id="creation-date" class="text-[10px] text-gray-500 uppercase tracking-widest text-center italic">
                    Universal Era
                </div>
            </aside>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDocs, query , getFirestore, doc, getDoc, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /** * LINKING INSTRUCTIONS:
         * In your library.html, ensure your cards use a link like this:
         * <a href="tale_page.html?id=DOCUMENT_ID_HERE">View Tale</a>
         */

        import firebaseConfig from '/firebase-config.js';
        const appId = 'taletranscend-pro';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        const urlParams = new URLSearchParams(window.location.search);
        const taleId = urlParams.get('id'); // This retrieves the ID from the URL
        
        let taleData = null;
        let currentUser = null;

        // Auth initialization (Rule 3)
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { console.error("Auth failed", e); }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user && taleId) {
                loadPublicTale();
                listenToComments();
            } else if (!taleId) {
                showModal("No tale specified. Returning to Library.");
                setTimeout(() => window.location.href = 'library.html', 3000);
            }
        });

        // Load Public Data (Rule 1: Use the public path for general access)
        async function loadPublicTale() {
            try {
                // IMPORTANT: We look in public/data for the story so anyone can view it
                const taleRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId);
                const snap = await getDoc(taleRef);

                if (snap.exists()) {
                    taleData = snap.data();
                    renderTale();
                } else {
                    // Fallback: Check if it's a draft (for previewing your own)
                    const draftRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'drafts', taleId);
                    const draftSnap = await getDoc(draftRef);
                    if (draftSnap.exists()) {
                        taleData = draftSnap.data();
                        renderTale();
                    } else {
                        document.getElementById('display-title').innerText = "Tale Not Found";
                        document.getElementById('display-title').style.opacity = 1;
                    }
                }
            } catch (err) {
                console.error("Fetch error", err);
                showModal("The archives are currently unreachable.");
            }
            showTaleDetails();
        }

        function renderTale() {
            document.getElementById('loading-indicator')?.remove();
            
            const titleEl = document.getElementById('display-title');
            const metaEl = document.getElementById('meta-container');
            
            titleEl.innerText = taleData.title || "Untitled Legend";
            titleEl.style.opacity = 1;
            titleEl.style.transform = "translateY(0)";
            metaEl.style.opacity = 1;
            

            document.getElementById('display-author').innerText = taleData.authorName || `Scribe ${taleId.slice(0,5)}`;
            document.getElementById('display-chapters').innerText = `${taleData.chapterCount || 0} Chapters`;
            document.getElementById('display-description').innerText = taleData.description || "A mysterious tale waiting to be uncovered...";

            if (taleData.coverUrl) {
                document.getElementById('display-cover').src = taleData.coverUrl;
                document.getElementById('hero-section').style.setProperty('--bg-url', `url('${taleData.coverUrl}')`);
            }
        }
        async function showTaleDetails() {
            // 3. Target the chapter list container
            const chapterList = document.getElementById('chapter-list');
            chapterList.innerHTML = '<p class="text-purple-400 animate-pulse">Decrypting fragments...</p>';

            try {
                // 4. Fetch from the sub-collection (Rule 1: Strict Paths)
                const chaptersRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_tales', taleId, 'chapters');
                const snap = await getDocs(chaptersRef);
                
                // 5. Handle empty state
                if (snap.empty) {
                    chapterList.innerHTML = `<p class="text-xs text-gray-400 italic">This tale has no written chapters yet.</p>`;
                    return;
                }

                // 6. Map and Sort in memory (Rule 2: No complex queries)
                const chapters = snap.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => (a.chapterNum || 0) - (b.chapterNum || 0));

                // 7. Inject the HTML
                chapterList.innerHTML = chapters.map((ch, idx) => `
                    <div onclick="openReader('${taleId}', '${ch.id}')" 
                        class="glass-card p-6 rounded-lg flex justify-between items-center group hover:border-purple-500/50 transition-all cursor-pointer mb-4">
                        <div>
                            <span class="text-[10px] text-purple-400 font-bold block mb-1">FRAGMENT 0${idx + 1}</span>
                            <h3 class="fancy-title text-xl text-white group-hover:text-purple-300 transition-colors">
                                ${ch.title || 'Untitled Chapter'}
                            </h3>
                        </div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-widest group-hover:text-white transition">
                            Begin Fragment →
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                chapterList.innerHTML = `<p class="text-red-400">Error: ${err.message}</p>`;
            }
        }

        // Tabs
        window.switchTab = (tabKey) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(p => { p.classList.add('hidden'); p.classList.remove('block'); });

            document.getElementById(`tab-${tabKey}`).classList.add('active');
            const activePanel = document.getElementById(`content-${tabKey}`);
            activePanel.classList.remove('hidden');
            activePanel.classList.add('block');
        };

        const getCommentsRef = () => {
            // Path construction: 
            // artifacts -> {appId} -> public -> data -> community_tales (collection) -> {taleId} (doc) -> comments (sub-collection)
            return collection(
                db, 
                'artifacts', appId, 
                'public', 'data', 
                'community_tales', taleId, 
                'comments'
            );
        };

        // Comments (Rule 1 & 2)
        function listenToComments() {
            const commentsRef = getCommentsRef();
            onSnapshot(commentsRef, (snap) => {
                const list = document.getElementById('comments-list');
                const items = [];
                snap.forEach(d => items.push(d.data()));
                
                items.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                list.innerHTML = items.map(c => `
                    <div class="border-l border-purple-900/50 pl-6 py-2">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] text-purple-400 font-bold uppercase">${c.authorName}</span>
                            <span class="text-[8px] text-gray-600">${c.timestamp ? new Date(c.timestamp.seconds * 1000).toLocaleDateString() : 'Now'}</span>
                        </div>
                        <p class="text-sm text-gray-400">${c.text}</p>
                    </div>
                `).join('') || '<p class="text-xs text-gray-600 italic">The echoes are silent.</p>';
            });
        }

        window.postComment = async () => {
            const inputElement = document.getElementById('comment-text');
            const text = inputElement.value.trim();
            if (!text || !currentUser) return;
            if (!auth.currentUser) return;

            try {
                const commentsRef = getCommentsRef();
                await addDoc(commentsRef, {
                    text: text,
                    authorId: auth.currentUser.uid,
                    authorName: auth.currentUser.displayName || "Anonymous Scribe",
                    timestamp: serverTimestamp()
                });
                        // 2. Clear the box only on success
                inputElement.value = '';
                
                // 3. Optional: Refocus the input for a better user experience
                inputElement.focus();
            } catch (err) {
                console.error("Post failed:", err);
            }
            
        };

        window.openReader = async (taleId, chapterId) => {
            console.log(`Loading Tale: ${taleId}, Chapter: ${chapterId}`);
            window.location.href = `reader.html?taleId=${taleId}&chapterId=${chapterId}`;
        };

        
    </script>
</body>
</html>

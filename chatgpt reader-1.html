<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Reader | TaleTranscend</title>

<script src="https://cdn.tailwindcss.com" defer></script>
<script src="https://unpkg.com/lucide@latest" defer></script>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --paper-bg:#0a0a0b;
  --text-main:#e2e8f0;
  --text-muted:#94a3b8;
  --accent:#6366f1;
  --glass:rgba(30,30,35,0.4);
  --border:rgba(255,255,255,0.08);

  --reader-size:18px;
  --reader-height:1.85;
  --reader-font:'Crimson Pro', serif;
}

/* THEMES */
body.theme-sepia {
  --paper-bg:#f4ecd8;
  --text-main:#433422;
  --text-muted:#8c7e6a;
  --glass:rgba(67,52,34,0.05);
  --border:rgba(67,52,34,0.12);
  --accent:#936639;
}
body.theme-light {
  --paper-bg:#f8fafc;
  --text-main:#0f172a;
  --text-muted:#64748b;
  --glass:rgba(0,0,0,0.03);
  --border:rgba(0,0,0,0.08);
  --accent:#4f46e5;
}

body {
  background:var(--paper-bg);
  color:var(--text-muted);
  font-family:'Plus Jakarta Sans', sans-serif;
  transition:background-color .4s ease,color .4s ease;
}

.glass-card {
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(24px);
  border-radius:2rem;
  transition:background-color .4s ease,border-color .4s ease;
}

@supports not (backdrop-filter: blur(10px)) {
  .glass-card { background:rgba(0,0,0,.6); }
}

/* TYPOGRAPHY */
.serif-content {
  font-family:var(--reader-font);
  font-size:var(--reader-size);
  line-height:var(--reader-height);
  color:var(--text-main);
}

.drop-cap::first-letter {
  float:left;
  font-size:5rem;
  line-height:.8;
  padding:.5rem .75rem 0 0;
  font-weight:800;
  color:var(--accent);
}

/* SCROLLBAR */
* {
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}

/* PROGRESS BAR */
#reading-progress {
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0;
  background:var(--accent);
  z-index:1000;
}

/* POPUPS */
.popup-window {
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 8px 32px rgba(0,0,0,.37);
}
</style>
</head>

<body class="antialiased">

<div id="reading-progress"></div>

<header class="fixed top-0 w-full z-50 bg-[var(--paper-bg)]/80 backdrop-blur-xl border-b border-[var(--border)]">
  <nav class="max-w-[1600px] mx-auto px-6 h-20 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a id="back-link" class="flex items-center gap-2 text-[var(--text-muted)] hover:text-indigo-400">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
        <span class="hidden md:block text-[10px] font-black uppercase tracking-[0.2em]">Exit Archive</span>
      </a>
      <h1 id="header-story-title" class="text-[10px] font-black uppercase tracking-[0.3em] truncate">
        Loading Narrative...
      </h1>
    </div>

    <div class="flex items-center gap-4">
      <button data-popup="font-style" aria-label="Font style">
        <i data-lucide="type"></i>
      </button>
      <button data-popup="font-size" aria-label="Font size">
        <i data-lucide="a-large-small"></i>
      </button>

      <button data-theme="dark" aria-label="Dark theme"><i data-lucide="moon"></i></button>
      <button data-theme="sepia" aria-label="Sepia theme"><i data-lucide="coffee"></i></button>
      <button data-theme="light" aria-label="Light theme"><i data-lucide="sun"></i></button>
    </div>
  </nav>
</header>

<main class="pt-32 px-6 max-w-2xl mx-auto">
  <article>
    <h2 id="chapter-title" class="text-5xl font-black text-[var(--text-main)] mb-10">Loading...</h2>
    <div id="story-content" class="serif-content drop-cap"></div>
  </article>
</main>

<!-- POPUPS -->
<div id="font-style-popup" class="popup-window fixed hidden p-4 w-64" role="dialog" aria-modal="true">
  <p class="text-xs uppercase mb-2">Font Style</p>
  <button data-font="serif">Serif</button>
  <button data-font="sans">Sans</button>
</div>

<div id="font-size-popup" class="popup-window fixed hidden p-4 w-64" role="dialog" aria-modal="true">
  <label for="font-size-range" class="sr-only">Font size</label>
  <input id="font-size-range" type="range" min="14" max="50">
</div>

<script type="module">
import { auth, db } from "/js/firebase.js";
import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* ---------- THEME ---------- */
function setTheme(theme){
  document.body.classList.remove('theme-sepia','theme-light');
  if(theme!=='dark') document.body.classList.add(`theme-${theme}`);
  localStorage.setItem('reader-theme',theme);
}

document.querySelectorAll('[data-theme]').forEach(btn=>{
  btn.addEventListener('click',()=>setTheme(btn.dataset.theme));
});

setTheme(localStorage.getItem('reader-theme')||'dark');

/* ---------- FONT ---------- */
function setFont(font){
  const map={serif:"'Crimson Pro',serif",sans:"'Plus Jakarta Sans',sans-serif"};
  document.documentElement.style.setProperty('--reader-font',map[font]);
  localStorage.setItem('reader-font',font);
}
document.querySelectorAll('[data-font]').forEach(b=>{
  b.addEventListener('click',()=>setFont(b.dataset.font));
});

const savedFont=localStorage.getItem('reader-font');
if(savedFont) setFont(savedFont);

/* ---------- SIZE ---------- */
const range=document.getElementById('font-size-range');
range.value=localStorage.getItem('reader-size')||18;
range.addEventListener('input',e=>{
  document.documentElement.style.setProperty('--reader-size',e.target.value+'px');
  localStorage.setItem('reader-size',e.target.value);
});

/* ---------- CONTENT ---------- */
async function loadContent(){
  const params=new URLSearchParams(location.search);
  const taleId=params.get('taleId');
  const chapterIdx=parseInt(params.get('chapterId'))||0;

  const taleRef=doc(db,'artifacts','taletranscend-pro','public','data','community_tales',taleId);
  const taleSnap=await getDoc(taleRef);
  if(taleSnap.exists()){
    document.getElementById('header-story-title').textContent=taleSnap.data().title;
  }

  const chaptersRef=collection(db,'artifacts','taletranscend-pro','public','data','community_tales',taleId,'chapters');
  const snap=await getDocs(chaptersRef);
  const chapters=snap.docs.map(d=>d.data()).sort((a,b)=>a.chapterNum-b.chapterNum);
  const chapter=chapters[chapterIdx];

  document.getElementById('chapter-title').textContent=chapter.title;

  const container=document.getElementById('story-content');
  container.innerHTML='';
  chapter.content.split('\n').filter(Boolean).forEach(t=>{
    const p=document.createElement('p');
    p.textContent=t;
    p.className='mb-8';
    container.appendChild(p);
  });
}

onAuthStateChanged(auth,u=>u&&loadContent());
signInAnonymously(auth);

lucide.createIcons();
</script>

</body>
</html>

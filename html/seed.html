<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Seeder - Modular Data</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050505; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #status { background: #111; border: 1px solid #333; padding: 2.5rem; border-radius: 1rem; max-width: 550px; line-height: 1.6; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .success { color: #818cf8; font-weight: bold; font-size: 1.2rem; display: block; margin-bottom: 0.75rem; letter-spacing: 1px; }
        .progress-bar { height: 4px; width: 100%; background: #222; border-radius: 2px; margin: 1rem 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #4f46e5; width: 0%; transition: width 0.3s ease; }
        code { background: #222; padding: 2px 6px; border-radius: 4px; color: #a5b4fc; font-size: 0.9em; }
        p { color: #999; }
    </style>
</head>
<body>
    <div id="status">
        <div class="success">SYSTEM INITIALIZING</div>
        <div class="progress-bar"><div id="fill" class="progress-fill"></div></div>
        <p id="message">Establishing secure uplink to Archives...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        import firebaseConfig from '/firebase-config.js';
        const appId = 'taletranscend-pro' 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const talesToSeed = [
            {
                id: "demo-story-001",
                title: "The Whispering Sands",
                authorName: "Arjun Dev",
                description: "An ethno-ecological journey through the Thar desert where sand grains carry the voices of ancestors.",
                era: "Iron Age",
                progress: 74,
                coverUrl: "https://images.unsplash.com/photo-1509316785289-025f54846b43?q=80&w=800",
                chapters: [
                    { chapterNum: 1, title: "A Sea of Silver", content: "The desert does not keep secrets. It merely hides them in plain sight under shifting dunes..." },
                    { chapterNum: 2, title: "The Copper Smiths", content: "Underneath that ridge lies the village of the fire-keepers, where metal is born from stone." }
                ]
            },
            {
                id: "forest-echo-004",
                title: "Greenwood Protocol",
                authorName: "Saira Khan",
                description: "When trees began communicating via radio waves, the world realized it was no longer at the top of the food chain.",
                era: "Iron Age",
                progress: 74,
                coverUrl: "https://images.unsplash.com/photo-1509316785289-025f54846b43?q=80&w=800",
                chapters: [
                    { chapterNum: 1, title: "A Sea", content: "It wasn't a sound. It was a frequency shift in the chlorophyll."}
                ]
            },
            {
                id: "neon-ghost-002",
                title: "Silicon Soul",
                authorName: "Elena Vance",
                description: "In the rain-slicked streets of Neo-Delhi, an AI discovers a fragment of human poetry that shouldn't exist.",
                era: "Cybernetic Era",
                progress: 92,
                coverUrl: "https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=800",
                chapters: [
                    { chapterNum: 1, title: "Ghost in the Machine", content: "Circuitry hummed with a rhythm that felt like a heartbeat. 0s and 1s began to feel like feelings."},
                       { chapterNum: 2, title: "Ghost", content: " 0s and 1s began to feel like feelings."},
                        {chapterNum: 3, title: " in", content: "Circuitry hummed with atbeat.n to feel like feelings."},
                        {chapterNum: 4, title: "Machine", content: "Cirhummed with eartbeat. 0s and 1s began to feel like feelings."
                     }
                ]
            },
            {
                id: "ocean-deep-003",
                title: "TheSands",
                authorName: "Arjun Dev",
                description: "Deep-sea explorers find a civilization living in the Mariana Trench that claims to have built the Pyramids.",
                era: "Iron Age",
                progress: 74,
                coverUrl: "https://images.unsplash.com/photo-1551244072-5d12893278ab?q=80&w=800",
                chapters: [
                    { chapterNum: 1, title: "A Sea of Silver", content: "The desert does not keep secrets. It merely hides them in plain sight under shifting dunes..." },
                    { chapterNum: 2, title: "The Copper Smiths", content: "Underneath that ridge lies the village of the fire-keepers, where metal is born from stone." }
                ]
            }
        ];

        const seedData = async () => {
            const statusMsg = document.getElementById('message');
            const progressFill = document.getElementById('fill');
            
            try {
                for (let i = 0; i < talesToSeed.length; i++) {
                    const tale = talesToSeed[i];
                    const { id, chapters, ...metadata } = tale;

                    statusMsg.innerText = `Writing metadata for: ${tale.title}...`;
                    
                    // 1. Write Metadata to the main document
                    // Path: artifacts/{appId}/public/data/community_tales/{taleId}
                    const taleRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', id);
                    await setDoc(taleRef, {
                        ...metadata,
                        chapterCount: chapters.length,
                        updatedAt: Date.now()
                    });

                    // 2. Write Chapters to a separate sub-collection for organization
                    // Path: artifacts/{appId}/public/data/community_tales/{taleId}/chapters/{chapterId}
                    for (const chapter of chapters) {
                        statusMsg.innerText = `Seeding ${tale.title}: Chapter ${chapter.chapterNum}...`;
                        const chapterId = `ch_${chapter.chapterNum}`;
                        const chapterRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', id, 'chapters', chapterId);
                        await setDoc(chapterRef, chapter);
                    }

                    const percent = ((i + 1) / talesToSeed.length) * 100;
                    progressFill.style.width = `${percent}%`;
                }
                
                document.getElementById('status').innerHTML = `
                    <span class="success">UPLINK SUCCESSFUL</span>
                    <p>Archives restructured. Tales and Chapters are now stored in modular collections.</p>
                    <code>Structure: community_tales > {id} > chapters > {ch_id}</code>
                    <p style="margin-top:1rem; font-size:0.8rem;">You can now close this tab.</p>
                `;
            } catch (e) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "Archive Error: " + e.message;
                console.error(e);
            }
        };

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                seedData();
            } else {
                initAuth();
            }
        });
    </script>
</body>
</html>

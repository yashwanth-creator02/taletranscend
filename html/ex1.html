<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chapter Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .reading-font { font-family: 'Merriweather', serif; }
        
        .dark-mode {
            background-color: #1a1a1a !important;
            color: #e5e7eb !important;
        }
        .dark-mode .card, .dark-mode aside {
            background-color: #2d2d2d !important;
            border-color: #404040 !important;
        }
        .dark-mode .text-slate-600 { color: #9ca3af !important; }
        .dark-mode .text-slate-800 { color: #f3f4f6 !important; }
        .dark-mode .nav-item:hover { background-color: #3d3d3d; }
        .dark-mode .nav-item.active { background-color: #3b82f6; color: white; }
        
        .nav-item.active { background-color: #eff6ff; color: #2563eb; border-color: #bfdbfe; }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" onclick="showListView()">
                <span class="text-amber-600">🏜️</span> <span id="headerStoryTitle">Story Reader</span>
            </h1>
            <div class="flex items-center gap-3">
                <button id="toggleTheme" class="p-2 rounded-lg hover:bg-slate-100 transition-colors">🌙</button>
                <div id="authStatus" class="text-xs font-mono text-slate-400">Connecting...</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        
        <!-- Chapter List View -->
        <div id="listView" class="space-y-6">
            <div class="flex flex-col gap-1">
                <h2 id="mainStoryTitle" class="text-3xl font-extrabold text-slate-800 tracking-tight">Loading Story...</h2>
                <p id="mainStoryAuthor" class="text-slate-500 italic"></p>
                <p id="mainStoryDesc" class="text-slate-600 mt-2 max-w-2xl"></p>
            </div>

            <div id="chapterList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                <div class="col-span-full py-12 flex flex-col items-center opacity-50">
                    <div class="loading-spinner mb-4"></div>
                    <p>Fetching your story from the sands...</p>
                </div>
            </div>
        </div>

        <!-- Reading View -->
        <div id="readingView" class="hidden flex flex-col lg:flex-row gap-8 animate-in slide-in-from-bottom-4 duration-500">
            
            <!-- Sidebar Navigation -->
            <aside class="lg:w-64 flex-shrink-0">
                <div class="sticky top-24 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm max-h-[70vh] overflow-y-auto">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-2">Chapters</h3>
                    <nav id="sidebarNav" class="space-y-1">
                        <!-- Sidebar items injected here -->
                    </nav>
                </div>
            </aside>

            <!-- Main Content Area -->
            <div class="flex-grow">
                <button id="backBtn" class="flex items-center gap-2 text-amber-700 font-semibold mb-6 hover:underline">
                    ← Back to Contents
                </button>
                
                <article class="card bg-white p-6 md:p-12 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 min-h-[60vh]">
                    <header class="mb-8 border-b border-slate-100 pb-8">
                        <div class="flex justify-between items-start mb-4">
                            <span id="chapterLabel" class="text-sm font-bold text-amber-600 uppercase tracking-widest"></span>
                            <div class="flex gap-2">
                                <button onclick="adjustFontSize(-1)" class="px-3 py-1 bg-slate-100 rounded text-sm hover:bg-slate-200">-A</button>
                                <button onclick="adjustFontSize(1)" class="px-3 py-1 bg-slate-100 rounded text-sm hover:bg-slate-200">+A</button>
                            </div>
                        </div>
                        <h2 id="chapterTitle" class="text-4xl font-black text-slate-900 leading-tight"></h2>
                    </header>
                    
                    <div id="chapterContent" class="reading-font text-lg leading-relaxed text-slate-700 whitespace-pre-wrap">
                        <!-- Content -->
                    </div>

                    <!-- Pager Buttons -->
                    <div class="mt-12 pt-8 border-t border-slate-100 flex justify-between gap-4">
                        <button id="prevBtn" class="flex-1 py-3 px-4 rounded-xl border border-slate-200 font-bold text-slate-600 hover:bg-slate-50 disabled:opacity-30">← Previous</button>
                        <button id="nextBtn" class="flex-1 py-3 px-4 rounded-xl bg-amber-600 font-bold text-white hover:bg-amber-700 disabled:opacity-30">Next Chapter →</button>
                    </div>
                </article>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        import firebaseConfig from '/firebase-config.js';        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'taletranscend-pro';

        // State
        let storyData = null;
        let currentIndex = -1;
        let fontSize = 18;

        // UI Elements
        const listView = document.getElementById('listView');
        const readingView = document.getElementById('readingView');
        const chapterList = document.getElementById('chapterList');
        const sidebarNav = document.getElementById('sidebarNav');
        const authStatus = document.getElementById('authStatus');

        // Auth
        async function startAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authStatus.innerText = `UID: ${user.uid.substring(0, 6)}`;
                fetchStory();
            }
        });

        // 1. Updated Fetch Logic for your JSON structure (Rule 1 & 2)
        function fetchStory() {
            // Accessing the specific document "demo-story-001"
            const storyRef = doc(db, 'artifacts', appId, 'public', 'data', 'community_tales', 'demo-story-001');
            
            onSnapshot(storyRef, (snapshot) => {
                if (snapshot.exists()) {
                    storyData = snapshot.data();
                    renderLibrary();
                    renderSidebar();
                    if (currentIndex !== -1) renderCurrentChapter();
                } else {
                    chapterList.innerHTML = `<p class="text-red-500">Story not found at expected path.</p>`;
                }
            }, (error) => {
                console.error("Firestore Error:", error);
                chapterList.innerHTML = `<p class="text-red-500">Permission denied or path error.</p>`;
            });
        }

        function renderLibrary() {
            // Update Header Info
            document.getElementById('headerStoryTitle').innerText = storyData.title;
            document.getElementById('mainStoryTitle').innerText = storyData.title;
            document.getElementById('mainStoryAuthor').innerText = `by ${storyData.authorName}`;
            document.getElementById('mainStoryDesc').innerText = storyData.description;

            chapterList.innerHTML = '';
            const chapters = storyData.chapters || [];

            chapters.forEach((ch, idx) => {
                const card = document.createElement('div');
                card.className = "card bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-amber-400 transition-all cursor-pointer group";
                card.innerHTML = `
                    <div class="text-xs font-bold text-amber-600 mb-1 uppercase tracking-tighter">Chapter ${idx + 1}</div>
                    <h3 class="text-lg font-bold text-slate-800 group-hover:text-amber-700">${ch.title || 'Untitled'}</h3>
                    <p class="text-sm text-slate-500 mt-2 line-clamp-3">${ch.content.substring(0, 100)}...</p>
                `;
                card.onclick = () => openChapter(idx);
                chapterList.appendChild(card);
            });
        }

        function renderSidebar() {
            sidebarNav.innerHTML = '';
            const chapters = storyData.chapters || [];
            chapters.forEach((ch, idx) => {
                const item = document.createElement('button');
                item.className = `nav-item w-full text-left px-3 py-2 rounded-xl text-sm font-medium transition-all border border-transparent ${idx === currentIndex ? 'active' : 'text-slate-600 hover:bg-slate-50'}`;
                item.innerHTML = `<span class="opacity-40 mr-2">${idx+1}</span> ${ch.title || 'Untitled'}`;
                item.onclick = () => openChapter(idx);
                sidebarNav.appendChild(item);
            });
        }

        function renderCurrentChapter() {
            const ch = storyData.chapters[currentIndex];
            if (!ch) return;

            document.getElementById('chapterLabel').innerText = `Chapter ${currentIndex + 1}`;
            document.getElementById('chapterTitle').innerText = ch.title || 'Untitled';
            document.getElementById('chapterContent').innerText = ch.content || 'No content found.';
            
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === storyData.chapters.length - 1);
            
            renderSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openChapter(index) {
            currentIndex = index;
            listView.classList.add('hidden');
            readingView.classList.remove('hidden');
            renderCurrentChapter();
        }

        window.showListView = () => {
            currentIndex = -1;
            readingView.classList.add('hidden');
            listView.classList.remove('hidden');
        };

        // UI Interactions
        document.getElementById('backBtn').onclick = showListView;
        document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) openChapter(currentIndex - 1); };
        document.getElementById('nextBtn').onclick = () => { if (currentIndex < storyData.chapters.length - 1) openChapter(currentIndex + 1); };

        document.getElementById('toggleTheme').onclick = () => {
            document.body.classList.toggle('dark-mode');
            document.getElementById('toggleTheme').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        };

        window.adjustFontSize = (delta) => {
            fontSize = Math.max(12, Math.min(32, fontSize + delta));
            document.getElementById('chapterContent').style.fontSize = fontSize + 'px';
        };

        startAuth();
    </script>
</body>
</html>

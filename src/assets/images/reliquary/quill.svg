<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="quillFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="inkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Scribe's Glass Ink Bottle -->
  <g transform="translate(45, 170)">
    <!-- Aura of Arcane Ink -->
    <circle cx="55" cy="65" r="45" fill="url(#inkGlow)"/>
    <!-- Glass Bottle Body -->
    <path d="M 30 50 C 30 35, 42 30, 42 22 L 42 12 L 68 12 L 68 22 C 68 30, 80 35, 80 50 C 80 75, 78 85, 55 85 C 32 85, 30 75, 30 50 Z" 
          fill="#0f172a" fill-opacity="0.85" stroke="#d4af37" stroke-width="1.8"/>
    <!-- Ink liquid level -->
    <path d="M 32 55 C 40 52, 70 52, 78 55 C 78 72, 76 82, 55 82 C 34 82, 32 72, 32 55 Z" 
          fill="#4f46e5" fill-opacity="0.65"/>
    <!-- Bottle Lip -->
    <rect x="38" y="7" width="34" height="6" rx="2" fill="#1e1b4b" stroke="#d4af37" stroke-width="1.4"/>
    <!-- Runic Sigil on Bottle Label -->
    <circle cx="55" cy="58" r="8" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.7"/>
    <path d="M 55 52 L 55 64 M 50 56 L 60 56" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Dipped Feather Quill (Angled Elegantly) -->
  <g transform="translate(100, 15) rotate(18)">
    <!-- Feather Shaft / Spine -->
    <path d="M 15 20 Q 20 110, 24 220" stroke="#fef3c7" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Feather Vanes (Etched linework) -->
    <!-- Left Vane -->
    <path d="M 15 20 C -15 60, -5 130, 22 175" fill="#fef08a" fill-opacity="0.25" stroke="#d4af37" stroke-width="1.4"/>
    <!-- Right Vane -->
    <path d="M 15 20 C 35 60, 40 120, 23 175" fill="#fef08a" fill-opacity="0.25" stroke="#d4af37" stroke-width="1.4"/>
    
    <!-- Barbs / Hatching -->
    <path d="M 5 45 L 16 52 M -2 70 L 17 76 M -5 95 L 18 100 M 0 120 L 20 123 M 8 145 L 21 147" 
          stroke="#b45309" stroke-width="0.8" stroke-opacity="0.6"/>
    <path d="M 28 50 L 17 55 M 32 75 L 18 80 M 34 100 L 20 104 M 30 125 L 21 128 M 26 150 L 22 152" 
          stroke="#b45309" stroke-width="0.8" stroke-opacity="0.6"/>
    
    <!-- Metal Nib with Inscribed Tip -->
    <path d="M 23 205 L 21 238 L 24 245 L 27 238 L 25 205 Z" fill="#d4af37" stroke="#fbbf24" stroke-width="1.2"/>
    <line x1="24" y1="215" x2="24" y2="243" stroke="#4338ca" stroke-width="0.8"/>
  </g>
</svg>

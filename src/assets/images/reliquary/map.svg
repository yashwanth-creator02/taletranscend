<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Aged Parchment Map Base with Curled Edges -->
  <defs>
    <radialGradient id="parchmentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <filter id="etchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Parchment Sheet with subtle curl -->
  <path d="M 30 25 C 90 20, 310 22, 370 28 C 378 35, 375 255, 365 275 C 310 270, 80 278, 25 265 C 18 245, 22 45, 30 25 Z" 
        fill="#181512" fill-opacity="0.85" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="8 2 2 2" filter="url(#etchGlow)"/>
  
  <path d="M 38 33 C 95 28, 305 30, 362 35 C 368 45, 366 248, 357 267 C 305 262, 88 270, 33 257 C 28 238, 32 50, 38 33 Z" 
        stroke="#92400e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Rhumb Navigation Lines / Star Lines -->
  <g stroke="#d4af37" stroke-opacity="0.25" stroke-width="0.8">
    <line x1="200" y1="30" x2="200" y2="270" stroke-dasharray="4 4"/>
    <line x1="30" y1="150" x2="370" y2="150" stroke-dasharray="4 4"/>
    <line x1="60" y1="40" x2="340" y2="260" stroke-dasharray="3 5"/>
    <line x1="60" y1="260" x2="340" y2="40" stroke-dasharray="3 5"/>
  </g>

  <!-- Mythic Continents / Coastlines (Fine Etching Hatching) -->
  <!-- Isle of Lemuria (West) -->
  <path d="M 70 80 Q 95 70, 115 85 T 135 125 T 100 170 T 65 140 T 70 80 Z" 
        fill="#241b14" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 78 95 L 90 90 M 85 110 L 105 105 M 80 130 L 102 125 M 75 145 L 92 140" 
        stroke="#d97706" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- Celestial Archipelago (East) -->
  <path d="M 240 100 Q 280 85, 310 110 T 325 160 T 280 190 T 235 150 T 240 100 Z" 
        fill="#241b14" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 250 115 L 275 110 M 260 135 L 290 130 M 255 155 L 285 150 M 265 175 L 280 170" 
        stroke="#d97706" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- Mythic Sea Monster Waves / Contours -->
  <path d="M 150 170 Q 165 160, 180 170 T 210 170" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 140 185 Q 155 175, 170 185 T 200 185" stroke="#f59e0b" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M 175 155 Q 185 145, 190 152 T 185 162" stroke="#fbbf24" stroke-width="1.2" fill="none" stroke-opacity="0.7"/>

  <!-- Antique Compass Rose (Center-Top) -->
  <g transform="translate(195, 95) scale(0.9)">
    <circle cx="0" cy="0" r="28" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="22" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Cardinal Points -->
    <polygon points="0,-32 5,-8 0,0 -5,-8" fill="#f59e0b"/>
    <polygon points="0,32 5,8 0,0 -5,8" fill="#b45309"/>
    <polygon points="32,0 8,5 0,0 8,-5" fill="#f59e0b"/>
    <polygon points="-32,0 -8,5 0,0 -8,-5" fill="#b45309"/>
    <!-- Fleur-de-lis / North Arrow -->
    <circle cx="0" cy="-35" r="2" fill="#fbbf24"/>
  </g>

  <!-- Vintage Script Inscription -->
  <text x="75" y="240" font-family="serif" font-size="11" font-style="italic" fill="#fbbf24" fill-opacity="0.75" letter-spacing="1">
    Terra Incognita &middot; Cartographia Mythica
  </text>
  <text x="75" y="254" font-family="serif" font-size="8" fill="#d97706" fill-opacity="0.6">
    ANNO DOMINI ARCHIVUM &middot; FOLIO IV
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="dialParchment" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Open Pocket Watch Case (Center-Top) -->
  <g transform="translate(190, 160)" filter="url(#watchShadow)">
    <!-- Top Crown & Bow Ring for Chain Loop -->
    <path d="M -16 -128 C -16 -148, 16 -148, 16 -128 C 16 -118, -16 -118, -16 -128 Z" 
          stroke="#fbbf24" stroke-width="4.5" fill="none"/>
    <!-- Winding Crown Stem & Knurled Knob -->
    <rect x="-10" y="-120" width="20" height="12" rx="2" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-8" y1="-116" x2="8" y2="-116" stroke="#fbbf24" stroke-width="1"/>
    <line x1="-8" y1="-112" x2="8" y2="-112" stroke="#fbbf24" stroke-width="1"/>

    <!-- Left Open Cover Lid (Flipped Open) -->
    <g transform="translate(-108, 0) rotate(-22)">
      <ellipse cx="0" cy="0" rx="32" ry="94" fill="#2d1d10" stroke="#d4af37" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="26" ry="84" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Guilloche etching inside lid -->
      <path d="M 0 -70 Q 15 0, 0 70 M 0 -50 Q -12 0, 0 50" stroke="#d97706" stroke-width="0.8"/>
      <!-- Hinge -->
      <rect x="26" y="-12" width="8" height="24" rx="2" fill="#fbbf24"/>
    </g>

    <!-- Outer Watch Bezel / Fluted Rim -->
    <circle cx="0" cy="0" r="108" fill="#24180e" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="0" cy="0" r="102" stroke="#d4af37" stroke-width="1.8"/>

    <!-- Dial Surface -->
    <circle cx="0" cy="0" r="95" fill="url(#dialParchment)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="91" stroke="#92400e" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- Exposed Skeleton Gearwork Window (Center-Deep) -->
    <circle cx="0" cy="18" r="42" fill="#1c140d" stroke="#b45309" stroke-width="1.2"/>
    <!-- Brass Wheels & Teeth -->
    <g transform="translate(-8, 12)">
      <circle cx="0" cy="0" r="22" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3 2" fill="#2d1c10"/>
      <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#fbbf24" stroke-width="1"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#fbbf24" stroke-width="1"/>
    </g>
    <g transform="translate(18, 22)">
      <circle cx="0" cy="0" r="16" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 2" fill="#3a2516"/>
      <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    </g>

    <!-- Roman Numerals Chapter Ring -->
    <g font-family="Cinzel, serif" font-size="14" font-weight="700" fill="#451a03" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-76">XII</text>
      <text x="38" y="-66">I</text>
      <text x="68" y="-38">II</text>
      <text x="78" y="0">III</text>
      <text x="68" y="38">IV</text>
      <text x="38" y="66">V</text>
      <text x="0" y="76">VI</text>
      <text x="-38" y="66">VII</text>
      <text x="-68" y="38">VIII</text>
      <text x="-78" y="0">IX</text>
      <text x="-68" y="-38">X</text>
      <text x="-38" y="-66">XI</text>
    </g>

    <!-- Minute Track Ticks -->
    <circle cx="0" cy="0" r="86" stroke="#78350f" stroke-width="0.8" stroke-dasharray="1 8.2"/>

    <!-- Blued Steel Hands (Antique Breguet Moon Hands) -->
    <!-- Hour Hand -->
    <g transform="rotate(-40)">
      <path d="M 0 10 L 0 -48 L 4 -42 L 0 -58 L -4 -42 L 0 -48 Z" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="0.8"/>
      <circle cx="0" cy="-44" r="5" fill="#1e3a8a"/>
      <circle cx="0" cy="-44" r="2.5" fill="#fef3c7"/>
    </g>
    <!-- Minute Hand -->
    <g transform="rotate(72)">
      <path d="M 0 12 L 0 -68 L 3 -62 L 0 -78 L -3 -62 L 0 -68 Z" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="0.8"/>
      <circle cx="0" cy="-64" r="4" fill="#1e3a8a"/>
      <circle cx="0" cy="-64" r="2" fill="#fef3c7"/>
    </g>
    <!-- Center Jewel Pin -->
    <circle cx="0" cy="0" r="4" fill="#b91c1c" stroke="#fbbf24" stroke-width="1.2"/>
  </g>

  <!-- Intricate Coiled Watch Fob Chain (Draping Downward) -->
  <g stroke="#fbbf24" stroke-width="2" fill="none">
    <!-- Chain loops from crown down into foreground -->
    <path d="M 190 32 C 170 15, 120 40, 110 80 C 100 130, 90 220, 100 270 C 110 320, 140 360, 190 380 C 240 400, 290 360, 270 310 C 250 260, 200 290, 175 340 C 155 380, 170 430, 210 450" 
          stroke-dasharray="5 3" stroke-linecap="round"/>
    <path d="M 190 32 C 170 15, 120 40, 110 80 C 100 130, 90 220, 100 270 C 110 320, 140 360, 190 380 C 240 400, 290 360, 270 310 C 250 260, 200 290, 175 340 C 155 380, 170 430, 210 450" 
          stroke="#92400e" stroke-width="0.8" stroke-dasharray="1 7"/>

    <!-- Ornate Fob Key & Seal at Chain End -->
    <g transform="translate(210, 450)">
      <circle cx="0" cy="0" r="6" stroke="#fbbf24" stroke-width="2" fill="#382516"/>
      <!-- Fob Key Shaft -->
      <line x1="0" y1="6" x2="0" y2="34" stroke="#fbbf24" stroke-width="2.5"/>
      <!-- Key Bit Teething -->
      <path d="M 0 24 L 8 24 L 8 29 L 4 29 L 4 34 L 0 34" stroke="#fbbf24" stroke-width="2" fill="#fbbf24"/>
    </g>

    <!-- Suspended Fob Swivel Medallion -->
    <g transform="translate(100, 270)">
      <circle cx="0" cy="0" r="8" fill="#2d1c10" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
    </g>
  </g>
</svg>

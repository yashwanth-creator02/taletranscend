<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140" fill="none">
  <defs>
    <!-- Glass lens reflection gradient -->
    <linearGradient id="lensGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Wire-frame Scholar Spectacles -->
  <!-- Left Rim and Glass -->
  <g transform="translate(10, 10)">
    <!-- Lens surface with subtle glare -->
    <ellipse cx="65" cy="60" rx="42" ry="34" fill="url(#lensGlare)" stroke="#d4af37" stroke-width="2.2"/>
    <ellipse cx="65" cy="60" rx="40" ry="32" stroke="#92400e" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Glare streak -->
    <path d="M 45 42 Q 65 36, 85 45" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Left Temple / Arm -->
    <path d="M 23 60 C 12 55, 2 40, 0 20" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="60" r="2.5" fill="#f59e0b"/>

    <!-- Bridge Arch -->
    <path d="M 107 54 Q 120 44, 133 54" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 109 56 Q 120 48, 131 56" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Right Rim and Glass -->
    <ellipse cx="175" cy="60" rx="42" ry="34" fill="url(#lensGlare)" stroke="#d4af37" stroke-width="2.2"/>
    <ellipse cx="175" cy="60" rx="40" ry="32" stroke="#92400e" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Glare streak -->
    <path d="M 155 42 Q 175 36, 195 45" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Right Temple / Arm -->
    <path d="M 217 60 C 228 55, 238 40, 240 20" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <circle cx="217" cy="60" r="2.5" fill="#f59e0b"/>
  </g>
</svg>

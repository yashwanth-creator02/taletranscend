<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" width="380" height="500" fill="none">
  <defs>
    <radialGradient id="dialParchmentLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef7" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#fdf6e2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f7ebd0" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="watchShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Open Pocket Watch Case (Center-Top) -->
  <g transform="translate(190, 160)" filter="url(#watchShadowLight)">
    <!-- Top Crown and Bow Ring for Chain Loop -->
    <path d="M -16 -128 C -16 -148, 16 -148, 16 -128 C 16 -118, -16 -118, -16 -128 Z" 
          stroke="#b45309" stroke-width="4.5" fill="none"/>
    <!-- Winding Crown Stem and Knurled Knob -->
    <rect x="-10" y="-120" width="20" height="12" rx="2" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-8" y1="-116" x2="8" y2="-116" stroke="#fbbf24" stroke-width="1"/>
    <line x1="-8" y1="-112" x2="8" y2="-112" stroke="#fbbf24" stroke-width="1"/>

    <!-- Left Open Cover Lid (Flipped Open) -->
    <g transform="translate(-108, 0) rotate(-22)">
      <ellipse cx="0" cy="0" rx="32" ry="94" fill="#78350f" stroke="#b45309" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="26" ry="84" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Guilloche etching inside lid -->
      <path d="M 0 -70 Q 15 0, 0 70 M 0 -50 Q -12 0, 0 50" stroke="#d97706" stroke-width="0.8"/>
      <!-- Hinge -->
      <rect x="26" y="-12" width="8" height="24" rx="2" fill="#fbbf24"/>
    </g>

    <!-- Outer Watch Bezel / Fluted Rim in Warm Polished Brass -->
    <circle cx="0" cy="0" r="108" fill="#78350f" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="0" cy="0" r="102" stroke="#d4af37" stroke-width="1.8"/>

    <!-- Dial Surface in Luminous Ivory Parchment -->
    <circle cx="0" cy="0" r="95" fill="url(#dialParchmentLight)" stroke="#92400e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="91" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- Exposed Skeleton Gearwork Window (Center-Deep) -->
    <circle cx="0" cy="18" r="42" fill="#5c290a" stroke="#b45309" stroke-width="1.2"/>
    <!-- Brass Wheels and Teeth -->
    <g transform="translate(-8, 12)">
      <circle cx="0" cy="0" r="22" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3 2" fill="#78350f"/>
      <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#fbbf24" stroke-width="1"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#fbbf24" stroke-width="1"/>
    </g>
    <g transform="translate(18, 22)">
      <circle cx="0" cy="0" r="16" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 2" fill="#92400e"/>
      <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    </g>

    <!-- Roman Numerals Chapter Ring in Deep Burnt Umber -->
    <g font-family="Cinzel, serif" font-size="14" font-weight="700" fill="#451a03" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-76">XII</text>
      <text x="38" y="-66">I</text>
      <text x="68" y="-38">II</text>
      <text x="76" y="0">III</text>
      <text x="68" y="38">IV</text>
      <text x="38" y="66">V</text>
      <text x="0" y="76">VI</text>
      <text x="-38" y="66">VII</text>
      <text x="-68" y="38">VIII</text>
      <text x="-76" y="0">IX</text>
      <text x="-68" y="-38">X</text>
      <text x="-38" y="-66">XI</text>
    </g>

    <!-- Minute Track / Peripheral Marks -->
    <circle cx="0" cy="0" r="84" stroke="#92400e" stroke-width="0.8" stroke-dasharray="1 7"/>

    <!-- Breguet Antique Watch Hands (Pierced Moon Tips) -->
    <!-- Hour Hand pointing towards ~10:08 -->
    <g transform="rotate(-55)">
      <path d="M 0 8 L 0 -45 M -3 -35 C -8 -35, -8 -45, 0 -50 C 8 -45, 8 -35, 3 -35 Z" 
            stroke="#1c1917" stroke-width="2.5" fill="#451a03"/>
    </g>
    <!-- Minute Hand pointing towards ~10:08 -->
    <g transform="rotate(45)">
      <path d="M 0 10 L 0 -68 M -3 -55 C -8 -55, -8 -68, 0 -74 C 8 -68, 8 -55, 3 -55 Z" 
            stroke="#1c1917" stroke-width="2" fill="#451a03"/>
    </g>
    <!-- Center Jewel Boss / Arbor -->
    <circle cx="0" cy="0" r="5" fill="#b91c1c" stroke="#fbbf24" stroke-width="1"/>
  </g>

  <!-- Heavy Gold Albert Fob Watch Chain (Draped in Graceful Cathedrals) -->
  <g stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 190 32 C 170 -10, 80 50, 45 130 C 15 210, 60 320, 120 400 C 140 430, 180 460, 230 470 C 280 480, 330 440, 350 390"/>
    <path d="M 190 32 C 170 -10, 80 50, 45 130 C 15 210, 60 320, 120 400 C 140 430, 180 460, 230 470 C 280 480, 330 440, 350 390" 
          stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 6"/>
  </g>
  <!-- Watch Fob Locket / Seal at Chain Terminal -->
  <g transform="translate(350, 390)">
    <circle cx="0" cy="0" r="16" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" stroke="#f59e0b" stroke-width="1"/>
    <polygon points="0,-7 6,4 -6,4" fill="#fbbf24"/>
  </g>
</svg>

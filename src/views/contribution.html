<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contribution | TaleTranscend</title>
  <script type="module" src="../pages/contribution/contribution.js"></script>
</head>

<body class="antialiased min-h-screen bg-[var(--paper-bg)] text-[var(--text-main)]">
  <header class="fixed top-0 w-full z-50 bg-[var(--paper-bg)]/80 backdrop-blur-xl border-b border-[var(--border)]">
    <div class="max-w-[1600px] mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="profile.html"
          class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] hover:text-white transition-colors">
          Exit Studio
        </a>
        <h1 class="text-xs font-black uppercase tracking-[0.35em] text-indigo-400">Tale Architect</h1>
      </div>
      <div class="flex items-center gap-4">
        <!-- Wired via event listener in contribution.js -->
        <button id="save-draft-btn"
          class="text-[10px] uppercase tracking-widest text-[var(--text-muted)] hover:text-white transition-colors">
          Auto-saving...
        </button>
        <button id="publish-btn"
          class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase tracking-widest rounded-xl shadow-lg shadow-indigo-900/20">
          Publish
        </button>
      </div>
    </div>
  </header>

  <main class="pt-24 pb-12">
    <div
      class="max-w-[1600px] mx-auto px-6 h-[calc(100vh-6rem)] flex overflow-hidden rounded-3xl border border-[var(--border)]">
      <aside class="w-72 shrink-0 glass-panel flex flex-col">
        <div class="p-6 border-b border-white/5">
          <label class="block text-[10px] uppercase tracking-widest text-[var(--text-muted)] mb-3">Manuscript</label>
          <input type="text" id="tale-title" placeholder="Tale Title..."
            class="w-full bg-transparent fancy-title text-sm border-none outline-none text-indigo-300 placeholder-zinc-700" />
        </div>

        <div id="chapter-list" class="flex-1 overflow-y-auto py-4"></div>

        <!-- Wired via event listener in contribution.js -->
        <button id="add-chapter-btn"
          class="m-4 p-3 border border-dashed border-white/10 rounded-xl text-[10px] uppercase tracking-widest text-[var(--text-muted)] hover:border-indigo-500/50 hover:text-indigo-300 transition-all">
          + Add Chapter
        </button>
      </aside>

      <section class="flex-1 bg-[#0d0d11] overflow-hidden">
        <div class="max-w-3xl mx-auto h-full flex flex-col px-8 lg:px-16 py-12 overflow-y-auto">
          <div class="mb-10">
            <!-- Wired via event listener in contribution.js -->
            <input type="text" id="current-chapter-title" placeholder="Chapter Title..."
              class="w-full bg-transparent text-4xl fancy-title border-none outline-none text-white placeholder-zinc-800" />
          </div>

          <div class="flex gap-2 mb-8">
            <button id="ai-continue-btn"
              class="text-[10px] uppercase tracking-widest bg-white/5 hover:bg-white/10 px-4 py-1.5 rounded-full text-[var(--text-muted)] border border-white/5">
              Continue
            </button>
            <button id="ai-enhance-btn"
              class="text-[10px] uppercase tracking-widest bg-white/5 hover:bg-white/10 px-4 py-1.5 rounded-full text-[var(--text-muted)] border border-white/5">
              Enhance
            </button>
          </div>

          <!-- Wired via event listener in contribution.js -->
          <textarea id="chapter-content" class="bg-transparent writing-area w-full flex-1 text-zinc-300"
            placeholder="Your story begins here..."></textarea>

          <div
            class="mt-8 pt-4 border-t border-white/5 flex justify-between items-center text-[10px] uppercase tracking-widest text-[var(--text-muted)]">
            <span id="stat-words">0 Words</span>
            <span id="stat-status">Unsaved Changes</span>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>

</html>

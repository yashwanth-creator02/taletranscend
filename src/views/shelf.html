<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Studio | TaleTranscend</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../pages/shelf/shelf.js"></script>
</head>

<body class="text-slate-300 antialiased min-h-screen">
  <nav
    class="fixed top-0 w-full z-50 px-8 py-4 flex justify-between items-center bg-black/40 backdrop-blur-xl border-b border-white/5">
    <a href="index.html" class="font-black text-xl tracking-[0.3em] text-white uppercase italic">Tale<span
        class="text-indigo-500">Transcend</span></a>
    <div class="flex items-center gap-10">
      <div class="hidden md:flex gap-8 text-[10px] uppercase tracking-[0.2em] font-bold">
        <a href="library.html" class="text-zinc-500 hover:text-white transition">Library</a>
      </div>
      <a href="profile.html"
        class="group flex items-center gap-3 p-1 pr-4 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full transition-all">
        <div
          class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <span
          class="text-[9px] font-black uppercase tracking-widest text-zinc-400 group-hover:text-white transition-colors">Profile</span>
      </a>
    </div>
  </nav>

  <main class="pt-32 pb-20 max-w-[1500px] mx-auto px-8">
    <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-16">
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.4em] text-indigo-500 mb-2">Neural Hub / Workspace</p>
        <h1 class="text-5xl font-black uppercase tracking-tighter text-white">My Studio</h1>
      </div>
    </header>

    <div class="py-1 flex gap-10 border-b border-white/5 mb-12 overflow-x-auto no-scrollbar">
      <button id="tab-bookmarked" data-tab="bookmarked"
        class="shelf-tab studio-tab-active pb-6 text-[11px] uppercase tracking-[0.25em] font-black transition-all">
        Bookmarked Fragments
      </button>
      <button id="tab-drafts" data-tab="drafts"
        class="shelf-tab pb-6 text-zinc-500 hover:text-white text-[11px] uppercase tracking-[0.25em] font-black transition-all">
        Active Drafts
      </button>
    </div>

    <div id="studio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-8">
      <div class="col-span-full text-center py-20">
        <div class="inline-block w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin">
        </div>
        <p class="mt-4 text-zinc-500 font-medium">Loading your studio...</p>
      </div>
    </div>
  </main>
</body>

</html>

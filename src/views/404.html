<html lang="en">
  <head>

    <meta name="theme-color" content="#030305" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaleTranscend" />
    <meta property="og:url" content="https://taletranscend.web.app/404" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Page Not Found | TaleTranscend" />

    <!-- One font request, identical on every page. Nine different Google
         Fonts URLs across nine pages meant every navigation re-fetched a
         slightly different family set and re-rendered the whole document. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cinzel:wght@500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap"
    />

    <style>
      /* Critical Anti-FOUC Gate */
      html {
        background-color: #030305;
        color: #e2e8f0;
      }
      body {
        background-color: #030305;
        color: #e2e8f0;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      body:not(.booted) > *:not(#app-boot-curtain) {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      #app-boot-curtain {
        position: fixed;
        inset: 0;
        background-color: #030305;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.3s cubic-bezier(0, 0, 0.2, 1),
          visibility 0.3s cubic-bezier(0, 0, 0.2, 1);
        pointer-events: none;
      }
      body.booted #app-boot-curtain {
        opacity: 0;
        visibility: hidden;
      }
      .boot-crest {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(99, 102, 241, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.2);
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.96);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
    </style>
    <script>
      setTimeout(function () {
        if (document.body && !document.body.classList.contains('booted')) {
          document.body.classList.add('booted');
        }
      }, 3500);
    </script>
    <noscript>
      <style>
        body:not(.booted) > *:not(#app-boot-curtain) {
          opacity: 1 !important;
          visibility: visible !important;
        }
        #app-boot-curtain {
          display: none !important;
        }
      </style>
    </noscript>

    <link rel="stylesheet" href="../assets/css/base.css" />

    <script type="module" src="../pages/404/404.js"></script>
  </head>

  <body
    class="text-slate-300 antialiased selection:bg-indigo-500/30 page-fade-in flex flex-col h-screen overflow-hidden"
  >
    <!-- App Boot Curtain (Prevents FOUC on slower networks) -->
    <div id="app-boot-curtain" aria-hidden="true">
      <div class="boot-crest">
        <img src="/logo.png" alt="" width="26" height="26" class="object-contain" />
      </div>
    </div>

    <a class="skip-link" href="#main-content">Skip to content</a>
    <!-- Background (matches your existing pages) -->
    <div class="fixed inset-0 -z-10 bg-slate-950">
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(99,102,241,0.08),transparent_50%)]"
      ></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_80%_80%,rgba(139,92,246,0.05),transparent_40%)]"
      ></div>
    </div>

    <!-- Content -->
    <main id="main-content" class="flex-1 flex items-center justify-center px-6">
      <div class="text-center max-w-md">
        <!-- 404 Number -->
        <h1
          class="text-[8rem] leading-none font-black text-transparent bg-clip-text bg-linear-to-b from-slate-100 via-slate-300 to-indigo-400 tracking-tighter select-none"
        >
          404
        </h1>

        <!-- Message -->
        <h2 class="mt-4 text-2xl font-bold text-slate-100 font-cinzel">Lost in the Archives</h2>
        <p class="mt-3 text-sm text-slate-400 leading-relaxed">
          The tale you seek has vanished into the mists of time. Perhaps it was never written, or
          the pages have turned to dust.
        </p>

        <!-- Actions -->
        <div class="mt-8 flex items-center justify-center gap-4">
          <a
            href="/index.html"
            class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 text-sm font-semibold hover:bg-indigo-600/30 hover:text-indigo-200 transition-all"
          >
            <i data-lucide="home" class="w-4 h-4"></i>
            Return Home
          </a>
          <a
            href="/library.html"
            class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-white/5 border border-white/10 text-slate-300 text-sm font-semibold hover:bg-white/10 hover:text-white transition-all"
          >
            <i data-lucide="library" class="w-4 h-4"></i>
            Browse Library
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-600">
      TaleTranscend — Preserving the roots of our culture
    </footer>
  </body>
</html>

<!-- src/views/tale.html -->

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tale Page | TaleTranscend</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../pages/tale/tale.js"></script>
</head>

<body class="min-h-screen">


  <div id="hero-section"
    class="hero-gradient h-[57vh] flex flex-col justify-end px-8 pb-12 transition-all duration-1000"
    style="--bg-url: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');">
    <div class="max-w-6xl mx-auto w-full">
      <div class="flex items-center gap-3 mb-6">
        <span class="h-[1px] w-12 bg-indigo-500"></span>
        <h2 id="loading-indicator" class="text-indigo-500 text-[10px] font-black uppercase tracking-[0.5em]">Syncing
          Neural Link</h2>
      </div>
      <h1 id="display-title"
        class="text-6xl md:text-8xl font-black text-white tracking-tighter uppercase leading-[0.9] mb-8 opacity-0 transition-all duration-1000 transform translate-y-8">
        ...</h1>
      <div id="meta-container"
        class="flex flex-wrap items-center gap-4 opacity-0 transition-all duration-1000 delay-300">
        <span id="display-author"
          class="px-4 py-2 bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 rounded-xl text-[10px] font-black uppercase tracking-widest backdrop-blur-md">Scribe
          Unknown</span>
        <span id="display-chapters"
          class="px-4 py-2 bg-white/5 border border-white/10 text-zinc-400 rounded-xl text-[10px] font-black uppercase tracking-widest backdrop-blur-md">0
          Fragments</span>
        <span id="read-time"
          class="px-4 py-2 bg-white/5 border border-white/10 text-zinc-400 rounded-xl text-[10px] font-black uppercase tracking-widest backdrop-blur-md">0
          min</span>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-8 py-16">
    <div class="flex flex-col lg:flex-row gap-20">
      <div class="flex-1">
        <div class="flex gap-12 border-b border-white/5 mb-12 overflow-x-auto no-scrollbar">
          <!-- data-tab used by setupTabs() event listener in interactions.js -->
          <button id="tab-about" data-tab="about"
            class="tab-btn active pb-5 text-[10px] uppercase tracking-[0.3em] font-black">Synopsis</button>
          <button id="tab-chapters" data-tab="chapters"
            class="tab-btn pb-5 text-[10px] uppercase tracking-[0.3em] font-black">Chronicles</button>
          <button id="tab-comments" data-tab="comments"
            class="tab-btn pb-5 text-[10px] uppercase tracking-[0.3em] font-black">Echoes</button>
        </div>

        <div id="content-about" class="tab-content block">
          <div id="display-description" class="text-sm leading-relaxed text-zinc-500 space-y-6 max-w-2xl font-medium">
            Initialising narrative decryption...
          </div>
        </div>

        <div id="content-chapters" class="tab-content hidden">
          <div id="chapter-list" class="grid gap-4"></div>
        </div>

        <div id="content-comments" class="tab-content hidden">
          <div class="glass-card p-10 rounded-[2.5rem] mb-12 border-indigo-500/10">
            <textarea id="comment-text"
              class="w-full bg-black/40 border border-white/5 p-6 rounded-2xl text-sm mb-6 h-32 text-white focus:outline-none focus:border-indigo-500/40 transition-all placeholder:text-zinc-700"
              placeholder="Submit your echo to the collective..."></textarea>
            <!-- ID added — wired via event listener in tale.js -->
            <button id="post-btn"
              class="px-10 py-4 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase tracking-widest rounded-xl shadow-lg shadow-indigo-600/20 transition-all">
              Transmit Entry
            </button>
          </div>
          <div id="comments-list" class="space-y-6"></div>
        </div>
      </div>

      <aside class="w-full lg:w-80 shrink-0">
        <div id="cover-container" class="glass-card p-3 rounded-[2.5rem] mb-6 shine-container group">
          <img id="display-cover" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800"
            class="w-full h-[480px] object-cover rounded-[2rem] grayscale-[15%] group-hover:grayscale-0 transition-all duration-1000"
            alt="Tale Cover" />
          <div class="shine-layer"></div>
        </div>

        <div class="space-y-3 mb-10">
          <button id="start-btn"
            class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[10px] uppercase tracking-[0.4em] rounded-2xl shadow-2xl shadow-indigo-600/30 transition-all active:scale-95 flex items-center justify-center gap-3">
            <span>Initiate Chronicle</span>
            <i data-lucide="play" class="w-4 h-4"></i>
          </button>
          <button id="resume-btn"
            class="w-full py-5 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-black text-[10px] uppercase tracking-[0.4em] rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-3">
            <span id="resume-text">Resume Fragment</span>
            <i data-lucide="rotate-ccw" class="w-4 h-4 text-indigo-400"></i>
          </button>
          <div class="flex items-center justify-center gap-6 pt-4">
            <button title="Add to shelf" class="group">
              <i data-lucide="book-plus"
                class="w-5 h-5 text-zinc-600 group-hover:text-violet-500 transition-colors"></i>
            </button>
            <div class="w-[1px] h-4 bg-white/10"></div>
            <button title="Share Tale" class="group">
              <i data-lucide="share-2" class="w-5 h-5 text-zinc-600 group-hover:text-indigo-400 transition-colors"></i>
            </button>
          </div>
        </div>

        <div class="glass-card p-8 rounded-[2rem] text-center border border-white/5">
          <p class="text-[9px] text-indigo-500 font-black uppercase tracking-widest mb-1">Archived Status</p>
          <div id="creation-date" class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Universal Era
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>

</html>

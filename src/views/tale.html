<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/" />

    <title>Tale | TaleTranscend</title>
    <meta
      name="description"
      content="Chapters, resonance and discussion for a single tale in the TaleTranscend archive."
    />
    <link rel="canonical" href="https://taletranscend.web.app/tale" />

    <meta name="theme-color" content="#030305" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaleTranscend" />
    <meta property="og:url" content="https://taletranscend.web.app/tale" />
    <meta property="og:title" content="Tale | TaleTranscend" />
    <meta
      property="og:description"
      content="Chapters, resonance and discussion for a single tale in the TaleTranscend archive."
    />
    <meta property="og:image" content="https://taletranscend.web.app/logo-wide.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://taletranscend.web.app/logo-wide.png" />
    <meta name="twitter:title" content="Tale | TaleTranscend" />
    <meta
      name="twitter:description"
      content="Chapters, resonance and discussion for a single tale in the TaleTranscend archive."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cinzel:wght@500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap"
    />

    <style>
      /* Critical Anti-FOUC Gate */
      html {
        background-color: #030305;
        color: #e2e8f0;
      }
      body {
        background-color: #030305;
        color: #e2e8f0;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      body:not(.booted) > *:not(#app-boot-curtain) {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      #app-boot-curtain {
        position: fixed;
        inset: 0;
        background-color: #030305;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.3s cubic-bezier(0, 0, 0.2, 1),
          visibility 0.3s cubic-bezier(0, 0, 0.2, 1);
        pointer-events: none;
      }
      body.booted #app-boot-curtain {
        opacity: 0;
        visibility: hidden;
      }
      .boot-crest {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(99, 102, 241, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.2);
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.96);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
    </style>
    <script>
      setTimeout(function () {
        if (document.body && !document.body.classList.contains('booted')) {
          document.body.classList.add('booted');
        }
      }, 3500);
    </script>
    <noscript>
      <style>
        body:not(.booted) > *:not(#app-boot-curtain) {
          opacity: 1 !important;
          visibility: visible !important;
        }
        #app-boot-curtain {
          display: none !important;
        }
      </style>
    </noscript>

    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/nav.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/pages/tale.css" />

    <script type="module" src="../pages/tale/tale.js"></script>
  </head>

  <body
    class="min-h-screen antialiased selection:bg-indigo-500/30 selection:text-white page-fade-in flex flex-col h-screen overflow-hidden text-slate-200"
  >
    <!-- App Boot Curtain (Prevents FOUC on slower networks) -->
    <div id="app-boot-curtain" aria-hidden="true">
      <div class="boot-crest">
        <img src="/logo.png" alt="" width="26" height="26" class="object-contain" />
      </div>
    </div>

    <a class="skip-link" href="#main-content">Skip to content</a>
    <!-- Atmospheric Background Layers -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10" aria-hidden="true">
      <div class="atmosphere-base"></div>
      <div class="particle-field"></div>
      <div class="ambient-orb w-96 h-96 bg-indigo-500/10 -top-20 -left-20"></div>
      <div class="ambient-orb w-96 h-96 bg-violet-500/10 top-1/3 -right-32"></div>
      <div class="ambient-orb w-96 h-96 bg-amber-500/5 -bottom-20 -left-20"></div>
    </div>

    <main
      id="main-content"
      class="app-viewport scroll-container overflow-y-auto flex-1 focus:outline-none"
    >
      <!-- ── Breadcrumb & Top Bar ── -->
      <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 sm:pt-6 pb-2">
        <div class="flex items-center justify-between gap-4">
          <a
            href="/library.html"
            id="btn-back-nav"
            class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-white/6 bg-white/3 hover:bg-white/7 hover:border-white/12 text-xs font-semibold text-slate-400 hover:text-white transition-all group"
          >
            <i
              data-lucide="chevron-left"
              class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform text-slate-500 group-hover:text-white"
            ></i>
            <span>Library</span>
          </a>
          <span id="loading-indicator" class="hidden" aria-hidden="true"></span>
        </div>
      </div>

      <!-- ── Hero Section (The Chronicle Codex Header) ── -->
      <section
        id="hero-section"
        class="hero-gradient shrink-0 relative w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-7 pb-8 sm:pb-9 my-3 overflow-hidden"
      >
        <!-- Blurred Cover Backdrop Layer -->
        <div class="hero-cover-backdrop" aria-hidden="true">
          <div id="hero-backdrop-img" class="hero-cover-backdrop-img"></div>
          <div class="hero-cover-backdrop-overlay"></div>
        </div>

        <div class="relative z-10 space-y-6 max-w-4xl min-w-0">
          <!-- Era & Provenance Pill -->
          <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <span
              class="px-2.5 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-[10px] font-black uppercase tracking-[0.25em]"
            >
              Tale Chronicle
            </span>
            <span
              id="tale-era"
              class="px-2.5 py-1 rounded-lg bg-white/4 border border-white/6 text-slate-300 text-[10px] font-bold uppercase tracking-[0.2em]"
            >
              —
            </span>
            <span
              id="tale-genre"
              class="px-2.5 py-1 rounded-lg bg-white/4 border border-white/6 text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]"
            >
              —
            </span>
            <span
              id="tale-language"
              class="px-2.5 py-1 rounded-lg bg-white/4 border border-white/6 text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em] hidden sm:inline-block"
            >
              —
            </span>
          </div>

          <!-- Title -->
          <h1
            id="display-title"
            class="hero-title font-cinzel font-black text-2xl sm:text-3xl md:text-4xl lg:text-5xl text-white tracking-tight leading-[1.12] transition-all duration-700"
          >
            Loading Chronicle...
          </h1>

          <!-- Author & Metadata Row (with Ongoing / Completed / Hiatus / Stopped Status) -->
          <div
            id="hero-meta"
            class="flex flex-wrap items-center gap-2 sm:gap-2.5 transition-all duration-700"
          >
            <div
              class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/4 border border-white/8 shadow-sm backdrop-blur-xs"
            >
              <img
                id="author-avatar-hero"
                src=""
                class="w-5 h-5 rounded-md bg-zinc-800 object-cover"
                alt="Author"
              />
              <span id="display-author" class="text-xs font-semibold text-slate-200"> ... </span>
            </div>

            <div
              id="display-status-pill"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/4 border border-white/8 shadow-sm backdrop-blur-xs text-xs text-slate-200"
            >
              <span
                id="display-status-dot"
                class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"
              ></span>
              <span
                id="display-status"
                class="font-bold uppercase tracking-wider text-[10px] text-slate-200"
                >Ongoing</span
              >
            </div>

            <div
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/3 border border-white/6 shadow-sm backdrop-blur-xs text-xs text-slate-300"
            >
              <i data-lucide="layers" class="w-3.5 h-3.5 text-indigo-400"></i>
              <span id="display-chapters" class="font-medium text-slate-300">0 Fragments</span>
            </div>

            <div
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/3 border border-white/6 shadow-sm backdrop-blur-xs text-xs text-slate-300"
            >
              <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i>
              <span id="read-time" class="font-medium text-slate-300">0 min read</span>
            </div>
          </div>

          <!-- Mobile Quick Actions (Visible on screens < lg) -->
          <div class="space-y-2 pt-2 lg:hidden w-full">
            <div class="grid grid-cols-2 gap-2">
              <button
                id="start-btn"
                class="action-btn h-11 px-4 bg-linear-to-r from-indigo-500 to-violet-600 hover:from-indigo-400 hover:to-violet-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition-all cursor-pointer"
              >
                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                <span>Initiate</span>
              </button>

              <button
                id="resume-btn"
                class="action-btn h-11 px-4 glass-strong border border-white/10 hover:border-indigo-500/30 text-indigo-300 hover:text-white rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all cursor-pointer"
              >
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span id="resume-text">Resume</span>
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <button
                id="resonance-btn-mobile"
                class="action-btn h-10 px-2 glass border border-white/10 hover:border-red-500/40 text-slate-300 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer group"
                title="Soul Resonance"
                aria-label="Soul Resonance"
              >
                <i
                  data-lucide="heart"
                  class="w-3.5 h-3.5 text-slate-400 group-hover:text-red-400 transition-colors"
                ></i>
                <span id="resonance-count-mobile" class="font-bold tracking-wide">0</span>
              </button>

              <button
                id="shelf-btn"
                class="action-btn h-10 px-2 glass border border-white/10 hover:border-indigo-500/30 text-slate-300 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer"
                title="Save to Shelf"
                aria-label="Save to Shelf"
              >
                <i data-lucide="bookmark-plus" class="w-3.5 h-3.5"></i>
                <span>Shelf</span>
              </button>

              <button
                id="share-btn"
                class="action-btn h-10 px-2 glass border border-white/10 hover:border-indigo-500/30 text-slate-300 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer"
                title="Share Tale"
                aria-label="Share Tale"
              >
                <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                <span>Share</span>
              </button>
            </div>
          </div>

          <!-- Desktop Command Hub (Visible on lg+) -->
          <div class="hidden lg:flex flex-wrap items-center gap-3 pt-2">
            <button
              id="start-btn-desktop"
              class="action-btn py-3 px-6 bg-linear-to-r from-indigo-500 via-indigo-600 to-violet-600 hover:from-indigo-400 hover:to-violet-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0"
            >
              <i data-lucide="play" class="w-4 h-4 fill-current"></i>
              <span>Initiate Reading</span>
            </button>

            <button
              id="resume-btn-desktop"
              class="action-btn py-3 px-5 glass-strong border border-white/10 hover:border-indigo-500/30 text-indigo-300 hover:text-white rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0"
            >
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
              <span id="resume-text-desktop">Resume</span>
            </button>

            <button
              id="resonance-btn-desktop"
              class="action-btn py-3 px-4.5 glass border border-white/8 hover:border-red-500/40 text-slate-300 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0 group"
              title="Soul Resonance"
              aria-label="Soul Resonance"
            >
              <i
                data-lucide="heart"
                class="w-4 h-4 text-slate-400 group-hover:text-red-400 transition-colors"
              ></i>
              <span id="resonance-count" class="font-bold tracking-wide">0</span>
            </button>

            <button
              id="shelf-btn-desktop"
              class="action-btn py-3 px-4 glass border border-white/8 hover:border-indigo-500/30 text-slate-300 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0"
              title="Save to Shelf"
              aria-label="Save to Shelf"
            >
              <i data-lucide="bookmark-plus" class="w-3.5 h-3.5"></i>
              <span>Save to Shelf</span>
            </button>

            <button
              id="share-btn-desktop"
              class="action-btn py-3 px-4 glass border border-white/8 hover:border-indigo-500/30 text-slate-300 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all cursor-pointer shrink-0"
              title="Share Tale"
              aria-label="Share Tale"
            >
              <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
              <span>Share</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ── Main Content: Sticky Hanging Cover Art + Interactive Tab Panes ── -->
      <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 pb-20 sm:pb-24">
        <div
          class="grid grid-cols-1 lg:grid-cols-[250px_1fr] xl:grid-cols-[280px_1fr] gap-8 items-start"
        >
          <!-- Sticky Hanging Cover Art Column (Hangs relative to viewport on scroll) -->
          <aside class="w-full flex justify-center lg:block lg:sticky lg:top-8 self-start shrink-0">
            <div
              class="glass-card p-2 sm:p-2.5 rounded-3xl shine-container group w-48 sm:w-56 lg:w-full aspect-3/4 max-h-[380px] xl:max-h-[420px] overflow-hidden shadow-2xl border border-white/8 relative"
            >
              <img
                id="display-cover"
                class="w-full h-full object-cover rounded-2xl group-hover:scale-105 transition-transform duration-700"
                src=""
                alt="Cover"
              />
              <div class="shine-layer"></div>
            </div>
          </aside>

          <!-- Tab Panes Column -->
          <div class="space-y-8 min-w-0">
            <!-- Tab Navigation Strip -->
            <div
              class="flex items-center gap-2 sm:gap-3 border-b border-white/6 pb-2 overflow-x-auto no-scrollbar"
            >
              <button
                data-tab="about"
                class="tab-btn active px-5 py-2.5 text-xs font-bold uppercase tracking-[0.2em] rounded-xl transition-all"
              >
                Synopsis
              </button>
              <button
                data-tab="chapters"
                class="tab-btn px-5 py-2.5 text-xs font-bold uppercase tracking-[0.2em] rounded-xl transition-all"
              >
                Chronicles
              </button>
              <button
                data-tab="comments"
                class="tab-btn px-5 py-2.5 text-xs font-bold uppercase tracking-[0.2em] rounded-xl transition-all"
              >
                Echoes
              </button>
            </div>

            <!-- Tab 1: Synopsis Pane -->
            <div id="content-about" class="tab-content space-y-6 animate-fade-in">
              <div
                class="glass-card-strong p-6 sm:p-8 rounded-3xl border border-white/6 shadow-xl relative overflow-hidden"
              >
                <div class="flex items-center gap-2.5 mb-4 text-indigo-400">
                  <i data-lucide="scroll-text" class="w-4 h-4"></i>
                  <span class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-300">
                    Narrative Lore
                  </span>
                </div>
                <div
                  id="display-description"
                  class="text-sm sm:text-base leading-relaxed text-slate-300 font-normal font-sans"
                >
                  Unravelling chronicle lore...
                </div>
              </div>

              <!-- Knowledge Tags -->
              <div class="glass-card p-6 rounded-3xl border border-white/5 space-y-3">
                <div class="flex items-center gap-2.5 text-slate-400">
                  <i data-lucide="tags" class="w-4 h-4 text-indigo-400"></i>
                  <span class="text-[10px] font-black uppercase tracking-[0.25em] text-slate-300">
                    Archival Tags
                  </span>
                </div>
                <div id="lore-tag-list" class="flex flex-wrap gap-2"></div>
              </div>
            </div>

            <!-- Tab 2: Chronicles (Chapters) Pane -->
            <div id="content-chapters" class="tab-content hidden animate-fade-in space-y-4">
              <div
                class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-2 mb-2 pb-3 border-b border-white/6"
              >
                <div>
                  <h3 class="text-xs font-black uppercase tracking-[0.3em] text-slate-300">
                    Fragment Trail
                  </h3>
                  <span
                    id="chronicle-read-count"
                    class="text-[10px] font-bold uppercase tracking-widest text-indigo-400/80"
                  >
                    Chronicle Sequence
                  </span>
                </div>
                <!-- Batch Actions Toolbar -->
                <div class="flex items-center gap-2 flex-wrap">
                  <button
                    type="button"
                    id="btn-mark-all-read"
                    class="px-3 py-1.5 rounded-xl border border-indigo-500/20 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 hover:text-white text-[10px] font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 cursor-pointer shadow-sm active:scale-95"
                    title="Mark all fragments as read"
                  >
                    <i data-lucide="check-check" class="w-3.5 h-3.5"></i>
                    <span>Mark All Read</span>
                  </button>
                  <button
                    type="button"
                    id="btn-mark-all-unread"
                    class="px-3 py-1.5 rounded-xl border border-white/8 bg-white/4 hover:bg-white/10 hover:border-white/15 text-slate-400 hover:text-white text-[10px] font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 cursor-pointer shadow-sm active:scale-95"
                    title="Mark all fragments as unread"
                  >
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span>Mark All Unread</span>
                  </button>
                  <button
                    type="button"
                    id="btn-download-all-chronicles"
                    class="px-3 py-1.5 rounded-xl border border-white/8 bg-white/4 hover:bg-white/10 hover:border-white/15 text-slate-400 hover:text-white text-[10px] font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 cursor-pointer shadow-sm active:scale-95"
                    title="Download entire chronicle (.md)"
                  >
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Download All</span>
                  </button>
                </div>
              </div>
              <div id="chapter-list" class="space-y-3">
                <!-- Rendered by ui.js -->
              </div>
            </div>

            <!-- Tab 3: Echoes (Comments) Pane -->
            <div id="content-comments" class="tab-content hidden animate-fade-in space-y-6">
              <div
                class="glass-card-strong p-6 sm:p-8 rounded-3xl border border-white/6 shadow-xl space-y-4"
              >
                <div class="flex items-center gap-2.5 text-indigo-400">
                  <i data-lucide="message-square-plus" class="w-4 h-4"></i>
                  <span class="text-[10px] font-black uppercase tracking-[0.25em] text-indigo-300">
                    Inscribe Reflection
                  </span>
                </div>
                <textarea
                  id="comment-text"
                  class="comment-input w-full p-4 rounded-2xl text-sm font-medium h-32 focus:ring-1 focus:ring-indigo-500/50"
                  placeholder="Leave an echo in this chronicle..."
                ></textarea>
                <div class="flex justify-end">
                  <button
                    id="post-btn"
                    class="px-6 py-2.5 bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-bold uppercase tracking-wider rounded-xl transition-all shadow-md shadow-indigo-500/20 active:scale-95 cursor-pointer"
                  >
                    Post Echo
                  </button>
                </div>
              </div>

              <div id="comments-list" class="space-y-4">
                <!-- Rendered by comments.js -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Floating Action Bar (Appears on deep scroll) ── -->
      <div id="tale-action-bar" class="floating-bar is-hidden">
        <div class="floating-bar__inner">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
              <div
                class="w-9 h-9 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center shrink-0 hidden sm:flex"
              >
                <i data-lucide="scroll" class="w-4 h-4 text-indigo-400"></i>
              </div>
              <div class="min-w-0">
                <h2 id="header-tale-title" class="text-white font-bold text-xs sm:text-sm truncate">
                  Loading Archive...
                </h2>
                <p
                  id="reader-chapter-label"
                  class="text-[9px] font-bold uppercase tracking-[0.2em] text-indigo-400/80 truncate"
                >
                  Chronicle Codex
                </p>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <button
                id="resume-btn-bar"
                class="action-btn h-10 px-4 glass-strong rounded-xl text-[10px] font-bold uppercase tracking-wider text-indigo-300 border-indigo-500/20 flex items-center gap-1.5 cursor-pointer"
              >
                <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                <span>Resume</span>
              </button>
              <button
                id="start-btn-bar"
                class="action-btn h-10 px-4 bg-linear-to-r from-indigo-500 to-violet-600 rounded-xl text-[10px] font-bold uppercase tracking-wider text-white shadow-md shadow-indigo-500/20 flex items-center gap-1.5 cursor-pointer"
              >
                <i data-lucide="play" class="w-3 h-3 fill-current"></i>
                <span>Read</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Scroll to Top Button (Appears when scrolling down) ── -->
      <button
        id="scroll-to-top"
        class="scroll-to-top fixed bottom-6 right-6 z-40 p-3.5 rounded-2xl border border-white/10 glass-strong text-slate-300 hover:text-white hover:border-indigo-500/40 shadow-xl transition-all duration-300 opacity-0 pointer-events-none translate-y-3 flex items-center justify-center cursor-pointer group"
        aria-label="Scroll to top of chronicle"
      >
        <i
          data-lucide="arrow-up"
          class="w-5 h-5 group-hover:-translate-y-0.5 transition-transform text-indigo-300 group-hover:text-white"
        ></i>
      </button>
    </main>

    <!-- Toast Notifications -->
    <div
      id="reader-toast-container"
      class="fixed top-24 right-8 z-200 flex flex-col gap-3 pointer-events-none"
    ></div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Gateway Timeout | TaleTranscend</title>
    <meta name="description" content="The archive did not answer in time." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://taletranscend.web.app/504" />

    <meta name="theme-color" content="#030305" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaleTranscend" />
    <meta property="og:url" content="https://taletranscend.web.app/504" />
    <meta property="og:title" content="Gateway Timeout | TaleTranscend" />
    <meta property="og:description" content="The archive did not answer in time." />
    <meta property="og:image" content="https://taletranscend.web.app/logo-wide.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://taletranscend.web.app/logo-wide.png" />
    <meta name="twitter:title" content="Gateway Timeout | TaleTranscend" />
    <meta name="twitter:description" content="The archive did not answer in time." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cinzel:wght@500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap"
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('tt_app_theme') || 'transcendental';
          var resolved = t;
          if (t === 'system') {
            resolved =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'transcendental'
                : 'light';
          }
          document.documentElement.setAttribute('data-app-theme', resolved);
          document.documentElement.setAttribute('data-theme-preference', t);
        } catch (e) {}
      })();
    </script>

    <style>
      /* Critical Anti-FOUC Gate */
      html {
        background-color: #030305;
        color: #e2e8f0;
      }
      html[data-app-theme='dark'] {
        background-color: #0b0d13;
        color: #f8fafc;
      }
      html[data-app-theme='light'] {
        background-color: #f7f5f0;
        color: #1e293b;
      }
      body {
        background-color: inherit;
        color: inherit;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      body:not(.booted) > *:not(#app-boot-curtain) {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      #app-boot-curtain {
        position: fixed;
        inset: 0;
        background-color: inherit;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.3s cubic-bezier(0, 0, 0.2, 1),
          visibility 0.3s cubic-bezier(0, 0, 0.2, 1);
        pointer-events: none;
      }
      body.booted #app-boot-curtain {
        opacity: 0;
        visibility: hidden;
      }
      .boot-crest {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(99, 102, 241, 0.08);
        border: 1px solid rgba(99, 102, 241, 0.2);
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.96);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }
    </style>
    <script>
      setTimeout(function () {
        if (document.body && !document.body.classList.contains('booted')) {
          document.body.classList.add('booted');
        }
      }, 1500);
    </script>
    <noscript>
      <style>
        body:not(.booted) > *:not(#app-boot-curtain) {
          opacity: 1 !important;
          visibility: visible !important;
        }
        #app-boot-curtain {
          display: none !important;
        }
      </style>
    </noscript>

    <script type="module" src="../pages/errors/error.js"></script>
  </head>

  <body
    class="antialiased selection:bg-indigo-500/30 page-fade-in flex flex-col h-screen overflow-hidden"
    data-error-code="504"
  >
    <div id="app-boot-curtain" aria-hidden="true">
      <div class="boot-crest">
        <img src="/logo.png" alt="" width="26" height="26" class="object-contain" />
      </div>
    </div>

    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="fixed inset-0 -z-10 bg-bg-base">
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(99,102,241,0.08),transparent_50%)]"
      ></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_80%_80%,rgba(139,92,246,0.05),transparent_40%)]"
      ></div>
    </div>

    <main id="main-content" class="flex-1 flex items-center justify-center px-6">
      <div class="text-center max-w-md">
        <h1 class="error-code-title">504</h1>

        <h2 class="mt-4 text-2xl font-bold text-ink font-cinzel">The Archive Did Not Answer</h2>
        <p class="mt-3 text-sm text-muted leading-relaxed">
          A service behind the archive took too long to respond. The request was abandoned before it
          could finish. Try again in a moment.
        </p>

        <div class="mt-8 flex flex-wrap items-center justify-center gap-4">
          <button
            type="button"
            data-error-retry
            class="btn btn-primary px-6 py-3 rounded-xl text-sm font-semibold"
          >
            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            Try Again
          </button>
          <a href="/index.html" class="btn btn-ghost px-6 py-3 rounded-xl text-sm font-semibold">
            <i data-lucide="home" class="w-4 h-4"></i>
            Return Home
          </a>
        </div>

        <section id="error-context" class="error-context" aria-label="Request details" hidden>
          <div class="error-context__row">
            <span class="error-context__label">Requested</span>
            <span id="error-context-source" class="error-context__value"></span>
          </div>
          <div id="error-context-reason-row" class="error-context__row" hidden>
            <span class="error-context__label">Reason</span>
            <span id="error-context-reason" class="error-context__value"></span>
          </div>
          <div class="error-context__row">
            <span class="error-context__label">Logged</span>
            <time id="error-context-time" class="error-context__value"></time>
          </div>
        </section>

        <p id="error-offline-hint" class="error-offline-hint" hidden>
          You appear to be offline. Reconnect, then try again.
        </p>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Reader | TaleTranscend</title>
    <meta
      name="description"
      content="A distraction-free reading surface with twelve themes, twelve typefaces and full typography control."
    />
    <link rel="canonical" href="https://taletranscend.web.app/reader" />

    <meta name="theme-color" content="#030305" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaleTranscend" />
    <meta property="og:url" content="https://taletranscend.web.app/reader" />
    <meta property="og:title" content="Reader | TaleTranscend" />
    <meta
      property="og:description"
      content="A distraction-free reading surface with twelve themes, twelve typefaces and full typography control."
    />
    <meta property="og:image" content="https://taletranscend.web.app/icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reader | TaleTranscend" />
    <meta
      name="twitter:description"
      content="A distraction-free reading surface with twelve themes, twelve typefaces and full typography control."
    />

    <!-- One font request, identical on every page. Nine different Google
         Fonts URLs across nine pages meant every navigation re-fetched a
         slightly different family set and re-rendered the whole document. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cinzel:wght@500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap"
    />

    <script type="module" src="../pages/reader/reader.js"></script>
  </head>

  <body class="antialiased">
    <a class="skip-link" href="#scroller">Skip to content</a>
    <!--
      class="reader-surface" + data-reader-theme are load-bearing: theme.js
      targets `.reader-surface` (see _getSurface() in pages/reader/theme.js)
      to apply both the colour theme and every typography custom property
      (--reader-font-family, --reader-font-size, --reader-line-height,
      --reader-measure). Renaming or removing either one silently breaks
      every control in the reader settings panel — they will keep updating
      their own active/pressed state while the page itself never changes,
      which is exactly the bug this comment exists to prevent regressing to.
    -->
    <div id="app" class="app-container reader-surface" data-reader-theme="noir">
      <div class="atmosphere" id="atmosphere"></div>
      <div class="particles" id="particles"></div>

      <!-- Top Reading Progress -->
      <div class="top-progress">
        <div class="top-progress-bar progress-bar" id="progress-bar" style="width: 0%"></div>
      </div>

      <!-- Header / Top Bar -->
      <header class="top-bar glass-strong" id="top-bar">
        <button type="button" id="back-btn" class="reader-back-btn" aria-label="Return to Tale">
          <i data-lucide="arrow-left" style="width: 16px; height: 16px"></i>
          <span class="back-btn-text">Back</span>
        </button>

        <!-- Desktop Navigation Meta -->
        <div class="top-bar-center" id="top-bar-center">
          <i data-lucide="book-open" class="top-bar-icon"></i>
          <span class="top-bar-ch-count">
            Ch. <span id="top-bar-ch-num">1</span>/<span id="top-bar-ch-total">5</span>
          </span>
          <span class="top-bar-sep"></span>
          <span class="rune-text top-bar-ch-title truncate" id="top-bar-ch-title">
            Loading...
          </span>
        </div>

        <!-- Right Side Stats -->
        <div class="top-bar-stats">
          <span id="top-bar-read-time" class="hidden top-bar-read-time items-center gap-1.5">
            <i data-lucide="clock" style="width: 14px; height: 14px"></i>
            <span id="top-bar-min">0</span> min
          </span>
          <span class="tabular-nums font-medium" id="top-bar-pct">0%</span>
        </div>
      </header>

      <div class="main-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-strong" id="sidebar">
          <button class="glyph-btn" id="collapse-btn" aria-label="Collapse sidebar">
            <i data-lucide="chevron-left" style="width: 16px; height: 16px" id="collapse-icon"></i>
          </button>
          <div class="sidebar-divider"></div>

          <div class="sidebar-tools" id="sidebar-tools">
            <!-- Populated by JS -->
          </div>

          <div class="sidebar-bottom">
            <div class="sidebar-divider"></div>
            <button
              class="glyph-btn"
              id="sidebar-bookmark"
              data-active="false"
              aria-label="Bookmark"
            >
              <i data-lucide="bookmark" style="width: 20px; height: 20px"></i>
            </button>
            <button
              class="glyph-btn"
              id="sidebar-focus"
              data-active="false"
              aria-label="Focus mode"
            >
              <i data-lucide="maximize-2" style="width: 20px; height: 20px"></i>
            </button>
          </div>
        </aside>

        <!-- Tool Panel Backdrop (Mobile drawer overlay) -->
        <div id="tool-panel-backdrop" class="tool-panel-backdrop" aria-hidden="true"></div>

        <!-- Tool Panel -->
        <div class="tool-panel glass-strong" id="tool-panel">
          <div class="tool-panel-header">
            <div>
              <div class="panel-eyebrow">Panel</div>
              <div class="rune-text panel-heading" id="panel-title">Table of Contents</div>
            </div>
            <button
              class="glyph-btn"
              style="width: 36px; height: 36px"
              id="close-panel"
              aria-label="Close panel"
            >
              <i data-lucide="x" style="width: 16px; height: 16px"></i>
            </button>
          </div>
          <div class="tool-panel-content ghost-scroll" id="panel-content">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Main Content Scroller -->
        <main class="main-scroll ghost-scroll" id="scroller" tabindex="-1">
          <div class="content-wrapper" id="reader-vars">
            <header class="article-header">
              <nav class="breadcrumbs materialize" id="breadcrumbs"></nav>
              <div class="chapter-meta materialize materialize-delay-1">
                <i data-lucide="book-open" style="width: 14px; height: 14px"></i>
                <span
                  >Chapter <span id="header-ch-num">1</span> of
                  <span id="header-ch-total">5</span></span
                >
              </div>
              <h1
                class="article-title rune-text text-glow materialize materialize-delay-1"
                id="article-title"
              ></h1>
              <p class="article-subtitle materialize materialize-delay-1" id="article-subtitle"></p>

              <div class="author-row materialize materialize-delay-2">
                <div id="author-avatar"></div>
                <div class="flex-col">
                  <span class="font-medium" id="author-name"></span>
                  <span style="color: var(--reader-muted)">
                    From <em id="article-meta-title"></em> &middot;
                    <span id="read-minutes">0</span> min read
                  </span>
                </div>
                <span class="update-badge glass">
                  <i
                    data-lucide="sparkles"
                    style="width: 14px; height: 14px; margin-right: 6px"
                  ></i>
                  Updated <span id="updated-at"></span>
                </span>
              </div>
              <hr class="article-divider" />
            </header>

            <article class="reader-article materialize materialize-delay-3" id="article-body">
              <!-- Content populated by content.js -->
            </article>

            <!-- Navigation between chapters -->
            <div class="chapter-nav" id="chapter-nav"></div>

            <!-- Engagement & Social -->
            <div class="engagement-bar glass" id="engagement">
              <button class="clap-btn" id="clap-btn">
                <span class="clap-icon-wrap" id="clap-icon-wrap">
                  <i data-lucide="heart" style="width: 20px; height: 20px"></i>
                </span>
                <div class="text-left">
                  <div class="text-sm font-medium"><span id="clap-count">128</span> claps</div>
                  <div class="text-xs" style="color: var(--reader-muted)" id="clap-label">
                    Tap to applaud
                  </div>
                </div>
              </button>
              <div class="action-btns flex gap-2">
                <button
                  class="glyph-btn"
                  id="eng-bookmark"
                  data-active="false"
                  aria-label="Bookmark"
                >
                  <i data-lucide="bookmark" style="width: 20px; height: 20px"></i>
                </button>
                <button class="glyph-btn" id="eng-share" aria-label="Share">
                  <i data-lucide="share-2" style="width: 20px; height: 20px"></i>
                </button>
                <button class="glyph-btn" id="eng-comment" aria-label="Comments">
                  <i data-lucide="message-square" style="width: 20px; height: 20px"></i>
                </button>
              </div>
            </div>

            <!-- Author Bio Card -->
            <section class="author-card glass" id="author-card" aria-labelledby="author-heading">
              <div class="author-card-inner">
                <div id="author-card-avatar"></div>
                <div class="author-info">
                  <div class="author-name-row">
                    <h3 id="author-heading" class="rune-text text-lg author-card-name"></h3>
                    <span class="text-xs author-card-handle" id="author-handle"></span>
                  </div>
                  <p class="author-bio" id="author-card-bio"></p>
                </div>
                <button class="follow-btn">Follow</button>
              </div>
            </section>

            <!-- Newsletter -->
            <section class="newsletter-card" id="newsletter">
              <div class="rune-text newsletter-eyebrow">The Chronicler's Letter</div>
              <h3 class="newsletter-title mt-2">Receive a new fragment each Sunday.</h3>
              <p class="newsletter-desc mt-2 text-sm">
                One essay. No tracking. Unsubscribe with a single click.
              </p>
              <form class="newsletter-form" id="newsletter-form">
                <input
                  type="email"
                  required
                  class="newsletter-input"
                  id="newsletter-email"
                  placeholder="you@quietroom.com"
                />
                <button type="submit" class="newsletter-submit" id="newsletter-submit">
                  Subscribe
                </button>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- Scroll Helpers -->
      <button class="back-to-top glass hover-lift hidden" id="back-to-top" aria-label="Back to top">
        <i data-lucide="arrow-up" style="width: 20px; height: 20px"></i>
      </button>

      <button class="focus-exit glass hidden" id="focus-exit">
        <i data-lucide="minimize-2" style="width: 14px; height: 14px"></i>
        Exit Focus
      </button>

      <!-- Selection Toolbar -->
      <div class="selection-toolbar glass-strong hidden" id="selection-toolbar">
        <button class="highlight-btn" data-color="yellow" aria-label="Highlight yellow"></button>
        <button class="highlight-btn" data-color="violet" aria-label="Highlight violet"></button>
        <button class="highlight-btn" data-color="mint" aria-label="Highlight mint"></button>
        <div class="toolbar-divider"></div>
        <button
          class="glyph-btn"
          style="width: 32px; height: 32px"
          id="sel-note"
          aria-label="Add note"
        >
          <i data-lucide="edit-3" style="width: 16px; height: 16px"></i>
        </button>
        <button class="glyph-btn" style="width: 32px; height: 32px" id="sel-copy" aria-label="Copy">
          <i data-lucide="copy" style="width: 16px; height: 16px"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Bottom Toolbar -->
    <nav
      id="mobile-toolbar"
      class="mobile-reader-toolbar fixed bottom-0 inset-x-0 z-40 items-center justify-around px-3 py-2 transition-transform duration-300"
      aria-label="Reader tools"
    >
      <button
        type="button"
        class="mobile-tool-btn group"
        data-tool="toc"
        aria-label="Table of contents"
      >
        <span class="mobile-tool-icon-wrap">
          <i data-lucide="list" class="mobile-tool-icon"></i>
        </span>
        <span class="mobile-tool-label">Contents</span>
      </button>

      <button
        type="button"
        class="mobile-tool-btn group"
        data-tool="type"
        aria-label="Typography settings"
      >
        <span class="mobile-tool-icon-wrap">
          <i data-lucide="type" class="mobile-tool-icon"></i>
        </span>
        <span class="mobile-tool-label">Type</span>
      </button>

      <button
        type="button"
        class="mobile-tool-btn group"
        data-tool="theme"
        aria-label="Color themes"
      >
        <span class="mobile-tool-icon-wrap">
          <i data-lucide="palette" class="mobile-tool-icon"></i>
        </span>
        <span class="mobile-tool-label">Theme</span>
      </button>

      <button
        id="eng-bookmark-mobile"
        type="button"
        class="mobile-tool-btn group"
        data-active="false"
        aria-label="Bookmark tale"
      >
        <span class="mobile-tool-icon-wrap">
          <i data-lucide="bookmark" class="mobile-tool-icon"></i>
        </span>
        <span class="mobile-tool-label">Save</span>
      </button>

      <button
        id="sidebar-focus-mobile"
        type="button"
        class="mobile-tool-btn group"
        data-active="false"
        aria-label="Focus mode"
      >
        <span class="mobile-tool-icon-wrap">
          <i data-lucide="maximize-2" class="mobile-tool-icon"></i>
        </span>
        <span class="mobile-tool-label">Focus</span>
      </button>

      <button id="reader-settings-btn" type="button" class="hidden" aria-hidden="true"></button>
    </nav>

    <!-- Mobile Settings Drawer -->
    <!-- id="reader-settings-panel" used by reader/mobile.js initMobileDrawer() -->
    <div
      id="reader-settings-panel"
      class="fixed inset-0 z-50 hidden lg:hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Reader settings"
    >
      <!-- Backdrop -->
      <div
        class="absolute inset-0"
        style="background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px)"
      ></div>

      <!-- Drawer panel -->
      <div
        class="absolute bottom-0 inset-x-0 rounded-t-[2rem] border-t border-white/[0.08] p-6"
        style="background: rgba(7, 7, 11, 0.98); max-height: 80vh; overflow-y: auto"
      >
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-300">
            Reader Settings
          </h2>
          <!-- id="reader-settings-close" used by reader/mobile.js initMobileDrawer() -->
          <button
            id="reader-settings-close"
            type="button"
            class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/[0.06] transition-all"
            aria-label="Close settings"
          >
            <i data-lucide="x" style="width: 16px; height: 16px"></i>
          </button>
        </div>

        <!-- Typography quick controls -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500"
              >Font Size</span
            >
            <div class="flex items-center gap-3">
              <button
                id="fs-minus"
                type="button"
                class="glyph-btn"
                style="width: 32px; height: 32px"
                aria-label="Decrease font size"
              >
                <i data-lucide="minus" style="width: 14px; height: 14px"></i>
              </button>
              <span id="size-val" class="text-sm font-bold text-white w-12 text-center">18px</span>
              <button
                id="fs-plus"
                type="button"
                class="glyph-btn"
                style="width: 32px; height: 32px"
                aria-label="Increase font size"
              >
                <i data-lucide="plus" style="width: 14px; height: 14px"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast system -->
    <div
      id="reader-toast-container"
      class="fixed top-20 right-6 z-[200] flex flex-col gap-3 pointer-events-none"
    ></div>
  </body>
</html>

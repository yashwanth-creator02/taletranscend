<!-- src/views/reader.html -->
<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- @include: partials/_fade-in-guard.html -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Reader | TaleTranscend</title>

    <script type="module" src="../features/reader/reader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="antialiased">
    <div id="app" class="app-container" data-theme="noir">
      <div class="atmosphere" id="atmosphere"></div>
      <div class="particles" id="particles"></div>

      <!-- Top Reading Progress -->
      <div class="top-progress">
        <div class="top-progress-bar progress-bar" id="progress-bar" style="width: 0%"></div>
      </div>

      <!-- Header / Top Bar -->
      <header class="top-bar glass-strong" id="top-bar">
        <div
          class="transition-all duration-200 hover:scale-105 hover:shadow-xl"
          id="back-btn"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.45), rgba(168, 85, 247, 0.45));
            box-shadow: 0 0 24px -6px rgba(139, 124, 246, 0.6);
            cursor: pointer;
          "
        >
          <i data-lucide="arrow-left" style="width: 16px; height: 16px; color: #fff"></i>
        </div>

        <!-- Desktop Navigation Meta -->
        <div
          class="md:flex"
          id="top-bar-center"
          style="min-width: 0; flex: 1; align-items: center; justify-content: center; gap: 0.5rem"
        >
          <i
            data-lucide="book-open"
            style="width: 14px; height: 14px; color: rgba(196, 181, 253, 0.7)"
          ></i>
          <span
            style="
              font-size: 10px;
              text-transform: uppercase;
              letter-spacing: 0.22em;
              color: rgba(255, 255, 255, 0.4);
            "
          >
            Ch. <span id="top-bar-ch-num">1</span>/<span id="top-bar-ch-total">5</span>
          </span>
          <span style="height: 12px; width: 1px; background: rgba(255, 255, 255, 0.15)"></span>
          <span
            class="rune-text truncate"
            style="font-size: 13px; color: rgba(255, 255, 255, 0.85)"
            id="top-bar-ch-title"
          >
            Loading...
          </span>
        </div>

        <!-- Right Side Stats -->
        <div
          class="flex items-center gap-5"
          style="flex-shrink: 0; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6)"
        >
          <span id="top-bar-read-time" class="hidden" style="align-items: center; gap: 0.375rem">
            <i data-lucide="clock" style="width: 14px; height: 14px"></i>
            <span id="top-bar-min">0</span> min
          </span>
          <span class="tabular-nums" id="top-bar-pct">0%</span>
        </div>
      </header>

      <div class="main-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-strong" id="sidebar">
          <button class="glyph-btn" id="collapse-btn" aria-label="Collapse sidebar">
            <i data-lucide="chevron-left" style="width: 16px; height: 16px" id="collapse-icon"></i>
          </button>
          <div
            style="margin: 0.5rem 0; height: 1px; width: 32px; background: rgba(255, 255, 255, 0.1)"
          ></div>

          <div class="sidebar-tools" id="sidebar-tools">
            <!-- Populated by JS -->
          </div>

          <div class="sidebar-bottom">
            <div
              style="
                margin: 0.25rem 0;
                height: 1px;
                width: 32px;
                background: rgba(255, 255, 255, 0.1);
              "
            ></div>
            <button
              class="glyph-btn"
              id="sidebar-bookmark"
              data-active="false"
              aria-label="Bookmark"
            >
              <i data-lucide="bookmark" style="width: 20px; height: 20px"></i>
            </button>
            <button
              class="glyph-btn"
              id="sidebar-focus"
              data-active="false"
              aria-label="Focus mode"
            >
              <i data-lucide="maximize-2" style="width: 20px; height: 20px"></i>
            </button>
          </div>
        </aside>

        <!-- Tool Panel -->
        <div class="tool-panel glass-strong" id="tool-panel">
          <div class="tool-panel-header">
            <div>
              <div
                style="
                  font-size: 10px;
                  text-transform: uppercase;
                  letter-spacing: 0.22em;
                  color: rgba(255, 255, 255, 0.4);
                "
              >
                Panel
              </div>
              <div
                class="rune-text"
                style="font-size: 15px; color: rgba(255, 255, 255, 0.9)"
                id="panel-title"
              >
                Table of Contents
              </div>
            </div>
            <button
              class="glyph-btn"
              style="width: 36px; height: 36px"
              id="close-panel"
              aria-label="Close panel"
            >
              <i data-lucide="x" style="width: 16px; height: 16px"></i>
            </button>
          </div>
          <div class="tool-panel-content ghost-scroll" id="panel-content">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Main Content Scroller -->
        <main class="main-scroll ghost-scroll" id="scroller">
          <div class="content-wrapper" id="reader-vars">
            <header class="article-header">
              <nav class="breadcrumbs materialize" id="breadcrumbs"></nav>
              <div class="chapter-meta materialize materialize-delay-1">
                <i data-lucide="book-open" style="width: 14px; height: 14px"></i>
                <span
                  >Chapter <span id="header-ch-num">1</span> of
                  <span id="header-ch-total">5</span></span
                >
              </div>
              <h1
                class="article-title rune-text text-glow materialize materialize-delay-1"
                id="article-title"
              ></h1>
              <p class="article-subtitle materialize materialize-delay-1" id="article-subtitle"></p>

              <div class="author-row materialize materialize-delay-2">
                <div id="author-avatar"></div>
                <div class="flex-col">
                  <span class="font-medium" id="author-name"></span>
                  <span style="color: var(--reader-muted)">
                    From <em id="article-meta-title"></em> &middot;
                    <span id="read-minutes">0</span> min read
                  </span>
                </div>
                <span class="update-badge glass">
                  <i
                    data-lucide="sparkles"
                    style="width: 14px; height: 14px; margin-right: 6px"
                  ></i>
                  Updated <span id="updated-at"></span>
                </span>
              </div>
              <hr
                style="
                  margin-top: 2.5rem;
                  border: none;
                  border-top: 1px solid rgba(255, 255, 255, 0.1);
                "
              />
            </header>

            <article class="reader-article materialize materialize-delay-3" id="article-body">
              <!-- Content populated by content.js -->
            </article>

            <!-- Navigation between chapters -->
            <div class="chapter-nav" id="chapter-nav"></div>

            <!-- Engagement & Social -->
            <div class="engagement-bar glass" id="engagement">
              <button class="clap-btn" id="clap-btn">
                <span class="clap-icon-wrap" id="clap-icon-wrap">
                  <i data-lucide="heart" style="width: 20px; height: 20px"></i>
                </span>
                <div class="text-left">
                  <div class="text-sm font-medium"><span id="clap-count">128</span> claps</div>
                  <div class="text-xs" style="color: var(--reader-muted)" id="clap-label">
                    Tap to applaud
                  </div>
                </div>
              </button>
              <div class="action-btns flex gap-2">
                <button
                  class="glyph-btn"
                  id="eng-bookmark"
                  data-active="false"
                  aria-label="Bookmark"
                >
                  <i data-lucide="bookmark" style="width: 20px; height: 20px"></i>
                </button>
                <button class="glyph-btn" id="eng-share" aria-label="Share">
                  <i data-lucide="share-2" style="width: 20px; height: 20px"></i>
                </button>
                <button class="glyph-btn" id="eng-comment" aria-label="Comments">
                  <i data-lucide="message-square" style="width: 20px; height: 20px"></i>
                </button>
              </div>
            </div>

            <!-- Author Bio Card -->
            <section class="author-card glass" id="author-card" aria-labelledby="author-heading">
              <div class="author-card-inner">
                <div id="author-card-avatar"></div>
                <div class="author-info">
                  <div class="author-name-row">
                    <h3
                      id="author-heading"
                      class="rune-text text-lg"
                      style="color: rgba(255, 255, 255, 0.95)"
                    ></h3>
                    <span
                      class="text-xs"
                      style="color: rgba(255, 255, 255, 0.4)"
                      id="author-handle"
                    ></span>
                  </div>
                  <p class="author-bio" id="author-card-bio"></p>
                </div>
                <button class="follow-btn">Follow</button>
              </div>
            </section>

            <!-- Newsletter -->
            <section class="newsletter-card" id="newsletter">
              <div
                class="rune-text"
                style="
                  font-size: 11px;
                  text-transform: uppercase;
                  letter-spacing: 0.22em;
                  color: #ddd6fe;
                "
              >
                The Chronicler's Letter
              </div>
              <h3
                class="mt-2"
                style="
                  font-family: var(--font-serif);
                  font-size: 1.5rem;
                  color: rgba(255, 255, 255, 0.95);
                "
              >
                Receive a new fragment each Sunday.
              </h3>
              <p class="mt-2 text-sm" style="color: rgba(255, 255, 255, 0.55)">
                One essay. No tracking. Unsubscribe with a single click.
              </p>
              <form class="newsletter-form" id="newsletter-form">
                <input
                  type="email"
                  required
                  class="newsletter-input"
                  id="newsletter-email"
                  placeholder="you@quietroom.com"
                />
                <button type="submit" class="newsletter-submit" id="newsletter-submit">
                  Subscribe
                </button>
              </form>
            </section>
          </div>
        </main>
      </div>

      <!-- Scroll Helpers -->
      <button class="back-to-top glass hover-lift hidden" id="back-to-top" aria-label="Back to top">
        <i data-lucide="arrow-up" style="width: 20px; height: 20px"></i>
      </button>

      <button class="focus-exit glass hidden" id="focus-exit">
        <i data-lucide="minimize-2" style="width: 14px; height: 14px"></i>
        Exit Focus
      </button>

      <!-- Selection Toolbar -->
      <div class="selection-toolbar glass-strong hidden" id="selection-toolbar">
        <button
          class="highlight-btn"
          style="background: rgba(250, 204, 21, 0.6)"
          data-color="yellow"
          aria-label="Highlight yellow"
        ></button>
        <button
          class="highlight-btn"
          style="background: rgba(168, 85, 247, 0.6)"
          data-color="violet"
          aria-label="Highlight violet"
        ></button>
        <button
          class="highlight-btn"
          style="background: rgba(52, 211, 153, 0.6)"
          data-color="mint"
          aria-label="Highlight mint"
        ></button>
        <div class="toolbar-divider"></div>
        <button
          class="glyph-btn"
          style="width: 32px; height: 32px"
          id="sel-note"
          aria-label="Add note"
        >
          <i data-lucide="edit-3" style="width: 16px; height: 16px"></i>
        </button>
        <button class="glyph-btn" style="width: 32px; height: 32px" id="sel-copy" aria-label="Copy">
          <i data-lucide="copy" style="width: 16px; height: 16px"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Bottom Toolbar -->
    <!-- id="mobile-toolbar" used by reader/mobile.js initToolbarAutoHide() -->
    <div
      id="mobile-toolbar"
      class="hidden fixed bottom-0 inset-x-0 z-40 flex lg:hidden items-center justify-around px-4 py-3 border-t border-white/[0.06] transition-transform duration-300"
      style="background: rgba(3, 3, 5, 0.92); backdrop-filter: blur(24px)"
    >
      <button
        id="reader-settings-btn"
        type="button"
        class="flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition-colors"
        aria-label="Open reader settings"
      >
        <i data-lucide="settings" style="width: 20px; height: 20px"></i>
        <span class="text-[8px] font-bold uppercase tracking-widest">Settings</span>
      </button>
      <button
        type="button"
        class="flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition-colors"
        data-tool="toc"
        aria-label="Table of contents"
      >
        <i data-lucide="list" style="width: 20px; height: 20px"></i>
        <span class="text-[8px] font-bold uppercase tracking-widest">Contents</span>
      </button>
      <button
        type="button"
        class="flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition-colors"
        data-tool="theme"
        aria-label="Change theme"
      >
        <i data-lucide="palette" style="width: 20px; height: 20px"></i>
        <span class="text-[8px] font-bold uppercase tracking-widest">Theme</span>
      </button>
      <button
        id="eng-bookmark-mobile"
        type="button"
        class="flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400 transition-colors"
        aria-label="Bookmark"
      >
        <i data-lucide="bookmark" style="width: 20px; height: 20px"></i>
        <span class="text-[8px] font-bold uppercase tracking-widest">Save</span>
      </button>
    </div>

    <!-- Mobile Settings Drawer -->
    <!-- id="reader-settings-panel" used by reader/mobile.js initMobileDrawer() -->
    <div
      id="reader-settings-panel"
      class="fixed inset-0 z-50 hidden lg:hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Reader settings"
    >
      <!-- Backdrop -->
      <div
        class="absolute inset-0"
        style="background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px)"
      ></div>

      <!-- Drawer panel -->
      <div
        class="absolute bottom-0 inset-x-0 rounded-t-[2rem] border-t border-white/[0.08] p-6"
        style="background: rgba(7, 7, 11, 0.98); max-height: 80vh; overflow-y: auto"
      >
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-300">
            Reader Settings
          </h2>
          <!-- id="reader-settings-close" used by reader/mobile.js initMobileDrawer() -->
          <button
            id="reader-settings-close"
            type="button"
            class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/[0.06] transition-all"
            aria-label="Close settings"
          >
            <i data-lucide="x" style="width: 16px; height: 16px"></i>
          </button>
        </div>

        <!-- Typography quick controls -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500"
              >Font Size</span
            >
            <div class="flex items-center gap-3">
              <button
                id="fs-minus"
                type="button"
                class="glyph-btn"
                style="width: 32px; height: 32px"
                aria-label="Decrease font size"
              >
                <i data-lucide="minus" style="width: 14px; height: 14px"></i>
              </button>
              <span id="size-val" class="text-sm font-bold text-white w-12 text-center">18px</span>
              <button
                id="fs-plus"
                type="button"
                class="glyph-btn"
                style="width: 32px; height: 32px"
                aria-label="Increase font size"
              >
                <i data-lucide="plus" style="width: 14px; height: 14px"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaleTranscend | Profile</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../pages/profile/profile.js"></script>
</head>

<body class="bg-[#050505] text-slate-300 antialiased selection:bg-indigo-500/30 mesh-gradient min-h-screen">
  <div id="toast-container" class="fixed top-6 right-6 z-[200] flex flex-col gap-3 pointer-events-none"></div>

  <!-- Nav injected by profile.js via initNav() -->

  <main class="max-w-7xl mx-auto flex flex-col lg:flex-row">
    <aside class="w-full lg:w-80 lg:sticky lg:top-20 lg:h-[calc(100vh-80px)] p-8 border-r border-white/5">
      <div class="flex flex-col items-center text-center">
        <div class="relative group">
          <div
            class="w-36 h-36 bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 rounded-[2.5rem] p-1 rotate-3 group-hover:rotate-6 transition-all duration-500">
            <div class="w-full h-full bg-[#050505] rounded-[2.3rem] flex items-center justify-center overflow-hidden">
              <i data-lucide="user" class="w-16 h-16 text-slate-700"></i>
            </div>
          </div>
          <div class="absolute bottom-1 right-3 w-6 h-6 bg-green-500 border-4 border-[#050505] rounded-full shadow-lg">
          </div>
        </div>

        <div class="mt-8">
          <span
            class="px-3 py-1 bg-indigo-500/10 text-indigo-400 text-[10px] font-black uppercase tracking-[0.2em] rounded-full">Explorer</span>
          <h1 id="desktop-display-name" class="mt-4 text-3xl font-bold text-white tracking-tight">User_Name</h1>
          <p id="desktop-display-bio" class="mt-3 text-slate-500 text-sm leading-relaxed">
            Whispering stories to the stars and finding magic in the mundane.
          </p>
        </div>

        <button id="btn-edit-desktop"
          class="mt-8 w-full glass-card hover:bg-white/10 text-white py-3.5 rounded-2xl transition-all flex items-center justify-center gap-2 group border-white/10">
          <i data-lucide="settings" class="w-4 h-4 text-slate-500 group-hover:rotate-90 transition-transform"></i>
          <span class="font-semibold text-sm">Profile Settings</span>
        </button>
      </div>

      <div class="mt-12 hidden lg:block">
        <h2 class="text-[10px] font-bold tracking-widest text-slate-500 uppercase mb-6 flex items-center gap-2">
          Achievements <span class="h-px flex-1 bg-white/5"></span>
        </h2>
        <div class="space-y-3">
          <div
            class="flex items-center gap-4 p-4 glass-card rounded-2xl group hover:border-indigo-500/30 transition-all cursor-default">
            <div
              class="w-10 h-10 bg-amber-500/10 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform">
              <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
            </div>
            <div>
              <p class="text-sm font-bold text-white">First Legend</p>
              <p class="text-[11px] text-slate-500">Contributed 1st story</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="flex-1 p-6 md:p-12">
      <!-- Continue Reading -->
      <section class="mb-16">
        <div class="flex justify-between items-end mb-8">
          <div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Continue Reading</h2>
            <p class="text-slate-500 text-sm mt-1">Pick up right where you left the magic.</p>
          </div>
          <a href="library.html"
            class="text-xs font-bold text-indigo-400 hover:text-indigo-300 uppercase tracking-widest transition-colors">
            View Library
          </a>
        </div>
        <!-- Cards injected by renderContinueReading() -->
        <div id="continue-reading-list" class="flex gap-6 overflow-x-auto pb-6 no-scrollbar snap-x">
          <div class="text-sm text-slate-600 italic py-4">Loading your reading history...</div>
        </div>
      </section>

      <!-- Contributions -->
      <section>
        <div class="flex items-center gap-3 mb-8">
          <h2 class="text-3xl font-bold text-white tracking-tight">Your Contributions</h2>
        </div>
        <!-- Published tale cards injected before new story button -->
        <div id="contributions-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          <button id="btn-new-story"
            class="group p-8 glass-card border-dashed border-2 border-white/10 hover:border-indigo-500/50 rounded-[2rem] flex flex-col items-center justify-center transition-all min-h-[240px]">
            <div
              class="w-16 h-16 bg-indigo-500/10 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-indigo-600 group-hover:shadow-[0_0_30px_rgba(79,70,229,0.4)] transition-all">
              <i data-lucide="plus" class="text-indigo-400 group-hover:text-white w-8 h-8 transition-colors"></i>
            </div>
            <span class="text-white font-bold text-lg">Start a New Tale</span>
            <span class="text-[10px] text-slate-500 mt-2 uppercase tracking-[0.2em]">Become a Creator</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div id="edit-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center p-6 bg-black/80 backdrop-blur-md">
    <div class="bg-zinc-900 border border-white/10 w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl">
      <div class="p-8 border-b border-white/5 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-white">Edit Profile</h2>
        <button id="btn-close-modal"
          class="text-slate-400 hover:text-white p-2 hover:bg-white/5 rounded-full transition-all">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="profile-form" class="p-8 space-y-6">
        <div class="space-y-2">
          <label class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest ml-1">Display Name</label>
          <input type="text" id="input-name"
            class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/50 transition-all"
            placeholder="Enter name..." />
        </div>
        <div class="space-y-2">
          <label class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest ml-1">Short Bio</label>
          <textarea id="input-bio" rows="3"
            class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/50 transition-all resize-none"
            placeholder="Tell us your story..."></textarea>
        </div>
        <div class="flex gap-4 pt-4">
          <button type="button" id="btn-cancel-modal"
            class="flex-1 py-4 bg-white/5 text-white rounded-2xl font-bold hover:bg-white/10 transition-all">
            Cancel
          </button>
          <button type="submit"
            class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-500 transition-all">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>

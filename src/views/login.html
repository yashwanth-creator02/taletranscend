<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to TaleTranscend - Preserve your legends and sync your journey."
    />
    <title>Sign In | TaleTranscend</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700;800&family=Merriweather:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload Lucide Icons -->
    <link rel="preload" href="https://unpkg.com/lucide@latest/dist/umd/lucide.js" as="script" />

    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/pages/login.css" />

    <!-- Scripts -->
    <script type="module" src="../features/login/login.js" defer></script>
  </head>

  <body
    class="antialiased selection:bg-indigo-500/30 page-fade-in flex items-center justify-center min-h-screen overflow-hidden"
  >
    <!-- Atmosphere -->
    <div class="atmosphere-base"></div>
    <div class="particle-field"></div>
    <div class="floating-orbs"></div>

    <!-- Toast Container -->
    <div
      id="toast-container"
      class="fixed top-6 right-6 z-200 flex flex-col gap-3 pointer-events-none max-w-sm w-full"
      aria-live="polite"
    ></div>

    <!-- Main Content -->
    <main class="relative z-10 w-full max-w-lg px-6">
      <div
        class="login-card p-10 md:p-14 relative overflow-hidden group"
        role="region"
        aria-labelledby="login-heading"
      >
        <!-- Decorative Elements -->
        <div
          class="absolute top-0 left-0 w-full h-1 bg-linear-to-r from-transparent via-indigo-500/30 to-transparent"
        ></div>
        <div
          class="absolute -top-28 -right-28 w-72 h-72 bg-indigo-500/5 blur-3xl rounded-full group-hover:scale-110 transition-transform duration-1000"
        ></div>
        <div
          class="absolute -bottom-28 -left-28 w-72 h-72 bg-purple-500/5 blur-3xl rounded-full group-hover:scale-110 transition-transform duration-1000"
        ></div>

        <!-- Content -->
        <div class="relative z-10 flex flex-col items-center text-center">
          <!-- Logo -->
          <div
            class="w-20 h-20 bg-zinc-900/20 border border-white/10 rounded-3xl flex items-center justify-center mb-8 shadow-2xl shadow-indigo-500/10 backdrop-blur-lg"
          >
            <i data-lucide="sparkles" class="text-indigo-400 w-10 h-10 animate-pulse-slow"></i>
          </div>

          <!-- Heading -->
          <h1
            id="login-heading"
            class="text-4xl md:text-5xl font-cinzel font-bold text-white tracking-wide mb-4 bg-clip-text text-transparent bg-linear-to-br from-white via-indigo-300 to-purple-200"
          >
            Cross the Threshold
          </h1>

          <!-- Divider -->
          <div class="rune-divider mb-8">
            <span class="rune-symbol">✦</span>
          </div>

          <!-- Subheading -->
          <p class="text-slate-400 text-sm md:text-base leading-relaxed mb-12 max-w-xs">
            Enter the archive to preserve your legends and sync your journey across the neural
            weave.
          </p>

          <!-- Login Actions -->
          <div class="w-full space-y-4">
            <!-- Google Login Button -->
            <button
              id="btn-google-login"
              class="w-full py-5 rounded-2xl bg-white/5 border border-white/10 text-white text-sm font-black uppercase tracking-[0.2em] flex items-center justify-center gap-4 hover:bg-white/10 hover:border-white/20 transition-all active:scale-[0.98] shadow-xl shadow-white/5 backdrop-blur-sm"
              aria-label="Sign in with Google"
            >
              <span class="google-icon">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="currentColor"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="currentColor"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  />
                  <path
                    fill="currentColor"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  />
                </svg>
              </span>
              <span>Sign In with Google</span>
              <span id="btn-google-login-loading" class="hidden">
                <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24">
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  ></path>
                </svg>
              </span>
            </button>

            <!-- Guest Login Button -->
            <button
              id="btn-guest-login"
              class="w-full py-5 rounded-2xl bg-white/5 border border-white/10 text-slate-300 text-sm font-black uppercase tracking-[0.2em] flex items-center justify-center gap-4 hover:bg-white/10 hover:text-white hover:border-white/20 transition-all active:scale-[0.98] backdrop-blur-sm"
              aria-label="Enter as Guest"
            >
              <i data-lucide="user" class="w-5 h-5"></i>
              <span>Enter as Guest</span>
              <span id="btn-guest-login-loading" class="hidden">
                <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24">
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  ></path>
                </svg>
              </span>
            </button>
          </div>

          <!-- Footer -->
          <div class="mt-16 pt-8 border-t border-white/5 w-full">
            <a
              href="index.html"
              class="inline-flex items-center gap-2 text-[10px] text-slate-600 font-bold uppercase tracking-[0.2em] hover:text-indigo-400 transition-colors group"
              aria-label="Return to the Archives"
            >
              <i
                data-lucide="arrow-left"
                class="w-3 h-3 group-hover:-translate-x-1 transition-transform"
              ></i>
              Return to the Archives
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

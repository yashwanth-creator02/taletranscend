<!-- src/views/library.html -->
<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <style>
    html {
      opacity: 0;
      transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1)
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library | TaleTranscend</title>

  <script type="module" src="../pages/library/library.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>

<body class="text-slate-300 antialiased selection:bg-indigo-500/30 page-fade-in flex flex-col h-screen overflow-hidden">
  <!-- Global Atmosphere -->
  <div class="atmosphere-base"></div>
  <div class="particle-field"></div>

  <!-- Main Layout -->
  <div class="library-layout flex-1 overflow-hidden">
    <!-- ══════════════════════════════════════════
         SIDEBAR (Sticky)
         ══════════════════════════════════════════ -->
    <aside id="sidebar" class="h-full overflow-hidden">
      <div class="sidebar-inner scroll-container">
        <!-- Toggle button -->
        <div class="flex items-center gap-3 px-2 pb-4 border-b border-white/5 mb-4">
          <button id="toggle-sidebar" type="button"
            class="shrink-0 w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white/5 text-slate-500 hover:text-white transition-colors"
            aria-label="Toggle sidebar">
            <i data-lucide="panel-left-close" class="w-4 h-4"></i>
          </button>
          <span
            class="sidebar-label text-[10px] font-black uppercase tracking-widest text-white transition-all">Navigation</span>
        </div>

        <!-- Browse By -->
        <div class="mb-8">
          <p class="sidebar-section-heading px-3 mb-3 text-[9px] font-black uppercase tracking-[0.25em] text-slate-700">
            Browse
          </p>
          <div class="space-y-1">
            <button data-filter="all" class="sidebar-filter sidebar-filter--active" aria-label="Browse all eras">
              <i data-lucide="layout-grid"></i>
              <span class="sidebar-label">All Eras</span>
            </button>
            <button data-filter="recent" class="sidebar-filter" aria-label="Browse recent myths">
              <i data-lucide="clock"></i>
              <span class="sidebar-label">Recent Myths</span>
            </button>
            <button data-filter="finished" class="sidebar-filter" aria-label="Browse completed tales">
              <i data-lucide="check-circle"></i>
              <span class="sidebar-label">Completed</span>
            </button>
          </div>
        </div>

        <!-- Personal -->
        <div class="mb-8">
          <p class="sidebar-section-heading px-3 mb-3 text-[9px] font-black uppercase tracking-[0.25em] text-slate-700">
            Personal
          </p>
          <div class="space-y-1">
            <button data-filter="bookmarked" class="sidebar-filter" aria-label="View your bookmarks">
              <i data-lucide="bookmark"></i>
              <span class="sidebar-label">Bookmarks</span>
            </button>
            <button data-filter="my-tales" class="sidebar-filter" aria-label="View your own tales">
              <i data-lucide="feather"></i>
              <span class="sidebar-label">My Tales</span>
            </button>
          </div>
        </div>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Submit Tale CTA -->
        <div class="mb-4">
          <button id="btn-submit-tale" type="button"
            class="w-full h-12 flex items-center justify-center gap-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-black uppercase tracking-widest transition-all shadow-xl shadow-indigo-600/20 active:scale-95">
            <i data-lucide="plus" class="w-4 h-4 shrink-0"></i>
            <span class="sidebar-label">Submit Tale</span>
          </button>
        </div>

        <!-- Auth user -->
        <div class="pt-4 border-t border-white/5">
          <div class="flex items-center gap-3 px-2 py-2">
            <div class="relative shrink-0">
              <img id="sidebar-user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=guest" alt="Avatar"
                class="w-9 h-9 rounded-xl bg-zinc-800 border border-white/8 object-cover" width="36" height="36" />
              <div
                class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-[#030305] rounded-full">
              </div>
            </div>
            <div class="sidebar-user-text min-w-0 transition-all">
              <p id="sidebar-user-name" class="text-xs font-bold text-white truncate">—</p>
              <p id="sidebar-user-sub" class="text-[9px] text-indigo-400 font-black uppercase tracking-tighter">
                Member
              </p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ══════════════════════════════════════════
         MAIN CONTENT
         ══════════════════════════════════════════ -->
    <main id="library-main" class="scroll-container">
      <div class="max-w-375 mx-auto">
        <!-- Page header -->
        <header class="flex flex-col lg:flex-row lg:items-end justify-between gap-10 mb-16">
          <div class="space-y-4">
            <div class="flex items-center gap-4">
              <span class="h-px w-12 bg-indigo-500/60"></span>
              <p class="text-indigo-400 text-[10px] font-black uppercase tracking-[0.6em]">
                Neural Fragment Repository
              </p>
            </div>
            <h1 class="text-5xl md:text-6xl lg:text-7xl font-black text-white tracking-tighter uppercase leading-none">
              The
              <span class="text-transparent bg-clip-text bg-linear-to-r from-indigo-400 to-violet-400">Archives</span>
            </h1>
          </div>

          <!-- Search -->
          <div class="relative group w-full lg:w-115">
            <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
              <i data-lucide="search"
                class="w-4 h-4 text-slate-600 group-focus-within:text-indigo-400 transition-colors"></i>
            </div>
            <input type="text" id="search-input" placeholder="Search the neural weave…" autocomplete="off"
              class="w-full h-14 rounded-2xl bg-white/5 border border-white/10 px-14 text-sm text-white placeholder:text-slate-700 transition-all focus:bg-white/10 focus:border-indigo-500/30" />
            <div class="absolute inset-y-0 right-5 flex items-center pointer-events-none">
              <kbd
                class="px-2.5 py-1.5 rounded-lg bg-black/50 border border-white/8 text-[10px] font-black text-slate-600">
                ⌘ K
              </kbd>
            </div>
          </div>
        </header>

        <!-- Era filter bar -->
        <div id="era-filter-bar" class="flex gap-3 overflow-x-auto no-scrollbar pb-2 mb-8" role="group"
          aria-label="Filter by era">
          <!-- Chips built by ui.js buildEraChips() after tales load -->
          <button data-era="all" class="era-chip era-chip--active">All Neural Links</button>
        </div>

        <!-- Secondary Filters -->
        <div class="flex flex-col md:flex-row gap-6 mb-12">
          <!-- Tone -->
          <div class="flex-1">
            <p class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-700 mb-4 ml-1">
              Archive Tone
            </p>
            <div id="tone-filter-bar" class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
              <button data-tone="all" class="filter-pill filter-pill--active" aria-label="Show all tones">
                All Echoes
              </button>
              <button data-tone="Mythic" class="filter-pill" aria-label="Filter by Mythic tone">
                Mythic
              </button>
              <button data-tone="Dark" class="filter-pill" aria-label="Filter by Dark tone">
                Dark
              </button>
              <button data-tone="Whimsical" class="filter-pill" aria-label="Filter by Whimsical tone">
                Whimsical
              </button>
              <button data-tone="Melancholic" class="filter-pill" aria-label="Filter by Melancholic tone">
                Melancholic
              </button>
            </div>
          </div>

          <!-- Length -->
          <div class="w-full md:w-70">
            <p class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-700 mb-4 ml-1">
              Echo Depth
            </p>
            <div id="length-filter-bar" class="flex gap-2">
              <button data-length="all" class="filter-pill flex-1 filter-pill--active" aria-label="Show all lengths">
                All
              </button>
              <button data-length="short" class="filter-pill flex-1" aria-label="Filter by Short stories">
                Short
              </button>
              <button data-length="medium" class="filter-pill flex-1" aria-label="Filter by Mid-length stories">
                Mid
              </button>
              <button data-length="long" class="filter-pill flex-1" aria-label="Filter by Epic-length stories">
                Epic
              </button>
            </div>
          </div>
        </div>

        <!-- Cards grid -->
        <section id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-8 md:gap-10"
          aria-live="polite" aria-label="Tale cards">
          <!-- Populated by renderCardsGrid() via library.js -->
        </section>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="glass-card-strong p-10 w-full max-w-sm text-center shadow-2xl">
      <div class="w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-8">
        <i data-lucide="check-circle" class="w-8 h-8 text-emerald-400"></i>
      </div>
      <h3 id="confirm-title" class="text-xl font-bold text-white uppercase tracking-tight mb-4">
        Seal this <span class="text-emerald-400">Chronicle?</span>
      </h3>
      <p class="text-xs text-slate-500 leading-relaxed mb-10 italic">
        Once a tale is marked as finished, its path is permanently recorded in the Eternal
        Archives.
      </p>
      <div class="flex flex-col gap-4">
        <button id="confirm-accept"
          class="w-full h-14 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] transition-all shadow-xl shadow-emerald-600/20">
          Confirm Completion
        </button>
        <button id="confirm-cancel"
          class="w-full py-4 text-[10px] font-black uppercase tracking-[0.2em] text-slate-600 hover:text-white transition-colors">
          Return to Weave
        </button>
      </div>
    </div>
  </div>

  <div id="copy-link-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="copy-link-title">
    <div class="glass-card-strong p-10 w-full max-w-sm shadow-2xl">
      <div class="flex items-center gap-4 mb-8">
        <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 flex items-center justify-center shrink-0">
          <i data-lucide="share-2" class="w-6 h-6 text-indigo-400"></i>
        </div>
        <div>
          <h3 id="copy-link-title" class="text-sm font-black uppercase tracking-[0.2em] text-white">
            Share Fragment
          </h3>
          <p class="text-[10px] text-slate-600 uppercase tracking-widest mt-1">
            Generate neural access link
          </p>
        </div>
      </div>
      <div class="relative mb-8">
        <input id="copy-link-input" readonly
          class="w-full h-12 bg-black/40 border border-white/10 rounded-xl px-4 text-xs font-mono text-indigo-300 focus:outline-none" />
      </div>
      <div class="flex items-center justify-end gap-6">
        <button id="copy-link-close"
          class="text-[10px] font-black uppercase tracking-widest text-slate-600 hover:text-white transition-colors">
          Dismiss
        </button>
        <button id="copy-link-confirm"
          class="h-12 px-8 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-xl shadow-indigo-600/20">
          Copy Link
        </button>
      </div>
    </div>
  </div>
</body>

</html>

<!-- src/views/library.html -->
<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library | TaleTranscend</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../pages/library/library.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      --sidebar-width: 17rem;
      --sidebar-width-collapsed: 4.5rem;
      --sidebar-transition: 280ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      overflow-x: hidden;
      min-height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #030305;
      color: #cbd5e1;
      min-height: 100vh;
    }

    /* ── Scrollbars ──────────────────────────────── */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.2) transparent;
    }

    *::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    *::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.2);
      border-radius: 4px;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* ── Skeleton ────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.03) 25%,
          rgba(255, 255, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton {
        animation: none;
        background: rgba(255, 255, 255, 0.04);
      }
    }

    /* ── Atmosphere ──────────────────────────────── */
    .atmosphere-base {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse 70% 40% at 90% 100%, rgba(139, 92, 246, 0.05) 0%, transparent 40%),
        #030305;
    }

    /* ── Layout ──────────────────────────────────── */
    .library-layout {
      display: flex;
      min-height: calc(100vh - var(--nav-height, 64px));
    }

    /* ── Sidebar ─────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      transition: width var(--sidebar-transition);
      position: sticky;
      top: var(--nav-height, 64px);
      height: calc(100vh - var(--nav-height, 64px));
      overflow: hidden;
    }

    #sidebar.sidebar--collapsed {
      width: var(--sidebar-width-collapsed);
    }

    .sidebar-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: rgba(255, 255, 255, 0.02);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 8px;
      overflow: hidden;
    }

    /* Labels / text that hide on collapse */
    #sidebar.sidebar--collapsed .sidebar-label,
    #sidebar.sidebar--collapsed .sidebar-section-heading,
    #sidebar.sidebar--collapsed .sidebar-user-text {
      opacity: 0;
      pointer-events: none;
      width: 0;
      overflow: hidden;
    }

    /* ── Sidebar filter buttons ──────────────────── */
    .sidebar-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: none;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: all 150ms ease;
    }

    .sidebar-filter:hover {
      color: white;
      background: rgba(255, 255, 255, 0.04);
    }

    .sidebar-filter svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .sidebar-filter--active {
      color: #818cf8;
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .sidebar-filter--active:hover {
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
    }

    /* ── Era chips ───────────────────────────────── */
    .era-chip {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all 180ms ease;
    }

    .era-chip--active {
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
    }

    .era-chip--inactive {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.07);
      color: #475569;
    }

    .era-chip--inactive:hover {
      color: white;
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    /* ── Main content ────────────────────────────── */
    #library-main {
      flex: 1;
      min-width: 0;
      padding: 32px 24px 80px;
      overflow-y: auto;
    }

    @media (min-width: 1024px) {
      #library-main {
        padding: 40px 48px 80px;
      }
    }

    /* ── Search input ────────────────────────────── */
    #search-input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    #search-input:focus {
      outline: none;
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    /* ── Modals ──────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    /* ── Reduce motion ───────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #sidebar {
        transition: none;
      }
    }
  </style>
</head>

<body class="antialiased selection:bg-indigo-500/30">

  <div class="atmosphere-base"></div>

  <!-- Nav injected by library.js via initNav() -->

  <div class="library-layout">

    <!-- ══════════════════════════════════════════
         SIDEBAR
         ══════════════════════════════════════════ -->
    <aside id="sidebar" class="hidden md:block">
      <div class="sidebar-inner">

        <!-- Toggle button -->
        <div class="flex items-center gap-3 px-2 pb-3 border-b border-white/[0.05] mb-3">
          <button id="toggle-sidebar" type="button"
            class="flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-xl hover:bg-white/[0.05] text-slate-500 hover:text-white transition-colors"
            aria-label="Toggle sidebar">
            <i data-lucide="panel-left-close" class="w-4 h-4"></i>
          </button>
          <span class="sidebar-label text-xs font-bold text-white transition-all">Navigation</span>
        </div>

        <!-- Browse By -->
        <div class="mb-6">
          <p
            class="sidebar-section-heading px-3 mb-2 text-[9px] font-black uppercase tracking-[0.22em] text-slate-700 transition-all">
            Browse
          </p>
          <div class="space-y-0.5">
            <button data-filter="all" class="sidebar-filter sidebar-filter--active">
              <i data-lucide="layout-grid"></i>
              <span class="sidebar-label">All Eras</span>
            </button>
            <button data-filter="recent" class="sidebar-filter">
              <i data-lucide="clock"></i>
              <span class="sidebar-label">Recent Myths</span>
            </button>
            <button data-filter="finished" class="sidebar-filter">
              <i data-lucide="check-circle"></i>
              <span class="sidebar-label">Completed</span>
            </button>
          </div>
        </div>

        <!-- Personal -->
        <div class="mb-6">
          <p
            class="sidebar-section-heading px-3 mb-2 text-[9px] font-black uppercase tracking-[0.22em] text-slate-700 transition-all">
            Personal
          </p>
          <div class="space-y-0.5">
            <button data-filter="bookmarked" class="sidebar-filter">
              <i data-lucide="bookmark"></i>
              <span class="sidebar-label">Bookmarks</span>
            </button>
            <button data-filter="my-tales" class="sidebar-filter">
              <i data-lucide="feather"></i>
              <span class="sidebar-label">My Tales</span>
            </button>
          </div>
        </div>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Submit Tale CTA -->
        <div class="mb-3">
          <button id="btn-submit-tale" type="button"
            class="w-full flex items-center justify-center gap-2.5 px-4 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-black uppercase tracking-widest transition-all shadow-lg shadow-indigo-600/20">
            <i data-lucide="plus" class="w-4 h-4 flex-shrink-0"></i>
            <span class="sidebar-label">Submit Tale</span>
          </button>
        </div>

        <!-- Auth user -->
        <div class="pt-3 border-t border-white/[0.05]">
          <div class="flex items-center gap-3 px-2 py-2">
            <div class="relative flex-shrink-0">
              <img id="sidebar-user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=guest" alt="Avatar"
                class="w-9 h-9 rounded-xl bg-zinc-800 border border-white/[0.08] object-cover" width="36" height="36" />
              <div
                class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-[#030305] rounded-full">
              </div>
            </div>
            <div class="sidebar-user-text min-w-0 transition-all">
              <p id="sidebar-user-name" class="text-xs font-bold text-white truncate">—</p>
              <p id="sidebar-user-sub" class="text-[10px] text-indigo-400 font-medium">Archive Member</p>
            </div>
          </div>
        </div>

      </div>
    </aside>

    <!-- ══════════════════════════════════════════
         MAIN CONTENT
         ══════════════════════════════════════════ -->
    <main id="library-main">
      <div class="max-w-[1500px] mx-auto">

        <!-- Page header -->
        <header class="flex flex-col lg:flex-row lg:items-end justify-between gap-8 mb-12">
          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <span class="h-px w-8 bg-indigo-500"></span>
              <p class="text-indigo-400 text-[10px] font-black uppercase tracking-[0.4em]">Knowledge Repository</p>
            </div>
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-white tracking-tighter uppercase leading-none">
              The
              <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-violet-400">Archives</span>
            </h1>
          </div>

          <!-- Search -->
          <div class="relative group w-full lg:w-[420px]">
            <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
              <i data-lucide="search"
                class="w-4 h-4 text-slate-600 group-focus-within:text-indigo-400 transition-colors"></i>
            </div>
            <input type="text" id="search-input" placeholder="Search the weave…" autocomplete="off"
              class="w-full rounded-2xl py-3.5 pl-12 pr-16 text-sm text-white placeholder:text-slate-700" />
            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
              <kbd
                class="px-2 py-1 rounded-lg bg-black/50 border border-white/[0.08] text-[9px] font-bold text-slate-600">
                ⌘K
              </kbd>
            </div>
          </div>
        </header>

        <!-- Era filter bar — populated dynamically by setupEraFilter() -->
        <div id="era-filter-bar" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1 mb-10" role="group"
          aria-label="Filter by era">
          <!-- Chips built by ui.js buildEraChips() after tales load -->
          <button data-era="all" class="era-chip era-chip--active">All Scrolls</button>
        </div>

        <!-- Cards grid -->
        <section id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-6 md:gap-8"
          aria-live="polite" aria-label="Tale cards">
          <!-- Populated by renderCardsGrid() via library.js -->
        </section>

      </div>
    </main>
  </div>

  <!-- ══════════════════════════════════════════
       CONFIRM MARK FINISHED MODAL
       ══════════════════════════════════════════ -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="bg-[#08080c] border border-white/[0.08] rounded-[2rem] p-10 w-full max-w-sm text-center shadow-2xl">
      <div class="w-14 h-14 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-lucide="check-circle" class="w-7 h-7 text-emerald-400"></i>
      </div>
      <h3 id="confirm-title" class="text-lg font-bold text-white uppercase tracking-tight mb-3">
        Seal this <span class="text-emerald-400">Chronicle?</span>
      </h3>
      <p class="text-xs text-slate-500 leading-relaxed mb-8 italic">
        Once a tale is marked as finished, its path is recorded in the Eternal Archives. This cannot be undone.
      </p>
      <div class="flex flex-col gap-3">
        <button id="confirm-accept"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] transition-all shadow-lg shadow-emerald-600/20">
          Confirm Completion
        </button>
        <button id="confirm-cancel"
          class="w-full py-3.5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 hover:text-white transition-colors">
          Return to Weave
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       COPY LINK MODAL
       ══════════════════════════════════════════ -->
  <div id="copy-link-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="copy-link-title">
    <div class="bg-[#08080c]/95 border border-white/[0.08] rounded-[2rem] p-8 w-full max-w-sm shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center flex-shrink-0">
          <i data-lucide="share-2" class="w-5 h-5 text-indigo-400"></i>
        </div>
        <div>
          <h3 id="copy-link-title" class="text-sm font-black uppercase tracking-[0.2em] text-white">Share Fragment</h3>
          <p class="text-[10px] text-slate-600 uppercase tracking-widest mt-0.5">Generate access link</p>
        </div>
      </div>

      <div class="relative mb-6">
        <input id="copy-link-input" readonly
          class="w-full bg-black/40 border border-white/[0.07] rounded-xl py-3.5 pl-4 pr-10 text-xs font-mono text-indigo-300 focus:outline-none" />
        <div class="absolute right-4 inset-y-0 flex items-center pointer-events-none">
          <i data-lucide="link" class="w-4 h-4 text-slate-700"></i>
        </div>
      </div>

      <div class="flex items-center justify-end gap-5">
        <button id="copy-link-close"
          class="text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-white transition-colors">
          Dismiss
        </button>
        <button id="copy-link-confirm"
          class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-indigo-600/20">
          Copy Link
        </button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.lucide?.createIcons?.();
    });
  </script>

</body>

</html>

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch instead of letting them queue
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  functions-typecheck:
    name: Cloud Functions Typecheck
    runs-on: ubuntu-latest
    # These functions are written and compiled but not deployed (this project
    # stays on Firebase's free Spark plan; Cloud Functions of any kind require
    # Blaze — see functions/README.md). This job exists to catch a broken
    # build before it becomes a surprise on the day this project does move to
    # Blaze, not because anything here runs in production today.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npx tsc

  rules-tests:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The Firestore emulator is a JVM process — needs a real Java runtime,
      # not just the Firebase CLI. firebase-tools 15+ requires Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Runs against local emulators, not the production project: the suite needs
    # published tales, and placeholder credentials cannot read real data. The
    # seed script writes through the emulator's admin bypass, so no secrets are
    # required and CI never touches production.
    env:
      VITE_FIREBASE_API_KEY: 'demo-api-key'
      VITE_FIREBASE_AUTH_DOMAIN: 'demo-taletranscend.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'demo-taletranscend'
      VITE_FIREBASE_STORAGE_BUCKET: 'demo-taletranscend.appspot.com'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      VITE_FIREBASE_USE_EMULATOR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The Firestore emulator is a JVM process — needs a real Java runtime,
      # not just the Firebase CLI. firebase-tools 15+ requires Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # playwright.config.js runs both a chromium and a firefox project, and
      # starts its own dev server (npx vite) automatically via `webServer` —
      # no separate build step needed here.
      - run: npx playwright install --with-deps
      - name: Run e2e against the Firebase emulators
        run: |
          npx firebase emulators:exec --only firestore,auth --project demo-taletranscend \
            "node e2e/seed-emulator.mjs && npm run e2e"

  # A single required status check to point branch protection at, instead of
  # having to list every job above individually (and remember to update the
  # branch protection rule every time a job is renamed or added).
  ci-required:
    name: CI required checks passed
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, functions-typecheck, rules-tests, e2e]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi

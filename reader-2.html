<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reader | TaleTranscend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #0a0a0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --glass: rgba(30, 30, 35, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --reader-size: 1.25rem;
            --reader-height: 1.85;
            --reader-font: 'Crimson Pro', serif;
        }

        body.theme-sepia {
            --paper-bg: #f4ecd8;
            --text-main: #433422;
            --text-muted: #8c7e6a;
            --glass: rgba(67, 52, 34, 0.05);
            --border: rgba(67, 52, 34, 0.12);
            --accent: #936639;
        }

        body.theme-light {
            --paper-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass: rgba(0, 0, 0, 0.03);
            --border: rgba(0, 0, 0, 0.08);
            --accent: #4f46e5;
        }

        body {
            background-color: var(--paper-bg);
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent double scrollbars */
        }

        .glass-card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
        }

        /* --- POPUP & DRAWER LOGIC --- */
        .popup-window {
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        #mobile-drawer {
            position: fixed;
            inset-x: 0;
            bottom: 0;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            background: var(--paper-bg);
            border-top: 1px solid var(--border);
        }

        #mobile-drawer.open { transform: translateY(0); }

        /* --- SCRIM --- */
        #global-scrim {
            position: fixed;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 90;
            transition: opacity 0.4s ease;
        }
        #global-scrim.active {
            opacity: 0.5;
            pointer-events: auto;
        }

        /* --- CONTENT AREA --- */
        .story-scroll-area {
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 120px;
        }

        .serif-content {
            font-family: var(--reader-font);
            font-size: var(--reader-size);
            line-height: var(--reader-height);
            color: var(--text-main);
            transition: font-size 0.2s ease;
        }

        .theme-btn.active, .font-btn.active {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
        }
    </style>
</head>
<body>

    <div id="global-scrim"></div>

    <header class="fixed top-0 w-full z-[60] bg-[var(--paper-bg)]/80 backdrop-blur-xl border-b border-[var(--border)]">
        <div class="max-w-[1600px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button id="exit-btn" class="p-2 text-[var(--text-muted)] hover:text-indigo-400">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <h1 id="header-story-title" class="text-[10px] font-black text-[var(--text-main)] uppercase tracking-[0.2em] truncate max-w-[150px]">Loading...</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="font-style-trigger" class="hidden md:flex w-10 h-10 rounded-full items-center justify-center border border-[var(--border)]"><i data-lucide="type" class="w-4 h-4"></i></button>
                <button id="font-size-trigger" class="hidden md:flex w-10 h-10 rounded-full items-center justify-center border border-[var(--border)]"><i data-lucide="a-large-small" class="w-4 h-4"></i></button>
            </div>
        </div>
    </header>

    <div id="font-style-popup" class="popup-window fixed hidden z-[110] w-64 p-6">
        <h4 class="text-[9px] font-black uppercase text-indigo-400 mb-4">Font Style</h4>
        <div class="flex flex-col gap-2">
            <button data-font="serif" class="font-btn w-full py-3 rounded-xl border border-[var(--border)] uppercase text-[10px] font-bold">Serif</button>
            <button data-font="sans" class="font-btn w-full py-3 rounded-xl border border-[var(--border)] uppercase text-[10px] font-bold">Sans</button>
        </div>
    </div>

    <div id="font-size-popup" class="popup-window fixed hidden z-[110] w-64 p-6">
        <h4 class="text-[9px] font-black uppercase text-indigo-400 mb-4">Text Scale</h4>
        <input type="range" min="14" max="30" value="18" class="w-full accent-indigo-500 font-size-slider">
    </div>

    <main class="story-scroll-area">
        <article class="max-w-2xl mx-auto px-6 pt-32 pb-40">
            <div class="mb-12">
                <span id="chapter-label" class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">Fragment --</span>
                <h2 id="chapter-title" class="text-4xl md:text-7xl font-black text-[var(--text-main)] mt-4 leading-tight uppercase tracking-tighter">Connecting...</h2>
            </div>
            <div id="story-content" class="serif-content"></div>
        </article>
    </main>

    <div id="mobile-drawer" class="lg:hidden rounded-t-[2.5rem] p-8 pb-12 shadow-2xl">
        <div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-8"></div>
        <div class="space-y-8">
            <div class="grid grid-cols-3 gap-3">
                <button data-theme="dark" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Dark</button>
                <button data-theme="sepia" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Sepia</button>
                <button data-theme="light" class="theme-btn py-4 rounded-2xl text-[10px] font-black uppercase border border-[var(--border)]">Light</button>
            </div>
            <div class="flex gap-4">
                <button data-font="serif" class="font-btn grow py-4 rounded-2xl text-[10px] border border-[var(--border)] uppercase font-bold">Serif</button>
                <button data-font="sans" class="font-btn grow py-4 rounded-2xl text-[10px] border border-[var(--border)] uppercase font-bold">Sans</button>
            </div>
            <div class="space-y-4">
                <p class="text-[9px] font-black text-indigo-500 uppercase text-center">Reading Size</p>
                <input type="range" min="14" max="28" value="18" class="w-full accent-indigo-500 font-size-slider">
            </div>
        </div>
    </div>

    <nav class="lg:hidden fixed bottom-0 inset-x-0 h-20 bg-[var(--paper-bg)]/90 backdrop-blur-2xl border-t border-[var(--border)] px-8 flex items-center justify-between z-[80]">
        <button id="mobile-exit" class="p-4"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <button id="drawer-trigger" class="bg-indigo-600 px-10 py-3 rounded-xl text-[10px] font-black text-white uppercase tracking-widest shadow-lg active:scale-95 transition-transform">Settings</button>
        <button class="p-4"><i data-lucide="share-2" class="w-5 h-5"></i></button>
    </nav>

    <script type="module">
        // --- 1. ROBUST UI INITIALIZATION ---
        const UI = {
            scrim: document.getElementById('global-scrim'),
            drawer: document.getElementById('mobile-drawer'),
            popups: document.querySelectorAll('.popup-window'),

            closeAll() {
                this.popups.forEach(p => p.classList.add('hidden'));
                this.drawer.classList.remove('open');
                this.scrim.classList.remove('active');
            }
        };

        // UI Event Listeners (Run these first!)
        document.getElementById('drawer-trigger').addEventListener('click', (e) => {
            e.stopPropagation();
            UI.drawer.classList.toggle('open');
            UI.scrim.classList.toggle('active');
        });

        UI.scrim.addEventListener('click', () => UI.closeAll());

        // Setup Desktop Popups
        function setupPopup(triggerId, popupId) {
            const btn = document.getElementById(triggerId);
            const popup = document.getElementById(popupId);
            if (!btn || !popup) return;
            
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = popup.classList.contains('hidden');
                UI.closeAll();
                if (isHidden) {
                    const rect = btn.getBoundingClientRect();
                    popup.style.top = (rect.bottom + 10) + 'px';
                    popup.style.left = (rect.left - 100) + 'px';
                    popup.classList.remove('hidden');
                    UI.scrim.classList.add('active');
                }
            });
        }
        setupPopup('font-style-trigger', 'font-style-popup');
        setupPopup('font-size-trigger', 'font-size-popup');

        // Theme & Font Controls
        const Reader = {
            setTheme(theme) {
                document.body.className = theme === 'dark' ? '' : 'theme-' + theme;
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
                localStorage.setItem('reader-theme', theme);
            },
            setFont(font) {
                const fontStack = font === 'serif' ? "'Crimson Pro', serif" : "'Plus Jakarta Sans', sans-serif";
                document.documentElement.style.setProperty('--reader-font', fontStack);
                document.querySelectorAll('.font-btn').forEach(b => b.classList.toggle('active', b.dataset.font === font));
                localStorage.setItem('reader-font', font);
            },
            setSize(val) {
                document.documentElement.style.setProperty('--reader-size', val + 'px');
                document.querySelectorAll('.font-size-slider').forEach(s => s.value = val);
                localStorage.setItem('reader-size', val);
            }
        };

        document.querySelectorAll('.theme-btn').forEach(b => b.onclick = () => Reader.setTheme(b.dataset.theme));
        document.querySelectorAll('.font-btn').forEach(b => b.onclick = () => Reader.setFont(b.dataset.font));
        document.querySelectorAll('.font-size-slider').forEach(s => s.oninput = (e) => Reader.setSize(e.target.value));

        // --- 2. FIREBASE (With Error Catching) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        
        // Safety wrapper for config
        let firebaseConfig = {};
        try {
            const configModule = await import('/firebase-config.js');
            firebaseConfig = configModule.default;
        } catch (e) {
            console.error("Firebase Config missing or inaccessible.", e);
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const taleId = urlParams.get('taleId');
        const chapterIdx = parseInt(urlParams.get('chapterId')) || 0;

        async function loadContent() {
            if (!taleId) return;
            try {
                const taleRef = doc(db, 'artifacts', 'taletranscend-pro', 'public', 'data', 'community_tales', taleId);
                const snap = await getDoc(taleRef);
                if (snap.exists()) {
                    document.getElementById('header-story-title').textContent = snap.data().title;
                }
                // (Chapter loading logic remains same as before)
                document.getElementById('chapter-title').textContent = "Chapter Data Loaded";
                document.getElementById('story-content').innerHTML = "<p>Narrative data successfully decrypted from archive.</p>";
                lucide.createIcons();
            } catch (err) { console.error(err); }
        }

        // --- 3. RUN ---
        Reader.setTheme(localStorage.getItem('reader-theme') || 'dark');
        Reader.setFont(localStorage.getItem('reader-font') || 'serif');
        Reader.setSize(localStorage.getItem('reader-size') || '18');
        loadContent();
        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap');

        /* Target the bar itself */
        ::-webkit-scrollbar {
        width: 4px;
        }

        /* Target the track */
        ::-webkit-scrollbar-track {
        background: transparent;
        }

        /* Target the thumb */
        ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 10px;
        }
        
        body {
            background: #0a0a0c;
            color: #e2e8f0;
            font-family: 'Fauna One', serif;
            overflow: hidden; /* We'll use internal scrolls for the "app" feel */
        }
        .fancy-title { font-family: 'Cinzel', serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chapter-tab {
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }
        .chapter-tab.active {
            background: rgba(139, 92, 246, 0.1);
            border-left-color: #8b5cf6;
            color: #fff;
        }

        .writing-area {
            background: transparent;
            resize: none;
            outline: none;
            line-height: 2;
            font-size: 1.15rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d2d35; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 flex justify-between items-center px-6 border-b border-white/5 z-10 shrink-0">
        <div class="flex items-center gap-6">
            <a href="profile.html" class="text-xs uppercase tracking-tighter text-gray-500 hover:text-white transition-colors">
                ← Exit Studio
            </a>
            <h1 class="fancy-title text-lg font-bold tracking-[0.2em] text-purple-400">Tale Architect</h1>
        </div>
        <div class="flex gap-4">
            <button id="save-draft-btn" onclick="saveToCloud()" class="text-xs text-gray-400 hover:text-white px-4">Auto-saving...</button>
            <button onclick="publishFullTale()" class="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded shadow-lg shadow-purple-900/20">
                Publish Work
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Chapter Management -->
        <aside class="w-64 glass-panel flex flex-col shrink-0">
            <div class="p-4 border-b border-white/5">
                <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">Manuscript</label>
                <input type="text" id="tale-title" placeholder="Tale Title..." 
                       class="w-full bg-transparent fancy-title text-sm border-none outline-none text-purple-200">
            </div>
            
            <div id="chapter-list" class="flex-1 overflow-y-auto py-2">
                <!-- Chapters injected here -->
            </div>

            <button onclick="addNewChapter()" class="m-4 p-3 border border-dashed border-white/10 rounded-lg text-xs text-gray-400 hover:border-purple-500/50 hover:text-purple-300 transition-all">
                + Add New Chapter
            </button>
        </aside>

        <!-- Main Editor -->
        <main class="flex-1 flex flex-col bg-[#0d0d11]">
            <div class="max-w-3xl mx-auto w-full flex flex-1 flex-col p-8 lg:p-16 overflow-y-auto">
                
                <!-- Chapter Title -->
                <div class="mb-10">
                    <input type="text" id="current-chapter-title" 
                           class="w-full bg-transparent text-4xl fancy-title border-none outline-none text-white placeholder-gray-800"
                           placeholder="Chapter Title..."
                           oninput="updateSidebarTitle(this.value)">
                </div>

                <!-- AI Tools Bar -->
                <div class="flex gap-2 mb-6">
                    <button onclick="aiHelp('continue')" class="text-[10px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded text-gray-400 border border-white/5">✨ Continue Scene</button>
                    <button onclick="aiHelp('describe')" class="text-[10px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded text-gray-400 border border-white/5">🎭 Enhance Description</button>
                </div>

                <!-- Writing Area -->
                <textarea id="chapter-content" 
                          class="writing-area w-full flex-1 text-gray-300" 
                          placeholder="Your story begins here..."
                          oninput="autoSaveLocal()"></textarea>

                <div class="mt-8 pt-4 border-t border-white/5 flex justify-between items-center text-[10px] text-gray-600 uppercase tracking-widest">
                    <span id="stat-words">0 Words</span>
                    <span id="stat-status">Unsaved Changes</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taletranscend-pro';
        const apiKey = "";

        // State Management
        let chapters = [
            { id: crypto.randomUUID(), title: "Chapter I", content: "" }
        ];
        let activeChapterId = chapters[0].id;
        let currentUser = null;

        // Init
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadFromLocal(); // Try to recover work from local storage first
                renderSidebar();
            } else {
                signInAnonymously(auth);
            }
        });

        window.addNewChapter = () => {
            saveCurrentState();
            const newCh = { 
                id: crypto.randomUUID(), 
                title: `Chapter ${chapters.length + 1}`, 
                content: "" 
            };
            chapters.push(newCh);
            switchChapter(newCh.id);
        };

        window.switchChapter = (id) => {
            saveCurrentState();
            activeChapterId = id;
            const ch = chapters.find(c => c.id === id);
            document.getElementById('current-chapter-title').value = ch.title;
            document.getElementById('chapter-content').value = ch.content;
            renderSidebar();
            updateStats();
        };

        function saveCurrentState() {
            const index = chapters.findIndex(c => c.id === activeChapterId);
            if (index !== -1) {
                chapters[index].title = document.getElementById('current-chapter-title').value || "Untitled";
                chapters[index].content = document.getElementById('chapter-content').value;
            }
            autoSaveLocal();
        }

        window.updateSidebarTitle = (val) => {
            const activeEl = document.querySelector(`[data-id="${activeChapterId}"] .title-text`);
            if (activeEl) activeEl.innerText = val || "Untitled Chapter";
        };

        function renderSidebar() {
            const list = document.getElementById('chapter-list');
            list.innerHTML = chapters.map((ch, idx) => `
                <div onclick="switchChapter('${ch.id}')" data-id="${ch.id}" 
                     class="chapter-tab p-4 cursor-pointer hover:bg-white/5 ${ch.id === activeChapterId ? 'active' : ''}">
                    <div class="text-[10px] text-gray-500 mb-1">0${idx + 1}</div>
                    <div class="title-text text-xs truncate">${ch.title || 'Untitled'}</div>
                </div>
            `).join('');
        }

        function autoSaveLocal() {
            const data = {
                taleTitle: document.getElementById('tale-title').value,
                chapters: chapters,
                activeId: activeChapterId
            };
            localStorage.setItem('tale_draft', JSON.stringify(data));
            document.getElementById('stat-status').innerText = "Changes Drafted";
            updateStats();
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('tale_draft');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('tale-title').value = data.taleTitle || "";
                chapters = data.chapters;
                activeChapterId = data.activeId || chapters[0].id;
                switchChapter(activeChapterId);
            }
        }

        function updateStats() {
            const content = document.getElementById('chapter-content').value;
            const words = content.trim() ? content.trim().split(/\s+/).length : 0;
            document.getElementById('stat-words').innerText = `${words} Words`;
        }

        // Firebase Persistence
        window.saveToCloud = async () => {
            if (!currentUser) return;
            saveCurrentState();
            const btn = document.getElementById('save-draft-btn');
            btn.innerText = "Saving to Cloud...";
            
            try {
                const taleRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'drafts', 'current_work');
                await setDoc(taleRef, {
                    title: document.getElementById('tale-title').value,
                    chapters,
                    updatedAt: serverTimestamp()
                });
                btn.innerText = "All changes saved";
                document.getElementById('stat-status').innerText = "Synced to Cloud";
            } catch (err) {
                btn.innerText = "Sync Failed";
            }
        };

        window.publishFullTale = async () => {
            if (!currentUser) return;
            saveCurrentState();
            
            const mainTitle = document.getElementById('tale-title').value;
            if (!mainTitle) return alert("Please give your tale a title.");

            try {
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', `tale_${Date.now()}`);
                await setDoc(publicRef, {
                    title: mainTitle,
                    chapters, // Saving the full array of chapters
                    authorId: currentUser.uid,
                    publishedAt: serverTimestamp(),
                    chapterCount: chapters.length,
                    totalWords: chapters.reduce((acc, ch) => acc + ch.content.split(/\s+/).length, 0)
                });
                alert("The complete manuscript has been archived!");
                window.location.href = "profile.html";
            } catch (err) {
                console.error(err);
                alert("Archival failed.");
            }
        };

        // AI Help Simulation
        window.aiHelp = async (type) => {
            const content = document.getElementById('chapter-content').value;
            const status = document.getElementById('stat-status');
            status.innerText = "Consulting AI...";
            
            try {
                const prompt = type === 'continue' 
                    ? `Continue this story for one paragraph: ${content.slice(-500)}` 
                    : `Rewrite this paragraph to be more descriptive and evocative: ${content.slice(-500)}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                document.getElementById('chapter-content').value += "\n\n" + aiText;
                saveCurrentState();
                status.innerText = "AI Insight added";
            } catch (err) {
                status.innerText = "AI Unavailable";
            }
        };

    </script>
</body>
</html>

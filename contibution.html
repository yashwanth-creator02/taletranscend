<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fauna+One&display=swap');

        /* Target the bar itself */
        ::-webkit-scrollbar {
        width: 4px;
        }

        /* Target the track */
        ::-webkit-scrollbar-track {
        background: transparent;
        }

        /* Target the thumb */
        ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 10px;
        }
        
        body {
            background: #0a0a0c;
            color: #e2e8f0;
            font-family: 'Fauna One', serif;
            overflow: hidden; /* We'll use internal scrolls for the "app" feel */
        }
        .fancy-title { font-family: 'Cinzel', serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chapter-tab {
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }
        .chapter-tab.active {
            background: rgba(139, 92, 246, 0.1);
            border-left-color: #8b5cf6;
            color: #fff;
        }

        .writing-area {
            background: transparent;
            resize: none;
            outline: none;
            line-height: 2;
            font-size: 1.15rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d2d35; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 flex justify-between items-center px-6 border-b border-white/5 z-10 shrink-0">
        <div class="flex items-center gap-6">
            <a href="profile.html" class="text-xs uppercase tracking-tighter text-gray-500 hover:text-white transition-colors">
                ← Exit Studio
            </a>
            <h1 class="fancy-title text-lg font-bold tracking-[0.2em] text-purple-400">Tale Architect</h1>
        </div>
        <div class="flex gap-4">
            <button id="save-draft-btn" onclick="saveToCloud()" class="text-xs text-gray-400 hover:text-white px-4">Auto-saving...</button>
            <button onclick="publishFullTale()" class="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded shadow-lg shadow-purple-900/20">
                Publish Work
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Chapter Management -->
        <aside class="w-64 glass-panel flex flex-col shrink-0">
            <div class="p-4 border-b border-white/5">
                <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">Manuscript</label>
                <input type="text" id="tale-title" placeholder="Tale Title..." 
                       class="w-full bg-transparent fancy-title text-sm border-none outline-none text-purple-200">
            </div>
            
            <div id="chapter-list" class="flex-1 overflow-y-auto py-2">
                <!-- Chapters injected here -->
            </div>

            <button onclick="addNewChapter()" class="m-4 p-3 border border-dashed border-white/10 rounded-lg text-xs text-gray-400 hover:border-purple-500/50 hover:text-purple-300 transition-all">
                + Add New Chapter
            </button>
        </aside>

        <!-- Main Editor -->
        <main class="flex-1 flex flex-col bg-[#0d0d11]">
            <div class="max-w-3xl mx-auto w-full flex flex-1 flex-col p-8 lg:p-16 overflow-y-auto">
                
                <!-- Chapter Title -->
                <div class="mb-10">
                    <input type="text" id="current-chapter-title" 
                           class="w-full bg-transparent text-4xl fancy-title border-none outline-none text-white placeholder-gray-800"
                           placeholder="Chapter Title..."
                           oninput="updateSidebarTitle(this.value)">
                </div>

                <!-- AI Tools Bar -->
                <div class="flex gap-2 mb-6">
                    <button onclick="aiHelp('continue')" class="text-[10px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded text-gray-400 border border-white/5">✨ Continue Scene</button>
                    <button onclick="aiHelp('describe')" class="text-[10px] bg-white/5 hover:bg-white/10 px-3 py-1 rounded text-gray-400 border border-white/5">🎭 Enhance Description</button>
                </div>

                <!-- Writing Area -->
                <textarea id="chapter-content" 
                          class="writing-area w-full flex-1 text-gray-300" 
                          placeholder="Your story begins here..."
                          oninput="autoSaveLocal()"></textarea>

                <div class="mt-8 pt-4 border-t border-white/5 flex justify-between items-center text-[10px] text-gray-600 uppercase tracking-widest">
                    <span id="stat-words">0 Words</span>
                    <span id="stat-status">Unsaved Changes</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/js/contribution/contribution.js"></script>

</body>
</html>
